<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小鬼在哪里？— Комната</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  html, body {
    margin: 0; height: 100%;
    background: #000;
    font-family: 'Georgia', 'Segoe UI', serif;
    overflow: hidden;
    color: #e0d0e0;
  }

  #start-screen {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, #1a0a14 0%, #000 70%);
    z-index: 5000;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    cursor: pointer;
  }
  #start-screen::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(80,20,40,0.35) 0%, transparent 45%),
      radial-gradient(ellipse at 70% 60%, rgba(40,10,30,0.5) 0%, transparent 50%);
    animation: startPulse 4s ease-in-out infinite alternate;
  }
  @keyframes startPulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
  #start-screen.hidden { opacity: 0; pointer-events: none; transition: opacity 1.2s ease; }
  #start-title {
    font-size: 84px; letter-spacing: 12px; color: #c8a8d8;
    text-shadow: 0 0 30px rgba(180,60,180,0.9), 0 0 60px rgba(120,30,120,0.7), 0 0 100px rgba(80,10,80,0.5);
    margin-bottom: 30px; position: relative; z-index: 2; font-weight: 900;
  }
  #start-btn {
    font-size: 32px; letter-spacing: 8px; color: #e0c8f0;
    background: rgba(40,10,50,0.6); border: 2px solid #8030a0; border-radius: 8px;
    padding: 22px 70px; cursor: pointer; transition: all 0.4s ease;
    text-shadow: 0 0 12px rgba(200,80,220,0.9);
    box-shadow: 0 0 40px rgba(120,30,160,0.6), inset 0 0 30px rgba(60,10,80,0.5);
    z-index: 2; position: relative; font-family: inherit;
  }
  #start-btn:hover {
    background: rgba(80,20,100,0.7); border-color: #c040e0; color: #fff;
    box-shadow: 0 0 60px rgba(160,40,200,0.9), inset 0 0 40px rgba(100,20,130,0.7);
    transform: scale(1.05);
  }
  .start-ghost {
    position: absolute; font-size: 90px; opacity: 0.15;
    filter: blur(1px) drop-shadow(0 0 30px rgba(180,255,255,0.5));
    animation: startGhostFloat 6s ease-in-out infinite;
  }
  .start-ghost.g1 { top: 8%; left: 8%; }
  .start-ghost.g2 { top: 12%; right: 10%; animation-delay: 2s; font-size: 70px; }
  .start-ghost.g3 { bottom: 10%; left: 12%; animation-delay: 3.5s; font-size: 60px; }
  .start-ghost.g4 { bottom: 8%; right: 8%; animation-delay: 1.5s; }
  @keyframes startGhostFloat {
    0%,100% { transform: translateY(0) rotate(-3deg); opacity: 0.15; }
    50%     { transform: translateY(-20px) rotate(3deg); opacity: 0.3; }
  }

  #scene {
    position: fixed; inset: 0;
    overflow: hidden;
    background: #000;
    display: block;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  #scene.visible { opacity: 1; }

  #frame {
    position: absolute;
    left: 50%; top: 50%;
    width: 2000px;
    height: 1000px;
    margin-left: -1000px;
    margin-top: -500px;
    transform-origin: center center;
    overflow: hidden;
    background: #000;
    box-shadow:
      0 0 100px rgba(120, 40, 160, 0.35),
      inset 0 0 200px rgba(0, 0, 0, 0.95);
  }

  #world {
    position: absolute; left: 0; top: 0;
    width: 2000px; height: 1000px;
    perspective: 1800px;
    perspective-origin: 50% 38%;
    overflow: hidden;
    background: #000;
  }

  .wall {
    position: absolute; left: 0; top: 0;
    width: 2000px; height: 640px;
    background:
      radial-gradient(circle at 18% 32%, rgba(35,55,30,0.55) 0%, transparent 18%),
      radial-gradient(circle at 72% 50%, rgba(50,28,42,0.7) 0%, transparent 22%),
      radial-gradient(circle at 42% 78%, rgba(28,38,22,0.5) 0%, transparent 20%),
      radial-gradient(circle at 88% 18%, rgba(60,30,30,0.5) 0%, transparent 16%),
      repeating-linear-gradient(90deg,
        #1e1416 0 3px, #1a1012 3px 46px, #140a0c 46px 48px),
      #1a1012;
    box-shadow:
      inset 0 -140px 180px rgba(0,0,0,0.98),
      inset 0 0 300px rgba(0,0,0,0.85);
  }
  .wall::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(118deg, transparent 48%, rgba(0,0,0,0.75) 49%, transparent 50%),
      linear-gradient(82deg, transparent 48%, rgba(0,0,0,0.6) 49%, transparent 50%),
      linear-gradient(155deg, transparent 48%, rgba(0,0,0,0.45) 49%, transparent 50%);
    background-size: 320px 320px, 480px 480px, 640px 640px;
    background-position: 15% 30%, 70% 60%, 40% 10%;
    opacity: 0.9; pointer-events: none;
  }
  .wall::after {
    content: ''; position: absolute;
    left: 0; top: 0; right: 0; height: 120px;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(0,0,0,0.8) 0%, transparent 40%),
      radial-gradient(ellipse at 55% 0%, rgba(0,0,0,0.9) 0%, transparent 35%),
      radial-gradient(ellipse at 85% 0%, rgba(0,0,0,0.85) 0%, transparent 38%),
      linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
    pointer-events: none;
  }

  .floor {
    position: absolute; left: 0; top: 640px;
    width: 2000px; height: 360px;
    transform-origin: top;
    transform: rotateX(-72deg);
    background:
      repeating-linear-gradient(0deg,
        #2a1a10 0 68px, #180e08 68px 74px),
      repeating-linear-gradient(90deg,
        rgba(0,0,0,0.5) 0 2px, transparent 2px 140px),
      linear-gradient(180deg, #3a2416 0%, #1a0e08 55%, #080404 100%);
    box-shadow:
      inset 0 100px 140px rgba(0,0,0,0.85),
      inset 0 -40px 80px rgba(0,0,0,0.9);
    transform-style: preserve-3d;
  }
  .floor::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 65%, rgba(90,50,25,0.55) 0%, transparent 22%),
      radial-gradient(ellipse at 72% 45%, rgba(70,40,20,0.6) 0%, transparent 28%);
    pointer-events: none;
  }
  .floor::after {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 22% 30%, rgba(255,170,80,0.28) 0%, transparent 35%),
      radial-gradient(ellipse at 78% 25%, rgba(255,150,70,0.22) 0%, transparent 40%);
    mix-blend-mode: screen; pointer-events: none;
  }

  .ceiling {
    position: absolute; left: 0; top: -220px;
    width: 2000px; height: 220px;
    transform-origin: bottom;
    transform: rotateX(68deg);
    background:
      radial-gradient(ellipse at 30% 100%, rgba(60,30,20,0.4) 0%, transparent 40%),
      radial-gradient(ellipse at 70% 100%, rgba(50,25,15,0.5) 0%, transparent 45%),
      linear-gradient(180deg, #000 0%, #0a0505 100%);
    box-shadow: inset 0 60px 120px rgba(0,0,0,1);
  }

  .light-pool {
    position: absolute; top: 640px;
    width: 700px; height: 380px;
    transform: rotateX(-72deg);
    transform-origin: top;
    pointer-events: none; mix-blend-mode: screen;
    animation: lightFlicker 2.6s infinite alternate;
  }
  .light-pool.a { left: 40px;   background: radial-gradient(ellipse at center, rgba(255,180,90,0.32) 0%, rgba(255,140,60,0.12) 45%, transparent 78%); }
  .light-pool.b { left: 660px;  background: radial-gradient(ellipse at center, rgba(255,160,70,0.28) 0%, rgba(255,120,50,0.1) 45%, transparent 78%); }
  .light-pool.c { left: 1280px; background: radial-gradient(ellipse at center, rgba(255,150,60,0.26) 0%, rgba(255,110,40,0.1) 45%, transparent 78%); }
  @keyframes lightFlicker {
    0%,100% { opacity: 0.95; } 40% { opacity: 0.75; } 70% { opacity: 0.9; }
  }

  .cobweb {
    position: absolute; pointer-events: none;
    opacity: 0.7;
    filter: drop-shadow(0 0 3px rgba(210,210,230,0.4));
    z-index: 300;
  }
  .cobweb.tl { top: 0; left: 0; }
  .cobweb.tr { top: 0; right: 0; transform: scaleX(-1); }
  .cobweb.bl { bottom: 22%; left: 0; transform: scaleY(-1) scale(1.2); }
  .cobweb.br { bottom: 22%; right: 0; transform: scale(-1,-1) scale(1.2); }
  .cobweb.mid-l { top: 38%; left: 0; transform: scale(0.8); opacity: 0.5; }
  .cobweb.mid-r { top: 42%; right: 0; transform: scale(0.9) scaleX(-1); opacity: 0.55; }

  .candle { position: absolute; width: 24px; height: 90px; z-index: 55; filter: drop-shadow(0 14px 18px rgba(0,0,0,0.95)); }
  .candle .holder { position: absolute; bottom: 0; left: 50%; width: 38px; height: 12px; transform: translateX(-50%);
    background: linear-gradient(180deg, #4a3520 0%, #2a1a0e 100%); border-radius: 4px 4px 8px 8px;
    box-shadow: inset 0 2px 3px rgba(255,200,140,0.3), 0 4px 8px rgba(0,0,0,0.9); }
  .candle .body { position: absolute; bottom: 12px; left: 50%; width: 18px; height: 50px; transform: translateX(-50%);
    background: linear-gradient(90deg, #a89870 0%, #f0e8c8 45%, #d8c8a0 70%, #8a7a58 100%); border-radius: 3px 3px 2px 2px;
    box-shadow: inset -2px 0 4px rgba(0,0,0,0.4), inset 2px 0 3px rgba(255,255,255,0.2); }
  .candle .wax { position: absolute; bottom: 56px; left: 50%; width: 22px; height: 14px; transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 30%, #f0e8c8 0%, #a89870 70%, transparent 100%); border-radius: 40% 40% 50% 50%; }
  .candle .wick { position: absolute; bottom: 61px; left: 50%; width: 2px; height: 5px; background: #050505; transform: translateX(-50%); }
  .candle .flame { position: absolute; bottom: 64px; left: 50%; width: 14px; height: 26px; transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 78%, #fff8d0 0%, #ffe070 30%, #ffb040 55%, #ff6020 78%, transparent 100%);
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    filter: drop-shadow(0 0 24px #ffaa33) drop-shadow(0 0 45px #ff7722) blur(0.5px);
    animation: flicker 0.14s infinite alternate; transform-origin: bottom center; }
  @keyframes flicker {
    0%   { transform: translateX(-50%) scale(1, 1) rotate(-3deg); opacity: 1; }
    50%  { transform: translateX(-50%) scale(1.05, 0.95) rotate(2deg); opacity: 0.9; }
    100% { transform: translateX(-50%) scale(0.97, 1.05) rotate(-1deg); opacity: 0.95; }
  }

  .object {
    position: absolute; cursor: pointer; z-index: 100;
    transition: transform 0.7s cubic-bezier(.34,1.4,.5,1);
  }
  .object svg {
    display: block; width: 100%; height: 100%;
    overflow: hidden; transform: translateZ(0); backface-visibility: hidden;
  }
  .object::after {
    content: ""; position: absolute; inset: -50px; border-radius: 50%;
    background: radial-gradient(ellipse at center,
        rgba(205, 145, 255, 0.38) 0%,
        rgba(180, 120, 255, 0.20) 38%,
        rgba(150, 90, 255, 0) 72%);
    opacity: 0; pointer-events: none; z-index: -1; transition: opacity 0.2s ease;
  }
  .object:hover::after { opacity: 1; }

  .wallghost {
    opacity: 0.62;
    pointer-events: none;
    z-index: 48;
    filter: blur(1px);
  }

  .lid, .door-l, .door-r, .cork, .cushion, .books, .drawer, .painting {
    transition: transform 0.7s cubic-bezier(.34,1.4,.5,1);
    transform-origin: center; transform-box: fill-box;
  }

  .tv-static { opacity: 0; transition: opacity 0.35s ease; pointer-events: none; }
  .tv-static.on { opacity: 1; animation: tvNoiseMove 0.12s steps(2) infinite; }
  @keyframes tvNoiseMove {
    0% { transform: translate(0, 0); } 25% { transform: translate(-2px, 1px); }
    50% { transform: translate(1px, -2px); } 75% { transform: translate(2px, 2px); }
    100% { transform: translate(-1px, -1px); }
  }
  .tv-screen-glow { opacity: 0; transition: opacity 0.3s ease; }
  .tv-screen-glow.on { opacity: 0.85; animation: tvFlicker 0.08s steps(2) infinite; }
  @keyframes tvFlicker { 0% { opacity: 0.85; } 50% { opacity: 0.65; } 100% { opacity: 0.9; } }
  .tv-girl { opacity: 0; transition: opacity 1.4s ease; pointer-events: none; }
  .tv-girl.on { opacity: 1; animation: tvGirlFlicker 0.18s steps(3) infinite; }
  @keyframes tvGirlFlicker { 0% { opacity: 0.92; } 33% { opacity: 1; } 66% { opacity: 0.85; } 100% { opacity: 0.95; } }

  .cork-piece {
    position: absolute; pointer-events: none; z-index: 130;
    transition: transform 0.9s cubic-bezier(.2,1.4,.3,1), opacity 0.7s ease 0.4s;
  }
  .cork-piece.flown { transform: translate(60px, -220px) rotate(180deg); opacity: 0; }

  .ghost {
    position: absolute; opacity: 0; transform: scale(0.2) translateY(40px);
    transition: all 0.8s cubic-bezier(.34,1.7,.5,1);
    pointer-events: none; z-index: 90;
    filter: drop-shadow(0 0 35px rgba(180,255,255,0.95)) drop-shadow(0 0 70px rgba(120,200,255,0.7));
  }
  .ghost.revealed {
    opacity: 1; transform: scale(1) translateY(0);
    animation: ghostAppear 1.2s ease-out, ghostFloat 2.5s ease-in-out 1.2s infinite;
  }
  @keyframes ghostAppear {
    0%   { opacity: 0; transform: scale(2.5) translateY(-30px); filter: blur(8px) brightness(3); }
    40%  { opacity: 1; transform: scale(0.85) translateY(0); filter: blur(2px) brightness(2); }
    70%  { transform: scale(1.08); filter: blur(0) brightness(1.4); }
    100% { transform: scale(1); filter: blur(0) brightness(1); }
  }
  @keyframes ghostFloat {
    0%,100% { transform: scale(1) translateY(0) rotate(-2deg); }
    50%     { transform: scale(1) translateY(-16px) rotate(2deg); }
  }

  #fog {
    position: absolute; inset: 0; pointer-events: none; z-index: 400;
    background:
      radial-gradient(ellipse at 20% 95%, rgba(90,80,110,0.28) 0%, transparent 40%),
      radial-gradient(ellipse at 80% 92%, rgba(80,60,100,0.22) 0%, transparent 45%);
    animation: fogDrift 22s ease-in-out infinite alternate;
  }
  @keyframes fogDrift {
    0% { transform: translateX(-40px) translateY(0); }
    100% { transform: translateX(50px) translateY(-12px); }
  }
  #vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 500;
    background: radial-gradient(ellipse at 50% 42%, transparent 30%, rgba(0,0,0,0.35) 65%, rgba(0,0,0,0.75) 100%);
    mix-blend-mode: multiply;
  }
  #darkness {
    position: absolute; inset: 0; pointer-events: none; z-index: 501;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.15) 10%, transparent 25%,
      transparent 90%, rgba(0,0,0,0.3) 100%);
  }
  #grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 502; opacity: 0.06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  #hud {
    position: fixed; top: 20px; left: 20px;
    background: rgba(15,5,20,0.92);
    border: 1px solid #5a2a7a; border-radius: 10px;
    padding: 14px 24px; font-size: 20px; z-index: 1000;
    box-shadow: 0 0 30px rgba(120,60,180,0.6), inset 0 0 20px rgba(80,20,120,0.4);
    text-shadow: 0 0 8px rgba(200,120,255,0.8);
    font-family: 'Segoe UI', sans-serif;
    opacity: 0; transition: opacity 1s ease 1s;
  }
  #hud.visible { opacity: 1; }
  #hud .counter { color: #ff88ff; font-weight: bold; }

  #flash {
    position: fixed; inset: 0; background: #fff; opacity: 0;
    pointer-events: none; z-index: 800; transition: opacity 0.15s;
  }
  #flash.on { opacity: 0.85; }

  @keyframes shake {
    0%,100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 4px); } 40% { transform: translate(5px, -3px); }
    60% { transform: translate(-4px, -5px); } 80% { transform: translate(3px, 5px); }
  }
  #frame.shake { animation: shake 0.5s ease-out; }

  #win {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(20,60,30,0.95) 0%, rgba(0,0,0,0.98) 100%);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; z-index: 2000;
    font-size: 56px; color: #b0ffb0;
    text-shadow: 0 0 40px #80ff80; text-align: center;
    font-family: 'Segoe UI', sans-serif;
  }
  #win.show { display: flex; animation: winIn 0.8s ease; }
  @keyframes winIn { from { opacity:0; transform: scale(0.9); } to { opacity:1; transform: scale(1); } }
  #win .sub { font-size: 26px; color: #d0ffd0; margin-top: 20px; }

  @keyframes pendulum { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(15deg); } }
  @keyframes spiderDrop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
</style>
</head>
<body>

<div id="start-screen">
  <div class="start-ghost g1">👻</div>
  <div class="start-ghost g2">👻</div>
  <div class="start-ghost g3">👻</div>
  <div class="start-ghost g4">👻</div>
  <div id="start-title">小鬼在哪里？</div>
  <button id="start-btn">开始 </button>
</div>

<div id="scene">
  <div id="frame">
    <div id="world">
      <div class="ceiling"></div>
      <div class="wall"></div>
      <div class="floor"></div>

      <div class="light-pool a"></div>
      <div class="light-pool b"></div>
      <div class="light-pool c"></div>

      <div class="candle" style="left: 300px; top: 640px;">
        <div class="holder"></div><div class="body"></div><div class="wax"></div>
        <div class="wick"></div><div class="flame"></div>
      </div>
      <div class="candle" style="left: 1420px; top: 640px;">
        <div class="holder"></div><div class="body"></div><div class="wax"></div>
        <div class="wick"></div><div class="flame"></div>
      </div>

      <svg class="cobweb tl" width="320" height="320" viewBox="0 0 100 100">
        <g fill="none" stroke="#d0d0e0" stroke-width="0.35">
          <path d="M0,0 L100,0 M0,0 L85,30 M0,0 L70,55 M0,0 L45,78 M0,0 L20,95 M0,0 L0,100"/>
          <path d="M20,0 Q15,15 0,20" /><path d="M40,0 Q35,30 0,40"/>
          <path d="M60,0 Q50,45 0,60"/><path d="M80,0 Q65,60 0,80"/>
        </g>
      </svg>
      <svg class="cobweb tr" width="280" height="280" viewBox="0 0 100 100">
        <g fill="none" stroke="#d0d0e0" stroke-width="0.35">
          <path d="M0,0 L100,0 M0,0 L85,30 M0,0 L70,55 M0,0 L45,78 M0,0 L20,95 M0,0 L0,100"/>
          <path d="M20,0 Q15,15 0,20" /><path d="M40,0 Q35,30 0,40"/>
        </g>
      </svg>
      <svg class="cobweb bl" width="260" height="260" viewBox="0 0 100 100">
        <g fill="none" stroke="#b8b8c8" stroke-width="0.35">
          <path d="M0,0 L100,0 M0,0 L85,30 M0,0 L60,60 M0,0 L30,85 M0,0 L0,100"/>
          <path d="M25,0 Q20,20 0,25"/><path d="M50,0 Q45,40 0,50"/>
        </g>
      </svg>
      <svg class="cobweb br" width="260" height="260" viewBox="0 0 100 100">
        <g fill="none" stroke="#b8b8c8" stroke-width="0.35">
          <path d="M0,0 L100,0 M0,0 L85,30 M0,0 L60,60 M0,0 L30,85 M0,0 L0,100"/>
          <path d="M25,0 Q20,20 0,25"/><path d="M50,0 Q45,40 0,50"/>
        </g>
      </svg>
      <svg class="cobweb mid-l" width="180" height="180" viewBox="0 0 100 100">
        <g fill="none" stroke="#a8a8b8" stroke-width="0.4">
          <path d="M0,0 L100,0 M0,0 L70,55 M0,0 L30,85 M0,0 L0,100"/>
        </g>
      </svg>
      <svg class="cobweb mid-r" width="180" height="180" viewBox="0 0 100 100">
        <g fill="none" stroke="#a8a8b8" stroke-width="0.4">
          <path d="M0,0 L100,0 M0,0 L70,55 M0,0 L30,85 M0,0 L0,100"/>
        </g>
      </svg>

      <div style="position:absolute; top:160px; left:280px; font-size:24px; z-index:301; opacity:0.9;
                  filter: drop-shadow(0 0 5px #000); animation: spiderDrop 7s ease-in-out infinite;">🕷️</div>
      <div style="position:absolute; top:120px; right:220px; font-size:18px; z-index:301; opacity:0.85;
                  filter: drop-shadow(0 0 5px #000); animation: spiderDrop 9s ease-in-out infinite reverse;">🕷️</div>
    </div>

    <div id="fog"></div>
    <div id="vignette"></div>
    <div id="darkness"></div>
    <div id="grain"></div>
  </div>
</div>

<div id="hud">
  👻 找到了 <span class="counter" id="found">0</span> / <span class="counter" id="total">0</span>
</div>

<div id="flash"></div>

<div id="win">
  🎉 全部找到了! 🎉
  <div class="sub">Все призраки найдены!</div>
</div>

<script>
// =====================================================================
//  ПРЕДМЕТЫ
//  Комната 2000x1000, стена 0-640, пол 640-1000
//  Кошка и тень — справа, но не у самого края, кошка сдвинута ближе к стене

      g.gain.linearRampToValueAtTime(0.01, t0 + i * 0.08 + 0.04);
    }
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    src.connect(f).connect(g).connect(ctx.destination);
    src.start(t0); src.stop(t0 + 1.3);
    tone({ type:'sawtooth', freq:60, freq2:40, dur:1.1, vol:0.06 });
  },
  thud() {
    tone({ type:'sine', freq:70, freq2:28, dur:0.7, vol:0.5 });
    tone({ type:'sine', freq:110, freq2:45, dur:0.5, vol:0.25, when:0.01 });
    noise({ dur:0.4, vol:0.2, filterFreq:300 });
    tone({ type:'sine', freq:50, freq2:25, dur:0.6, vol:0.15, when:0.25 });
  },
  corkPop() {
    tone({ type:'sine', freq:120, freq2:400, dur:0.09, vol:0.5 });
    noise({ dur:0.18, vol:0.3, filterFreq:800, type:'bandpass', q:2, when:0.03 });
    tone({ type:'triangle', freq:2200, freq2:1400, dur:0.25, vol:0.05, when:0.05 });
  },
  hinge() {
    const ctx = ensureAudio(); const t0 = ctx.currentTime;
    const buf = ctx.createBuffer(1, ctx.sampleRate * 1.6, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2 - 1);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 480; f.Q.value = 18;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0, t0);
    for (let i = 0; i < 20; i++) {
      const v = 0.05 + Math.random()*0.06;
      g.gain.linearRampToValueAtTime(v, t0 + i * 0.07);
      g.gain.linearRampToValueAtTime(0.005, t0 + i * 0.07 + 0.035);
    }
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.5);
    src.connect(f).connect(g).connect(ctx.destination);
    src.start(t0); src.stop(t0 + 1.6);
    tone({ type:'sine', freq:55, dur:1.4, vol:0.05 });
  },
  paper() {
    noise({ dur:0.7, vol:0.15, filterFreq:2200, type:'bandpass', q:1.2 });
    noise({ dur:0.5, vol:0.1, filterFreq:900, type:'lowpass', when:0.15 });
  },
  spring() {
    tone({ type:'sine', freq:180, freq2:90, dur:0.4, vol:0.25 });
    tone({ type:'sine', freq:280, freq2:150, dur:0.35, vol:0.15, when:0.08 });
    tone({ type:'sine', freq:400, freq2:220, dur:0.3, vol:0.08, when:0.16 });
  },
  leaves() {
    noise({ dur:0.9, vol:0.14, filterFreq:3500, type:'bandpass', q:0.8 });
    noise({ dur:0.6, vol:0.1, filterFreq:1500, type:'lowpass', when:0.2 });
  },
  tick() {
    tone({ type:'sine', freq:220, freq2:120, dur:0.06, vol:0.18 });
    tone({ type:'sine', freq:220, freq2:120, dur:0.06, vol:0.18, when:0.35 });
  },
  roll() {
    tone({ type:'sine', freq:80, freq2:50, dur:0.5, vol:0.3 });
    noise({ dur:1.0, vol:0.12, filterFreq:400, type:'lowpass' });
  },
  tvStatic() {
    const ctx = ensureAudio(); const t0 = ctx.currentTime;
    tone({ type:'square', freq:2400, freq2:600, dur:0.08, vol:0.18 });
    tone({ type:'sine', freq:160, freq2:60, dur:0.25, vol:0.35, when:0.04 });
    tone({ type:'sine', freq:3200, freq2:1800, dur:0.15, vol:0.05, when:0.05 });
    noise({ dur:1.6, vol:0.28, filterFreq:3000, type:'highpass', when:0.08 });
    noise({ dur:1.6, vol:0.18, filterFreq:800, type:'lowpass', when:0.08 });
    tone({ type:'sine', freq:15600, dur:0.6, vol:0.02, when:0.1 });
    noise({ dur:2.5, vol:0.10, filterFreq:2500, type:'highpass', when:0.4 });
    noise({ dur:2.5, vol:0.06, filterFreq:600, type:'lowpass', when:0.4 });
  },
  tvGirlAppear() {
    const ctx = ensureAudio(); const t0 = ctx.currentTime;
    tone({ type:'sawtooth', freq:55, freq2:38, dur:1.6, vol:0.22, detune:-15 });
    tone({ type:'sawtooth', freq:55, freq2:38, dur:1.6, vol:0.16, detune:15 });
    tone({ type:'sine', freq:120, freq2:380, dur:1.2, vol:0.12 });
    tone({ type:'sine', freq:180, freq2:520, dur:1.0, vol:0.08, when:0.15 });
    noise({ dur:1.4, vol:0.10, filterFreq:4200, type:'bandpass', q:1.5, when:0.2 });
    noise({ dur:0.8, vol:0.06, filterFreq:6000, type:'highpass', when:0.6 });
    tone({ type:'sine', freq:45, freq2:20, dur:0.9, vol:0.4, when:1.2 });
  },

  /* УЛУЧШЕННОЕ МЯУКАНИЕ: восходящий "мя" → нисходящий "у", с вибрато */
  catMeow() {
    const ctx = ensureAudio();
    const t0 = ctx.currentTime;

    // Основная часть "мя" (восходящая)
    const osc1 = ctx.createOscillator();
    osc1.type = 'sawtooth';
    osc1.frequency.setValueAtTime(500, t0);
    osc1.frequency.exponentialRampToValueAtTime(750, t0 + 0.15);
    osc1.frequency.exponentialRampToValueAtTime(550, t0 + 0.45);

    // Вибрато на "мя"
    const lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 12;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 25;
    lfo.connect(lfoGain).connect(osc1.frequency);

    // Мягкий фильтр для формы "мя"
    const filt = ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.setValueAtTime(900, t0);
    filt.frequency.exponentialRampToValueAtTime(1400, t0 + 0.15);
    filt.frequency.exponentialRampToValueAtTime(800, t0 + 0.45);
    filt.Q.value = 3;

    // Огибающая громкости
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.22, t0 + 0.05);
    g.gain.linearRampToValueAtTime(0.20, t0 + 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);

    osc1.connect(filt).connect(g).connect(ctx.destination);
    osc1.start(t0); osc1.stop(t0 + 0.55);
    lfo.start(t0); lfo.stop(t0 + 0.55);

    // Добавляем вторую гармонику — "ууу" (нисходящая)
    const osc2 = ctx.createOscillator();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(400, t0 + 0.15);
    osc2.frequency.exponentialRampToValueAtTime(280, t0 + 0.5);
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0, t0 + 0.15);
    g2.gain.linearRampToValueAtTime(0.10, t0 + 0.2);
    g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.55);
    osc2.connect(g2).connect(ctx.destination);
    osc2.start(t0 + 0.15); osc2.stop(t0 + 0.6);
  },

  catHiss() {
    noise({ dur:0.8, vol:0.12, filterFreq:5000, type:'highpass', when:0.6 });
    noise({ dur:0.4, vol:0.08, filterFreq:3500, type:'bandpass', q:0.8, when:0.7 });
  },
  ghostAppear() {
    const ctx = ensureAudio(); const t0 = ctx.currentTime;
    tone({ type:'sawtooth', freq:80, freq2:30, dur:1.8, vol:0.35, detune:-20 });
    tone({ type:'sawtooth', freq:80, freq2:30, dur:1.8, vol:0.25, detune:20 });
    tone({ type:'sawtooth', freq:400, freq2:2400, dur:1.2, vol:0.1, when:0.2 });
    tone({ type:'sawtooth', freq:600, freq2:2800, dur:1.0, vol:0.08, when:0.3 });
    noise({ dur:1.6, vol:0.22, filterFreq:1200, type:'bandpass', q:0.7 });
    tone({ type:'sine', freq:60, freq2:20, dur:0.9, vol:0.5, when:1.2 });
    noise({ dur:0.5, vol:0.25, filterFreq:300, when:1.2 });
    tone({ type:'sine', freq:40, freq2:15, dur:1.5, vol:0.2, when:1.5 });
  },
};

// =====================================================================
//  ФОНОВАЯ МУЗЫКА
// =====================================================================
let backgroundMusic = null;
function startAmbientMusic() {
  if (!backgroundMusic) {
    backgroundMusic = new Audio('music/horror-music.mp3');
    backgroundMusic.loop = true;
    backgroundMusic.volume = 0;
  }
  backgroundMusic.currentTime = 0;
  const playPromise = backgroundMusic.play();
  if (playPromise !== undefined) playPromise.catch(() => {});
  let volume = 0;
  const fadeIn = setInterval(() => {
    volume += 0.02;
    if (volume >= 0.35) { volume = 0.35; clearInterval(fadeIn); }
    backgroundMusic.volume = volume;
  }, 50);
}
function stopAmbientMusic() {
  if (!backgroundMusic) return;
  const music = backgroundMusic;
  let volume = music.volume;
  const fadeOut = setInterval(() => {
    volume -= 0.03;
    if (volume <= 0) {
      volume = 0; clearInterval(fadeOut);
      music.pause(); music.currentTime = 0;
    }
    music.volume = volume;
  }, 50);
}

// =====================================================================
//  МАСШТАБ
// =====================================================================
function fitFrame() {
  const frame = document.getElementById('frame');
  if (!frame) return;
  const vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  const scale = Math.min(vw / 2000, vh / 1000) * 0.98;
  frame.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitFrame);
window.addEventListener('orientationchange', () => setTimeout(fitFrame, 150));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fitFrame);
  window.visualViewport.addEventListener('scroll', fitFrame);
}
fitFrame();

// =====================================================================
//  РАЗМЕЩЕНИЕ
// =====================================================================
const world = document.getElementById('world');
const ghostLocations = new Set();

function pickGhosts() {
  const pool = objects.filter(o => o.id !== 'wallghost');
  const idx = [...Array(pool.length).keys()].sort(() => Math.random() - 0.5);
  for (let i = 0; i < GHOST_COUNT; i++) ghostLocations.add(pool[idx[i]].id);
}

function createObject(o) {
  const el = document.createElement('div');
  el.className = 'object';
  if (o.svg === 'wallghost') el.classList.add('wallghost');
  el.id = 'obj-' + o.id;
  el.style.left   = o.x + 'px';
  el.style.top    = o.y + 'px';
  el.style.width  = o.w + 'px';
  el.style.height = o.h + 'px';
  el.style.zIndex = o.z || 100;
  el.dataset.type = o.type;
  el.dataset.label = o.label;
  el.dataset.pos = o.pos;
  el.innerHTML = SVG[o.svg];
  el.addEventListener('click', () => onClick(o, el));
  world.appendChild(el);

  if (o.hasCork) {
    const cork = document.createElement('div');
    cork.className = 'cork-piece';
    cork.id = 'cork-' + o.id;
    cork.style.left   = (o.x + o.w * 0.38) + 'px';
    cork.style.top    = (o.y - 16) + 'px';
    cork.style.width  = '18px';
    cork.style.height = '22px';
    cork.style.zIndex = (o.z || 100) + 3;
    cork.innerHTML = `
      <svg viewBox="0 0 18 22" width="18" height="22">
        <defs>
          <linearGradient id="corkG" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#5a3a10"/><stop offset="0.3" stop-color="#a8763a"/>
            <stop offset="0.6" stop-color="#8a5a28"/><stop offset="1" stop-color="#3a2208"/>
          </linearGradient>
        </defs>
        <rect x="2" y="4" width="14" height="17" fill="url(#corkG)" stroke="#2a1408" stroke-width="1.2" rx="2"/>
        <ellipse cx="9" cy="4" rx="7" ry="2" fill="#b8864a" stroke="#2a1408" stroke-width="1.2"/>
      </svg>`;
    world.appendChild(cork);
  }

  if (ghostLocations.has(o.id)) {
    const g = document.createElement('div');
    g.className = 'ghost';
    g.id = 'ghost-' + o.id;
    g.style.left   = (o.x + o.w/2 - 60) + 'px';
    g.style.top    = (o.y + o.h/2 - 70) + 'px';
    g.style.width  = '120px';
    g.style.height = '140px';
    g.style.zIndex = (o.z || 100) + 5;
    g.innerHTML = GHOST_SVG;
    world.appendChild(g);
  }
}

let found = 0;
const total = GHOST_COUNT;

function onClick(o, el) {
  if (o.action === 'none') return;
  if (el.classList.contains('moved')) return;
  el.classList.add('moved');
  animateAction(o, el);

  if (ghostLocations.has(o.id)) {
    setTimeout(() => {
      triggerScary();
      setTimeout(() => {
        const gEl = document.getElementById('ghost-' + o.id);
        if (gEl) gEl.classList.add('revealed');
        found++;
        document.getElementById('found').textContent = found;
        if (found === total) {
          setTimeout(() => {
            stopAmbientMusic();
            document.getElementById('win').classList.add('show');
          }, 1800);
        }
      }, 500);
    }, 450);
  }

  setTimeout(() => { resetObject(o, el); }, 3000);
}

function resetObject(o, el) {
  el.classList.remove('moved');
  el.style.transform = '';

  const svg = el.querySelector('svg');
  if (!svg) return;

  svg.querySelectorAll('.door-l, .door-r, .drawer, .cushion, .books, .lid, .painting, .cork').forEach(node => {
    node.style.transform = '';
    node.style.opacity = '';
    node.style.transition = '';
  });

  svg.querySelectorAll('.tv-static, .tv-screen-glow, .tv-girl').forEach(node => {
    node.classList.remove('on');
  });

  if (o.hasCork) {
    const existing = document.getElementById('cork-' + o.id);
    if (existing) existing.remove();

    const cork = document.createElement('div');
    cork.className = 'cork-piece';
    cork.id = 'cork-' + o.id;
    cork.style.left   = (o.x + o.w * 0.38) + 'px';
    cork.style.top    = (o.y - 16) + 'px';
    cork.style.width  = '18px';
    cork.style.height = '22px';
    cork.style.zIndex = (o.z || 100) + 3;
    cork.style.opacity = '0';
    cork.style.transform = 'translate(60px, -220px) rotate(180deg)';
    cork.innerHTML = `
      <svg viewBox="0 0 18 22" width="18" height="22">
        <defs>
          <linearGradient id="corkG2" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#5a3a10"/><stop offset="0.3" stop-color="#a8763a"/>
            <stop offset="0.6" stop-color="#8a5a28"/><stop offset="1" stop-color="#3a2208"/>
          </linearGradient>
        </defs>
        <rect x="2" y="4" width="14" height="17" fill="url(#corkG2)" stroke="#2a1408" stroke-width="1.2" rx="2"/>
        <ellipse cx="9" cy="4" rx="7" ry="2" fill="#b8864a" stroke="#2a1408" stroke-width="1.2"/>
      </svg>`;
    world.appendChild(cork);
    requestAnimationFrame(() => {
      cork.style.transition = 'transform 0.6s ease, opacity 0.6s ease';
      cork.style.transform = '';
      cork.style.opacity = '1';
    });
  }
}

function animateAction(o, el) {
  const svg = el.querySelector('svg');
  if (!svg) return;

  switch (o.action) {
    case 'cork': {
      SFX.corkPop();
      const corkPiece = document.getElementById('cork-' + o.id);
      if (corkPiece) {
        corkPiece.classList.add('flown');
        setTimeout(() => corkPiece.remove(), 1500);
      }
      el.style.transform = 'translate(-4px, 0) rotate(-3deg)';
      break;
    }
    case 'slide-out': {
      SFX.woodCreak();
      el.style.transform = 'translate(70px, 12px) rotate(6deg)';
      break;
    }
    case 'tilt': {
      SFX.thud();
      el.style.transform = 'translate(-24px, -12px) rotate(-8deg)';
      break;
    }
    case 'doors': {
      SFX.hinge();
      const dl = svg.querySelector('.door-l');
      const dr = svg.querySelector('.door-r');
      if (dl) dl.style.transform = 'perspective(600px) rotateY(-65deg)';
      if (dr) dr.style.transform = 'perspective(600px) rotateY(65deg)';
      const drawers = svg.querySelectorAll('.drawer');
      drawers.forEach((d, i) => {
        setTimeout(() => {
          d.style.transition = 'transform 0.6s cubic-bezier(.3,1.3,.5,1)';
          d.style.transform = `translateY(${8 + i*3}px)`;
        }, 300 + i * 120);
      });
      break;
    }
    case 'roll': {
      SFX.roll();
      el.style.transform = 'translate(200px, 18px) rotate(360deg)';
      break;
    }
    case 'books': {
      SFX.paper();
      const books = svg.querySelectorAll('.books');
      books.forEach((b, i) => {
        b.style.transition = 'transform 0.9s cubic-bezier(.4,.1,.3,1), opacity 0.9s';
        const dx = (i % 2 === 0 ? -1 : 1) * (50 + i * 20);
        const dy = 40 + i * 12;
        b.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx/2}deg)`;
        b.style.opacity = '0.15';
      });
      break;
    }
    case 'clock-slide': {
      SFX.tick();
      setTimeout(() => SFX.woodCreak(), 100);
      el.style.transform = 'translate(-90px, 0) rotate(-5deg)';
      break;
    }
    case 'painting': {
      SFX.hinge();
      el.style.transform = 'translate(120px, -20px) rotate(8deg)';
      break;
    }
    case 'cushion': {
      SFX.spring();
      const c = svg.querySelector('.cushion');
      if (c) {
        c.style.transition = 'transform 0.7s cubic-bezier(.3,1.4,.5,1)';
        c.style.transform = 'translate(-12px, -55px) rotate(-15deg)';
      }
      break;
    }
    case 'lean': {
      SFX.leaves();
      el.style.transform = 'translate(-12px, 0) rotate(-10deg)';
      break;
    }
    case 'door-open': {
      SFX.hinge();
      setTimeout(() => SFX.hinge(), 400);
      const d = svg.querySelector('.door-r');
      if (d) {
        d.style.transition = 'transform 1.4s cubic-bezier(.3,.9,.4,1)';
        d.style.transform = 'perspective(800px) rotateY(-85deg)';
      }
      break;
    }
    case 'tv-on': {
      SFX.tvStatic();
      el.style.transform = 'translate(0, -3px)';
      setTimeout(() => { el.style.transform = ''; }, 250);
      const staticLayer = svg.querySelectorAll('.tv-static');
      const glowLayer   = svg.querySelector('.tv-screen-glow');
      staticLayer.forEach(s => s.classList.add('on'));
      if (glowLayer) glowLayer.classList.add('on');
      const girlLayer = svg.querySelector('.tv-girl');
      setTimeout(() => {
        if (girlLayer) girlLayer.classList.add('on');
        SFX.tvGirlAppear();
      }, 900);
      break;
    }
    case 'cat-turn': {
      // Кошка издаёт "мяу" и поворачивается
      SFX.catMeow();
      el.style.transform = 'translate(-10px, 0) rotate(-6deg)';
      const wgEl = document.getElementById('obj-wallghost');
      if (wgEl) {
        wgEl.style.transition = 'opacity 0.8s ease';
        wgEl.style.opacity = '0.85';
      }
      // Через 0.6 сек — шипение (кошка чувствует тень)
      setTimeout(() => SFX.catHiss(), 600);
      const frame = document.getElementById('frame');
      frame.classList.add('shake');
      setTimeout(() => frame.classList.remove('shake'), 400);
      break;
    }
  }
}

function triggerScary() {
  const frame = document.getElementById('frame');
  frame.classList.add('shake');
  setTimeout(() => frame.classList.remove('shake'), 550);
  const flash = document.getElementById('flash');
  flash.classList.add('on');
  setTimeout(() => flash.classList.remove('on'), 180);
  SFX.ghostAppear();
}

let gameStarted = false;
function startGame(event) {
  if (gameStarted) return;
  gameStarted = true;
  if (event) event.stopPropagation();

  const startScreen = document.getElementById('start-screen');
  const scene = document.getElementById('scene');
  const hud = document.getElementById('hud');

  startScreen.classList.add('hidden');
  setTimeout(() => startScreen.style.display = 'none', 1200);

  setTimeout(() => {
    scene.classList.add('visible');
    hud.classList.add('visible');
  }, 300);

  pickGhosts();
  objects.forEach(createObject);
  document.getElementById('total').textContent = total;
  console.log('%cПризраки спрятаны:', 'color:#b080ff;font-weight:bold',
    [...ghostLocations].map(id => objects.find(o=>o.id===id).label).join(', '));

  setTimeout(() => startAmbientMusic(), 500);
  setTimeout(fitFrame, 100);
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('start-screen').addEventListener('click', startGame);

</script>
