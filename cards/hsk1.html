<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HSK 1 · Флеш-карточки</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      touch-action: pan-y;
    }

    .app {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 32px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.2);
      padding: 24px 20px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #0f172a;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 999px;
      margin: 12px 0 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #3b82f6;
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .stats span {
      background: #f8fafc;
      padding: 4px 12px;
      border-radius: 40px;
      border: 1px solid #e2e8f0;
    }

    .card-container {
      position: relative;
      width: 100%;
      height: 420px;
      margin: 8px 0 16px;
      perspective: 1200px;
    }

    .card {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      cursor: grab;
      user-select: none;
      will-change: transform;
      transition: transform 0.15s ease, opacity 0.2s ease;
      transform-style: preserve-3d;
    }

    .card:active { cursor: grabbing; }

    .card-inner {
      position: relative;
      width: 100%; height: 100%;
      transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      border-radius: 28px;
      box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-back {
      transform: rotateY(180deg);
      background: #fefce8;
      border: 1px solid #fde68a;
      justify-content: flex-start;
      padding-top: 32px;
      overflow-y: auto;
    }

    .card-word {
      font-size: 5.5rem;
      font-weight: 700;
      line-height: 1.2;
      color: #0f172a;
      text-align: center;
      word-break: break-word;
    }

    .card-pinyin {
      font-size: 1.9rem;
      color: #3b82f6;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      text-align: center;
    }

    .card-translation {
      font-size: 1.4rem;
      color: #334155;
      font-weight: 500;
      text-align: center;
      border-top: 2px dashed #cbd5e1;
      padding-top: 16px;
      width: 90%;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .examples-title {
      font-size: 0.85rem;
      color: #a16207;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .examples {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-top: 12px;
    }

    .example {
      background: #fffbeb;
      border-radius: 14px;
      padding: 10px 14px;
      text-align: left;
      border: 1px solid #fde68a;
    }

    .example-zh {
      font-size: 1.15rem;
      color: #0f172a;
      font-weight: 500;
      line-height: 1.5;
    }

    .example-zh .highlight {
      color: #dc2626;
      font-weight: 700;
      background: #fee2e2;
      padding: 0 4px;
      border-radius: 4px;
    }

    .example-ru {
      font-size: 0.95rem;
      color: #78716c;
      margin-top: 4px;
    }

    .card-back-hint {
      margin-top: 14px;
      margin-bottom: 4px;
      font-size: 0.85rem;
      color: #a16207;
      font-weight: 500;
      background: #fef9c3;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #fde68a;
      text-align: center;
    }

    .buttons {
      display: flex;
      gap: 20px;
      width: 100%;
      margin-top: 24px;
      justify-content: center;
    }

    .btn {
      flex: 1;
      max-width: 160px;
      padding: 16px 8px;
      border: none;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      background: #f1f5f9;
      color: #1e293b;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
      border: 1px solid #e2e8f0;
    }

    .btn:active { transform: scale(0.97); }

    .btn-forget {
      background: #fee2e2;
      color: #b91c1c;
      border-color: #fecaca;
    }

    .btn-remember {
      background: #dcfce7;
      color: #166534;
      border-color: #bbf7d0;
    }

    .keyboard-hint {
      margin-top: 18px;
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: center;
    }

    .keyboard-hint kbd {
      display: inline-block;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 2px 8px;
      font-family: inherit;
      font-size: 0.85rem;
      color: #475569;
      margin: 0 2px;
    }

    .finish-message {
      text-align: center;
      padding: 24px 12px;
    }

    .finish-message h2 {
      font-size: 2rem;
      color: #0f172a;
      margin-bottom: 12px;
    }

    .finish-message p {
      color: #475569;
      font-size: 1.1rem;
      margin-bottom: 28px;
    }

    .stats-total {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .stats-total .stat-pill {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      color: #0369a1;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="app" id="app">
  <h1>🀄 HSK 1</h1>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="stats">
    <span id="roundLabel">Раунд 1</span>
    <span id="counterLabel">0 / 0</span>
  </div>

  <div class="card-container" id="cardContainer">
    <div class="card" id="card">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div class="card-word" id="cardWord">你好</div>
        </div>
        <div class="card-face card-back">
          <div class="card-pinyin" id="cardPinyin">nǐ hǎo</div>
          <div class="card-translation" id="cardTranslation">привет</div>
          <div id="examplesBlock">
            <div class="examples-title">Примеры</div>
            <div class="examples" id="examplesContainer"></div>
          </div>
          <div class="card-back-hint">Нажмите ← чтобы отправить на повторение</div>
        </div>
      </div>
    </div>
  </div>

  <div class="buttons" id="buttons">
    <button class="btn btn-forget" id="btnForget" aria-label="Не помню">← Не помню</button>
    <button class="btn btn-remember" id="btnRemember" aria-label="Помню">Помню →</button>
  </div>

  <div class="keyboard-hint" id="keyboardHint">
    <kbd>←</kbd> не помню · <kbd>→</kbd> помню
  </div>

  <div id="finishScreen" class="finish-message hidden">
    <h2 id="finishTitle">🎉 Отлично!</h2>
    <div class="stats-total" id="statsTotal"></div>
    <p id="finishText">Все слова пройдены!</p>
    <button class="btn" id="restartBtn" style="max-width: 260px; margin: 0 auto; background: #3b82f6; color: white; border: none;">Продолжить →</button>
  </div>
</div>

      { zh: "他坐下了。", ru: "Он сел." }
    ]},
    { word: "做", pinyin: "zuò", translation: "делать, готовить", examples: [
      { zh: "你在做什么？", ru: "Что ты делаешь?" },
      { zh: "妈妈在做菜。", ru: "Мама готовит." }
    ]}
  ];

  const MAX_CARDS_PER_ROUND = 20;

  // ========== СОСТОЯНИЕ ==========
  let currentRoundCards = [];
  let forgottenCards = [];
  let round = 1;
  let totalCardsInRound = 0;
  let processedCount = 0;
  let isFlipped = false;
  let awaitingForgetConfirm = false;

  let masteredWords = new Set();
  let notYetSeenWords = [];

  // ========== DOM ==========
  const card = document.getElementById('card');
  const cardInner = document.getElementById('cardInner');
  const cardWord = document.getElementById('cardWord');
  const cardPinyin = document.getElementById('cardPinyin');
  const cardTranslation = document.getElementById('cardTranslation');
  const examplesContainer = document.getElementById('examplesContainer');
  const examplesBlock = document.getElementById('examplesBlock');
  const progressFill = document.getElementById('progressFill');
  const roundLabel = document.getElementById('roundLabel');
  const counterLabel = document.getElementById('counterLabel');
  const btnForget = document.getElementById('btnForget');
  const btnRemember = document.getElementById('btnRemember');
  const finishScreen = document.getElementById('finishScreen');
  const finishTitle = document.getElementById('finishTitle');
  const finishText = document.getElementById('finishText');
  const statsTotal = document.getElementById('statsTotal');
  const restartBtn = document.getElementById('restartBtn');
  const cardContainer = document.getElementById('cardContainer');
  const keyboardHint = document.getElementById('keyboardHint');

  // ========== СВАЙП ==========
  let startX = 0;
  let currentX = 0;
  let isDragging = false;
  const swipeThreshold = 80;
  let animationInProgress = false;

  // ========== УТИЛИТЫ ==========
  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (m) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function highlightWord(text, word) {
    const escaped = escapeHtml(text);
    const escapedWord = escapeHtml(word);
    return escaped.split(escapedWord).join(
      `<span class="highlight">${escapedWord}</span>`
    );
  }

  function updateUI() {
    const total = totalCardsInRound;
    const current = processedCount;
    const percent = total > 0 ? (current / total) * 100 : 0;
    progressFill.style.width = percent + '%';
    counterLabel.textContent = `${current} / ${total}`;
    roundLabel.textContent = `Раунд ${round}`;
  }

  function fillCardContent(item) {
    cardWord.textContent = item.word;
    cardPinyin.textContent = item.pinyin;
    cardTranslation.textContent = item.translation;

    if (item.examples && item.examples.length) {
      examplesBlock.classList.remove('hidden');
      examplesContainer.innerHTML = '';
      const shown = item.examples.slice(0, 2);
      for (const ex of shown) {
        const div = document.createElement('div');
        div.className = 'example';
        div.innerHTML = `
          <div class="example-zh">${highlightWord(ex.zh, item.word)}</div>
          <div class="example-ru">${escapeHtml(ex.ru)}</div>
        `;
        examplesContainer.appendChild(div);
      }
    } else {
      examplesBlock.classList.add('hidden');
    }
  }

  function renderCurrentCard() {
    if (currentRoundCards.length === 0) {
      showFinishScreen();
      return;
    }

    cardInner.style.transition = 'none';
    card.classList.remove('flipped');
    isFlipped = false;
    awaitingForgetConfirm = false;
    void cardInner.offsetWidth;
    cardInner.style.transition = '';

    fillCardContent(currentRoundCards[0]);

    card.style.transition = 'none';
    card.style.transform = 'translateX(0) rotate(0deg)';
    card.style.opacity = '1';
    void card.offsetWidth;
    card.style.transition = 'transform 0.15s ease, opacity 0.2s ease';

    updateUI();
  }

  function resetCardStyle() {
    card.style.transition = 'transform 0.15s ease, opacity 0.2s ease';
    card.style.transform = 'translateX(0) rotate(0deg)';
    card.style.opacity = '1';
  }

  function flipCard() {
    if (isFlipped) return;
    isFlipped = true;
    card.classList.add('flipped');
  }

  function animateSwipe(direction) {
    if (animationInProgress || currentRoundCards.length === 0) return;
    animationInProgress = true;
    const cardData = currentRoundCards[0];

    if (direction === 'left') {
      forgottenCards.push(cardData);
    } else if (direction === 'right') {
      masteredWords.add(cardData.word);
    }

    card.style.transition = 'transform 0.28s ease, opacity 0.28s ease';
    if (direction === 'left') {
      card.style.transform = 'translateX(-150%) rotate(-20deg)';
    } else {
      card.style.transform = 'translateX(150%) rotate(20deg)';
    }
    card.style.opacity = '0';

    setTimeout(() => {
      currentRoundCards.shift();
      processedCount++;

      card.style.transition = 'none';
      card.style.opacity = '0';
      void card.offsetWidth;

      if (currentRoundCards.length === 0) {
        cardInner.style.transition = 'none';
        card.classList.remove('flipped');
        void cardInner.offsetWidth;
        cardInner.style.transition = '';
        isFlipped = false;
        awaitingForgetConfirm = false;
        updateUI();
        showFinishScreen();
        animationInProgress = false;
        return;
      }

      fillCardContent(currentRoundCards[0]);

      cardInner.style.transition = 'none';
      card.classList.remove('flipped');
      isFlipped = false;
      awaitingForgetConfirm = false;
      void cardInner.offsetWidth;
      cardInner.style.transition = '';

      card.style.transition = 'none';
      card.style.transform = 'translateX(0) rotate(0deg)';
      void card.offsetWidth;

      card.style.transition = 'opacity 0.15s ease';
      card.style.opacity = '1';

      updateUI();

      setTimeout(() => {
        card.style.transition = 'transform 0.15s ease, opacity 0.2s ease';
        animationInProgress = false;
      }, 150);
    }, 280);
  }

  function snapBack() {
    card.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
    card.style.transform = 'translateX(0) rotate(0deg)';
    card.style.opacity = '1';
  }

  function handleForget() {
    if (animationInProgress || currentRoundCards.length === 0) return;
    if (awaitingForgetConfirm) {
      animateSwipe('left');
      return;
    }
    flipCard();
    awaitingForgetConfirm = true;
  }

  function handleRemember() {
    if (animationInProgress || currentRoundCards.length === 0) return;
    if (awaitingForgetConfirm) {
      animateSwipe('left');
      return;
    }
    animateSwipe('right');
  }

  function showFinishScreen() {
    cardContainer.classList.add('hidden');
    document.getElementById('buttons').classList.add('hidden');
    keyboardHint.classList.add('hidden');
    finishScreen.classList.remove('hidden');

    const uniqueForgotten = [...new Set(forgottenCards.map(c => c.word))];
    const forgottenCount = uniqueForgotten.length;
    const remainingNew = notYetSeenWords.length;
    const totalWords = HSK1_WORDS.length;
    const masteredCount = masteredWords.size;

    statsTotal.innerHTML = `
      <span class="stat-pill">Выучено: ${masteredCount} / ${totalWords}</span>
      <span class="stat-pill">Осталось новых: ${remainingNew}</span>
    `;

    if (forgottenCount > 0) {
      finishTitle.textContent = '💪 Закрепление';
      finishText.innerHTML = `Забыто слов: <strong>${forgottenCount}</strong><br>Сейчас повторим их ещё раз.`;
      restartBtn.textContent = 'Повторить забытые →';
      restartBtn.onclick = () => {
        round++;
        const wordsMap = new Map(HSK1_WORDS.map(w => [w.word, w]));
        const cardsForNextRound = uniqueForgotten.map(w => wordsMap.get(w)).filter(Boolean);
        startRoundWithCards(cardsForNextRound);
      };
    } else if (remainingNew > 0) {
      finishTitle.textContent = '🎉 Отличный раунд!';
      finishText.innerHTML = `Все слова этого раунда выучены.<br>Дальше — <strong>${Math.min(MAX_CARDS_PER_ROUND, remainingNew)}</strong> новых слов.`;
      restartBtn.textContent = `Новые слова (${Math.min(MAX_CARDS_PER_ROUND, remainingNew)}) →`;
      restartBtn.onclick = () => {
        round++;
        const nextBatch = notYetSeenWords.slice(0, MAX_CARDS_PER_ROUND);
        notYetSeenWords = notYetSeenWords.slice(MAX_CARDS_PER_ROUND);
        startRoundWithCards(nextBatch);
      };
    } else {
      finishTitle.textContent = '🏆 Поздравляем!';
      finishText.innerHTML = `Вы прошли все <strong>${totalWords}</strong> слов HSK 1!<br>Отличная работа!`;
      restartBtn.textContent = 'Начать заново';
      restartBtn.onclick = () => {
        initGame();
      };
    }
  }

  function startRoundWithCards(cards) {
    finishScreen.classList.add('hidden');
    cardContainer.classList.remove('hidden');
    document.getElementById('buttons').classList.remove('hidden');
    keyboardHint.classList.remove('hidden');

    const shuffled = shuffleArray(cards);
    currentRoundCards = shuffled;

    totalCardsInRound = currentRoundCards.length;
    processedCount = 0;
    forgottenCards = [];
    animationInProgress = false;
    isFlipped = false;
    awaitingForgetConfirm = false;

    card.classList.remove('flipped');
    resetCardStyle();
    renderCurrentCard();
    updateUI();
  }

  function initGame() {
    round = 1;
    forgottenCards = [];
    masteredWords = new Set();
    notYetSeenWords = shuffleArray([...HSK1_WORDS]);
    const firstBatch = notYetSeenWords.slice(0, MAX_CARDS_PER_ROUND);
    notYetSeenWords = notYetSeenWords.slice(MAX_CARDS_PER_ROUND);
    startRoundWithCards(firstBatch);
  }

  // ========== СОБЫТИЯ УКАЗАТЕЛЯ ==========
  function onPointerDown(e) {
    if (animationInProgress || currentRoundCards.length === 0) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    startX = e.clientX;
    currentX = startX;
    isDragging = true;
    card.style.transition = 'none';
    card.setPointerCapture(e.pointerId);
  }

  function onPointerMove(e) {
    if (!isDragging || animationInProgress || currentRoundCards.length === 0) return;
    e.preventDefault();
    const dx = e.clientX - startX;
    currentX = e.clientX;
    const rotate = dx * 0.05;
    card.style.transform = `translateX(${dx}px) rotate(${rotate}deg)`;
    const opacity = 1 - Math.min(Math.abs(dx) / 600, 0.3);
    card.style.opacity = opacity;
  }

  function onPointerUp(e) {
    if (!isDragging || animationInProgress || currentRoundCards.length === 0) return;
    isDragging = false;
    e.preventDefault();
    const dx = currentX - startX;

    if (dx > swipeThreshold) {
      if (awaitingForgetConfirm) {
        animateSwipe('left');
      } else {
        animateSwipe('right');
      }
    } else if (dx < -swipeThreshold) {
      if (!awaitingForgetConfirm) {
        flipCard();
        awaitingForgetConfirm = true;
        snapBack();
      } else {
        animateSwipe('left');
      }
    } else {
      snapBack();
    }
    if (card.hasPointerCapture(e.pointerId)) {
      card.releasePointerCapture(e.pointerId);
    }
  }

  function onPointerCancel(e) {
    if (isDragging) {
      isDragging = false;
      snapBack();
      if (card.hasPointerCapture(e.pointerId)) {
        card.releasePointerCapture(e.pointerId);
      }
    }
  }

  card.addEventListener('pointerdown', onPointerDown);
  card.addEventListener('pointermove', onPointerMove);
  card.addEventListener('pointerup', onPointerUp);
  card.addEventListener('pointercancel', onPointerCancel);

  // ========== КЛАВИАТУРА ==========
  document.addEventListener('keydown', (e) => {
    if (!finishScreen.classList.contains('hidden')) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        restartBtn.click();
      }
      return;
    }
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      handleForget();
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      handleRemember();
    }
  });

  // ========== КНОПКИ ==========
  btnForget.addEventListener('click', handleForget);
  btnRemember.addEventListener('click', handleRemember);
  card.addEventListener('dragstart', (e) => e.preventDefault());

  initGame();
</script>
</body>
