<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Карточки</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 28px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.2);
      padding: 20px 16px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #0f172a;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      text-align: center;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 999px;
      margin: 10px 0 6px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #3b82f6;
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .stats span {
      background: #f8fafc;
      padding: 3px 10px;
      border-radius: 40px;
      border: 1px solid #e2e8f0;
    }

    .card-container {
      position: relative;
      width: 100%;
      height: 440px;
      margin: 6px 0 10px;
      perspective: 1200px;
      touch-action: none;
    }

    .card {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      cursor: grab;
      will-change: transform;
      transition: transform 0.15s ease, opacity 0.2s ease;
      transform-style: preserve-3d;
      touch-action: none;
    }

    .card:active { cursor: grabbing; }

    .card-inner {
      position: relative;
      width: 100%; height: 100%;
      transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-back {
      transform: rotateY(180deg);
      background: #fefce8;
      border: 1px solid #fde68a;
      justify-content: flex-start;
      padding-top: 28px;
      overflow-y: auto;
    }

    .card-word {
      font-size: 5rem;
      font-weight: 700;
      line-height: 1.2;
      color: #0f172a;
      text-align: center;
      word-break: break-word;
    }

    .peek-btn {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
    }

    .peek-btn:active { transform: translateX(-50%) scale(0.96); }
    .peek-btn:hover { background: #dbeafe; }

    .peek-pinyin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -160%);
      font-size: 2rem;
      font-weight: 600;
      color: #2563eb;
      background: #eff6ff;
      padding: 10px 24px;
      border-radius: 16px;
      border: 1px solid #bfdbfe;
      box-shadow: 0 8px 24px -8px rgba(37, 99, 235, 0.3);
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      z-index: 4;
      white-space: nowrap;
    }

    .peek-pinyin.visible {
      opacity: 1;
      transform: translate(-50%, -180%);
    }

    .card-pinyin {
      font-size: 1.8rem;
      color: #3b82f6;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-align: center;
    }

    .card-translation {
      font-size: 1.3rem;
      color: #334155;
      font-weight: 500;
      text-align: center;
      border-top: 2px dashed #cbd5e1;
      padding-top: 12px;
      width: 90%;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .examples-title {
      font-size: 0.75rem;
      color: #a16207;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .examples {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      margin-top: 8px;
    }

    .example {
      background: #fffbeb;
      border-radius: 12px;
      padding: 8px 12px;
      text-align: left;
      border: 1px solid #fde68a;
    }

    .example-zh {
      font-size: 1.05rem;
      color: #0f172a;
      font-weight: 500;
      line-height: 1.5;
    }

    .example-zh .highlight {
      color: #dc2626;
      font-weight: 700;
      background: #fee2e2;
      padding: 0 4px;
      border-radius: 4px;
    }

    .example-ru {
      font-size: 0.85rem;
      color: #78716c;
      margin-top: 3px;
    }

    .card-back-hint {
      margin-top: 10px;
      margin-bottom: 4px;
      font-size: 0.75rem;
      color: #a16207;
      font-weight: 500;
      background: #fef9c3;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid #fde68a;
      text-align: center;
    }

    .buttons {
      display: flex;
      gap: 14px;
      width: 100%;
      margin-top: 12px;
      justify-content: center;
    }

    .btn {
      flex: 1;
      max-width: 160px;
      padding: 14px 6px;
      border: none;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      background: #f1f5f9;
      color: #1e293b;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
      border: 1px solid #e2e8f0;
    }

    .btn:active { transform: scale(0.97); }

    .btn-forget {
      background: #fee2e2;
      color: #b91c1c;
      border-color: #fecaca;
    }

    .btn-remember {
      background: #dcfce7;
      color: #166534;
      border-color: #bbf7d0;
    }

    .keyboard-hint {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #94a3b8;
      text-align: center;
    }

    .keyboard-hint kbd {
      display: inline-block;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 1px 6px;
      font-family: inherit;
      font-size: 0.8rem;
      color: #475569;
      margin: 0 2px;
    }

    .finish-message {
      text-align: center;
      padding: 20px 12px;
    }

    .finish-message h2 {
      font-size: 1.8rem;
      color: #0f172a;
      margin-bottom: 10px;
    }

    .finish-message p {
      color: #475569;
      font-size: 1.05rem;
      margin-bottom: 24px;
    }

    .stats-total {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .stats-total .stat-pill {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      color: #0369a1;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .menu {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 4px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .menu-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #0f172a;
      text-align: center;
      margin-bottom: 8px;
    }

    .menu-subtitle {
      font-size: 0.9rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 12px;
    }

    .set-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      width: 100%;
      font-family: inherit;
    }

    .set-btn:hover {
      background: #eff6ff;
      border-color: #bfdbfe;
      transform: translateY(-1px);
    }

    .set-btn:active { transform: scale(0.99); }

    .set-num {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .set-info {
      flex: 1;
      min-width: 0;
    }

    .set-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 2px;
    }

    .set-desc {
      font-size: 0.75rem;
      color: #64748b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .set-count {
      flex-shrink: 0;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
    }

    .back-btn {
      margin-top: 8px;
      padding: 12px;
      background: transparent;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
    }

    .back-btn:hover { background: #f8fafc; }

    /* ===== ЭКРАН ВЫБОРА РЕЖИМА ===== */
    .mode-screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 8px 4px;
    }

    .mode-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #0f172a;
      text-align: center;
      margin-bottom: 4px;
    }

    .mode-subtitle {
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 16px;
    }

    .mode-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 18px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      width: 100%;
      font-family: inherit;
    }

    .mode-btn:hover {
      border-color: #bfdbfe;
      background: #eff6ff;
      transform: translateY(-2px);
    }

    .mode-btn:active { transform: scale(0.98); }

    .mode-icon {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }

    .mode-icon.with-pinyin {
      background: #dbeafe;
    }

    .mode-icon.without-pinyin {
      background: #f1f5f9;
    }

    .mode-info {
      flex: 1;
      min-width: 0;
    }

    .mode-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .mode-desc {
      font-size: 0.8rem;
      color: #64748b;
      line-height: 1.4;
    }

    .mode-back {
      margin-top: 12px;
      padding: 12px;
      background: transparent;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
    }

    .mode-back:hover { background: #f8fafc; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="app" id="app">

  <!-- ===== ЭКРАН ВЫБОРА НАБОРА ===== -->
  <div id="menuScreen" class="menu">
    <div class="menu-title">🀄 Карточки</div>
    <div class="menu-subtitle">Выберите набор</div>
    <!-- Наборы добавляются скриптом -->
  </div>

  <!-- ===== ЭКРАН ВЫБОРА РЕЖИМА ===== -->
  <div id="modeScreen" class="mode-screen hidden">
    <div class="mode-title" id="modeSetTitle">Набор</div>
    <div class="mode-subtitle">Выберите режим тренировки</div>

    <button class="mode-btn" id="modeWithPinyin">
      <div class="mode-icon with-pinyin">👁</div>
      <div class="mode-info">
        <div class="mode-name">С пиньинем</div>
        <div class="mode-desc">На карточке будет кнопка «Показать пиньинь». Клик по ней не считается ошибкой и не отправляет слово в повтор.</div>
      </div>
    </button>

    <button class="mode-btn" id="modeWithoutPinyin">
      <div class="mode-icon without-pinyin">🔒</div>
      <div class="mode-info">
        <div class="mode-name">Без пиньиня</div>
        <div class="mode-desc">На лицевой стороне только иероглиф. Пиньинь, перевод и примеры появятся только после свайпа влево / кнопки «Не помню».</div>
      </div>
    </button>

    <button class="mode-back" id="modeBackBtn">← К выбору набора</button>
  </div>

  <!-- ===== ЭКРАН ТРЕНИРОВКИ ===== -->
  <div id="trainScreen" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">
    <h1 id="setTitle">🀄 Набор</h1>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="stats">
      <span id="roundLabel">Раунд 1</span>
      <span id="counterLabel">0 / 0</span>
    </div>

    <div class="card-container" id="cardContainer">
      <div class="card" id="card">
        <div class="card-inner" id="cardInner">
          <div class="card-face card-front">
            <div class="peek-pinyin" id="peekPinyin">wǒ</div>
            <div class="card-word" id="cardWord">我</div>
            <button class="peek-btn" id="peekBtn" type="button">👁 Показать пиньинь</button>
          </div>
          <div class="card-face card-back">
            <div class="card-pinyin" id="cardPinyin">wǒ</div>
            <div class="card-translation" id="cardTranslation">я</div>
            <div class="examples-title">Примеры</div>
            <div class="examples" id="examplesContainer"></div>
            <div class="card-back-hint">Смахните ← чтобы отправить на повторение</div>
          </div>
        </div>
      </div>
    </div>

    <div class="buttons" id="buttons">
      <button class="btn btn-forget" id="btnForget" aria-label="Не помню">← Не помню</button>
      <button class="btn btn-remember" id="btnRemember" aria-label="Помню">Помню →</button>
    </div>

    <div class="keyboard-hint" id="keyboardHint">
      <kbd>←</kbd> не помню · <kbd>→</kbd> помню
    </div>

    <div id="finishScreen" class="finish-message hidden">
      <h2 id="finishTitle">🎉 Отлично!</h2>
      <div class="stats-total" id="statsTotal"></div>
      <p id="finishText">Все слова пройдены!</p>
      <button class="btn" id="restartBtn" style="max-width: 260px; margin: 0 auto; background: #3b82f6; color: white; border: none;">Продолжить →</button>
      <button class="back-btn" id="backToMenuBtn" style="max-width: 260px; margin: 12px auto 0;">← К выбору набора</button>
    </div>
  </div>

</div>

<script>
  // ========== НАБОРЫ СЛОВ ==========
  // Здесь вставьте все ваши 18 наборов (массивы SETS).
  // Структура: { title: "...", words: [...] } — поле allowPeek больше не нужно,
  // режим выбирается пользователем на экране выбора режима.
  const SETS = [
    // ВСТАВЬТЕ СЮДА ВСЕ 18 НАБОРОВ (каждый в формате { title: "...", words: [...] })
    {
  title: "Набор 1 · Местоимения",
  allowPeek: true,
  words: [
    { word: "我", pinyin: "wǒ", translation: "я", examples: [
      { zh: "我是学生。", ru: "Я студент." },
      { zh: "我很高兴。", ru: "Я очень рад." }
    ]},
    { word: "你", pinyin: "nǐ", translation: "ты", examples: [
      { zh: "你是老师吗？", ru: "Ты учитель?" },
      { zh: "你喜欢喝茶吗？", ru: "Ты любишь чай?" }
    ]},
    { word: "我们", pinyin: "wǒmen", translation: "мы", examples: [
      { zh: "我们是朋友。", ru: "Мы друзья." },
      { zh: "我们去学校。", ru: "Мы идём в школу." }
    ]},
    { word: "你们", pinyin: "nǐmen", translation: "вы (мн. число)", examples: [
      { zh: "你们好！", ru: "Здравствуйте!" },
      { zh: "你们去哪儿？", ru: "Куда вы идёте?" }
    ]},
    { word: "她", pinyin: "tā", translation: "она", examples: [
      { zh: "她是我妈妈。", ru: "Она моя мама." },
      { zh: "她很漂亮。", ru: "Она очень красивая." }
    ]},
    { word: "他", pinyin: "tā", translation: "он", examples: [
      { zh: "他是医生。", ru: "Он врач." },
      { zh: "他去中国了。", ru: "Он уехал в Китай." }
    ]},
    { word: "它", pinyin: "tā", translation: "оно (о неодушевлённом)", examples: [
      { zh: "它是我的猫。", ru: "Это моя кошка." },
      { zh: "它是汉语课本。", ru: "Это учебник китайского." }
    ]},
    { word: "他们", pinyin: "tāmen", translation: "они", examples: [
      { zh: "他们都是老师。", ru: "Они все учителя." },
      { zh: "他们去图书馆了。", ru: "Они пошли в библиотеку." }
    ]},
    { word: "她们", pinyin: "tāmen", translation: "они (о женщинах)", examples: [
      { zh: "她们是学生。", ru: "Они студентки." },
      { zh: "她们一起去了。", ru: "Они пошли вместе." }
    ]},
    { word: "您", pinyin: "nín", translation: "Вы (уважительно)", examples: [
      { zh: "您好！", ru: "Здравствуйте!" },
      { zh: "您贵姓？", ru: "Как ваша фамилия?" }
    ]}
  ]
},

{
  title: "Набор 2 · Базовая лексика",
  allowPeek: true,
  words: [
    { word: "你好", pinyin: "nǐ hǎo", translation: "привет", examples: [
      { zh: "你好！你好吗？", ru: "Привет! Как ты?" },
      { zh: "老师，你好！", ru: "Здравствуйте, учитель!" }
    ]},
    { word: "你好吗", pinyin: "nǐ hǎo ma", translation: "как ты? как дела?", examples: [
      { zh: "你好吗？我很好。", ru: "Как ты? У меня всё хорошо." },
      { zh: "老师，你好吗？", ru: "Учитель, как вы?" }
    ]},
    { word: "呢", pinyin: "ne", translation: "вопросительная частица (а...?)", examples: [
      { zh: "我很好，你呢？", ru: "У меня всё хорошо, а у тебя?" },
      { zh: "他在哪儿呢？", ru: "Где же он?" }
    ]},
    { word: "吗", pinyin: "ma", translation: "вопросительная частица", examples: [
      { zh: "你好吗？", ru: "Как ты?" },
      { zh: "你是学生吗？", ru: "Ты студент?" }
    ]},
    { word: "好", pinyin: "hǎo", translation: "хороший", examples: [
      { zh: "今天天气很好。", ru: "Сегодня хорошая погода." },
      { zh: "好的，没问题。", ru: "Хорошо, без проблем." }
    ]},
    { word: "汉语", pinyin: "hànyǔ", translation: "китайский язык", examples: [
      { zh: "我学习汉语。", ru: "Я учу китайский." },

    { word: "外国", pinyin: "wàiguó", translation: "заграница, иностранное государство", examples: [
      { zh: "他是外国人。", ru: "Он иностранец." },
      { zh: "我想去外国学习。", ru: "Я хочу учиться за границей." }
    ]},
    { word: "外国人", pinyin: "wàiguórén", translation: "иностранец", examples: [
      { zh: "他是外国人。", ru: "Он иностранец." },
      { zh: "我们班有两个外国人。", ru: "В нашем классе два иностранца." }
    ]},
    { word: "外语", pinyin: "wàiyǔ", translation: "иностранный язык", examples: [
      { zh: "我学习外语。", ru: "Я учу иностранный язык." },
      { zh: "他会说三门外语。", ru: "Он говорит на трёх иностранных языках." }
    ]},
    { word: "一点儿", pinyin: "yīdiǎnr", translation: "немного", examples: [
      { zh: "请给我一点儿水。", ru: "Дайте мне немного воды." },
      { zh: "我只会说一点儿汉语。", ru: "Я говорю только немного по-китайски." }
    ]},
    { word: "知道", pinyin: "zhīdào", translation: "знать (факт)", examples: [
      { zh: "我知道这个字。", ru: "Я знаю этот иероглиф." },
      { zh: "我不知道他在哪儿。", ru: "Я не знаю, где он." }
    ]}

}




];

  // ========== СОСТОЯНИЕ ==========
  let WORDS = [];
  let currentRoundCards = [];
  let forgottenCards = [];
  let round = 1;
  let totalCardsInRound = 0;
  let processedCount = 0;
  let isFlipped = false;
  let awaitingForgetConfirm = false;
  let peekVisible = false;
  let currentSetIndex = 0;
  let allowPeek = false;

  // ========== DOM ==========
  const menuScreen = document.getElementById('menuScreen');
  const modeScreen = document.getElementById('modeScreen');
  const trainScreen = document.getElementById('trainScreen');
  const setTitle = document.getElementById('setTitle');
  const modeSetTitle = document.getElementById('modeSetTitle');
  const card = document.getElementById('card');
  const cardInner = document.getElementById('cardInner');
  const cardWord = document.getElementById('cardWord');
  const cardPinyin = document.getElementById('cardPinyin');
  const cardTranslation = document.getElementById('cardTranslation');
  const examplesContainer = document.getElementById('examplesContainer');
  const peekPinyin = document.getElementById('peekPinyin');
  const peekBtn = document.getElementById('peekBtn');
  const progressFill = document.getElementById('progressFill');
  const roundLabel = document.getElementById('roundLabel');
  const counterLabel = document.getElementById('counterLabel');
  const btnForget = document.getElementById('btnForget');
  const btnRemember = document.getElementById('btnRemember');
  const finishScreen = document.getElementById('finishScreen');
  const finishTitle = document.getElementById('finishTitle');
  const finishText = document.getElementById('finishText');
  const statsTotal = document.getElementById('statsTotal');
  const restartBtn = document.getElementById('restartBtn');
  const backToMenuBtn = document.getElementById('backToMenuBtn');
  const cardContainer = document.getElementById('cardContainer');
  const keyboardHint = document.getElementById('keyboardHint');

  // ========== СВАЙП ==========
  let startX = 0;
  let startY = 0;
  let currentX = 0;
  let isDragging = false;
  let pointerId = null;
  const swipeThreshold = 70;
  let animationInProgress = false;

  // ========== УТИЛИТЫ ==========
  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (m) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function highlightWord(text, word) {
    const escaped = escapeHtml(text);
    const escapedWord = escapeHtml(word);
    return escaped.split(escapedWord).join(
      `<span class="highlight">${escapedWord}</span>`
    );
  }

  function updateUI() {
    const total = totalCardsInRound;
    const current = processedCount;
    const percent = total > 0 ? (current / total) * 100 : 0;
    progressFill.style.width = percent + '%';
    counterLabel.textContent = `${current} / ${total}`;
    roundLabel.textContent = `Раунд ${round}`;
  }

  function fillCardContent(item) {
    cardWord.textContent = item.word;
    cardPinyin.textContent = item.pinyin;
    cardTranslation.textContent = item.translation;
    peekPinyin.textContent = item.pinyin;

    if (allowPeek) {
      peekBtn.classList.remove('hidden');
    } else {
      peekBtn.classList.add('hidden');
    }

    examplesContainer.innerHTML = '';
    if (item.examples && item.examples.length) {
      const shown = item.examples.slice(0, 2);
      for (const ex of shown) {
        const div = document.createElement('div');
        div.className = 'example';
        div.innerHTML = `
          <div class="example-zh">${highlightWord(ex.zh, item.word)}</div>
          <div class="example-ru">${escapeHtml(ex.ru)}</div>
        `;
        examplesContainer.appendChild(div);
      }
    }
  }

  function hidePeek() {
    peekVisible = false;
    peekPinyin.classList.remove('visible');
  }

  function togglePeek() {
    if (!allowPeek) return;
    peekVisible = !peekVisible;
    if (peekVisible) {
      peekPinyin.classList.add('visible');
    } else {
      peekPinyin.classList.remove('visible');
    }
  }

  function renderCurrentCard() {
    if (currentRoundCards.length === 0) {
      showFinishScreen();
      return;
    }

    cardInner.style.transition = 'none';
    card.classList.remove('flipped');
    isFlipped = false;
    awaitingForgetConfirm = false;
    hidePeek();
    void cardInner.offsetWidth;
    cardInner.style.transition = '';

    fillCardContent(currentRoundCards[0]);

    card.style.transition = 'none';
    card.style.transform = 'translateX(0) rotate(0deg)';
    card.style.opacity = '1';
    void card.offsetWidth;
    card.style.transition = 'transform 0.15s ease, opacity 0.2s ease';

    updateUI();
  }

  function resetCardStyle() {
    card.style.transition = 'transform 0.15s ease, opacity 0.2s ease';
    card.style.transform = 'translateX(0) rotate(0deg)';
    card.style.opacity = '1';
  }

  function flipCard() {
    if (isFlipped) return;
    isFlipped = true;
    card.classList.add('flipped');
    hidePeek();
  }

  function animateSwipe(direction) {
    if (animationInProgress || currentRoundCards.length === 0) return;
    animationInProgress = true;
    const cardData = currentRoundCards[0];

    if (direction === 'left') {
      forgottenCards.push(cardData);
    }

    card.style.transition = 'transform 0.28s ease, opacity 0.28s ease';
    if (direction === 'left') {
      card.style.transform = 'translateX(-150%) rotate(-20deg)';
    } else {
      card.style.transform = 'translateX(150%) rotate(20deg)';
    }
    card.style.opacity = '0';

    setTimeout(() => {
      currentRoundCards.shift();
      processedCount++;

      card.style.transition = 'none';
      card.style.opacity = '0';
      void card.offsetWidth;

      if (currentRoundCards.length === 0) {
        cardInner.style.transition = 'none';
        card.classList.remove('flipped');
        void cardInner.offsetWidth;
        cardInner.style.transition = '';
        isFlipped = false;
        awaitingForgetConfirm = false;
        hidePeek();
        updateUI();
        showFinishScreen();
        animationInProgress = false;
        return;
      }

      fillCardContent(currentRoundCards[0]);

      cardInner.style.transition = 'none';
      card.classList.remove('flipped');
      isFlipped = false;
      awaitingForgetConfirm = false;
      hidePeek();
      void cardInner.offsetWidth;
      cardInner.style.transition = '';

      card.style.transition = 'none';
      card.style.transform = 'translateX(0) rotate(0deg)';
      void card.offsetWidth;

      card.style.transition = 'opacity 0.15s ease';
      card.style.opacity = '1';

      updateUI();

      setTimeout(() => {
        card.style.transition = 'transform 0.15s ease, opacity 0.2s ease';
        animationInProgress = false;
      }, 150);
    }, 280);
  }

  function snapBack() {
    card.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
    card.style.transform = 'translateX(0) rotate(0deg)';
    card.style.opacity = '1';
  }

  function handleForget() {
    if (animationInProgress || currentRoundCards.length === 0) return;
    if (awaitingForgetConfirm) {
      animateSwipe('left');
      return;
    }
    flipCard();
    awaitingForgetConfirm = true;
  }

  function handleRemember() {
    if (animationInProgress || currentRoundCards.length === 0) return;
    if (awaitingForgetConfirm) {
      animateSwipe('left');
      return;
    }
    animateSwipe('right');
  }

  function showFinishScreen() {
    cardContainer.classList.add('hidden');
    document.getElementById('buttons').classList.add('hidden');
    keyboardHint.classList.add('hidden');
    finishScreen.classList.remove('hidden');

    const uniqueForgotten = [...new Set(forgottenCards.map(c => c.word))];
    const forgottenCount = uniqueForgotten.length;
    const totalWords = WORDS.length;

    statsTotal.innerHTML = `<span class="stat-pill">Всего слов: ${totalWords}</span>`;

    if (forgottenCount > 0) {
      finishTitle.textContent = '💪 Закрепление';
      finishText.innerHTML = `Забыто слов: <strong>${forgottenCount}</strong><br>Сейчас повторим их ещё раз.`;
      restartBtn.textContent = 'Повторить забытые →';
      restartBtn.onclick = () => {
        round++;
        const wordsMap = new Map(WORDS.map(w => [w.word, w]));
        const cardsForNextRound = uniqueForgotten.map(w => wordsMap.get(w)).filter(Boolean);
        startRoundWithCards(cardsForNextRound);
      };
    } else {
      finishTitle.textContent = '🏆 Поздравляем!';
      finishText.innerHTML = `Вы прошли все <strong>${totalWords}</strong> слов!<br>Отличная работа!`;
      restartBtn.textContent = 'Пройти заново';
      restartBtn.onclick = () => {
        initGame();
      };
    }
  }

  function startRoundWithCards(cards) {
    finishScreen.classList.add('hidden');
    cardContainer.classList.remove('hidden');
    document.getElementById('buttons').classList.remove('hidden');
    keyboardHint.classList.remove('hidden');

    currentRoundCards = shuffleArray(cards);

    totalCardsInRound = currentRoundCards.length;
    processedCount = 0;
    forgottenCards = [];
    animationInProgress = false;
    isFlipped = false;
    awaitingForgetConfirm = false;
    hidePeek();

    card.classList.remove('flipped');
    resetCardStyle();
    renderCurrentCard();
    updateUI();
  }

  function initGame() {
    round = 1;
    forgottenCards = [];
    startRoundWithCards([...WORDS]);
  }

  // ========== ВЫБОР НАБОРА ==========
  function selectSet(index) {
    currentSetIndex = index;
    const set = SETS[index];
    WORDS = set.words;
    modeSetTitle.textContent = set.title;

    menuScreen.classList.add('hidden');
    trainScreen.classList.add('hidden');
    modeScreen.classList.remove('hidden');
  }

  // ========== ВЫБОР РЕЖИМА ==========
  function startWithMode(withPeek) {
    allowPeek = withPeek;
    const set = SETS[currentSetIndex];
    setTitle.textContent = set.title;

    modeScreen.classList.add('hidden');
    trainScreen.classList.remove('hidden');

    initGame();
  }

  function backToMenu() {
    finishScreen.classList.add('hidden');
    cardContainer.classList.remove('hidden');
    document.getElementById('buttons').classList.remove('hidden');
    keyboardHint.classList.remove('hidden');
    trainScreen.classList.add('hidden');
    modeScreen.classList.add('hidden');
    menuScreen.classList.remove('hidden');
  }

  function backToMode() {
    trainScreen.classList.add('hidden');
    menuScreen.classList.add('hidden');
    modeScreen.classList.remove('hidden');
  }

  // ========== КНОПКА «ПОКАЗАТЬ ПИНЬИНЬ» ==========
  peekBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    togglePeek();
  });

  // ========== СОБЫТИЯ УКАЗАТЕЛЯ ==========
  function onPointerDown(e) {
    if (animationInProgress || currentRoundCards.length === 0) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target === peekBtn || peekBtn.contains(e.target)) return;

    e.preventDefault();
    startX = e.clientX;
    startY = e.clientY;
    currentX = startX;
    isDragging = true;
    pointerId = e.pointerId;

    card.style.transition = 'none';
    try { card.setPointerCapture(e.pointerId); } catch (err) {}
  }

  function onPointerMove(e) {
    if (!isDragging || e.pointerId !== pointerId) return;
    if (animationInProgress || currentRoundCards.length === 0) return;

    e.preventDefault();
    const dx = e.clientX - startX;
    currentX = e.clientX;

    const rotate = dx * 0.05;
    card.style.transform = `translateX(${dx}px) rotate(${rotate}deg)`;

    const opacity = 1 - Math.min(Math.abs(dx) / 600, 0.3);
    card.style.opacity = opacity;
  }

  function onPointerUp(e) {
    if (!isDragging || e.pointerId !== pointerId) return;
    isDragging = false;
    pointerId = null;
    e.preventDefault();

    const dx = currentX - startX;

    if (dx > swipeThreshold) {
      if (awaitingForgetConfirm) {
        animateSwipe('left');
      } else {
        animateSwipe('right');
      }
    } else if (dx < -swipeThreshold) {
      if (!awaitingForgetConfirm) {
        flipCard();
        awaitingForgetConfirm = true;
        snapBack();
      } else {
        animateSwipe('left');
      }
    } else {
      snapBack();
    }

    try {
      if (card.hasPointerCapture(e.pointerId)) {
        card.releasePointerCapture(e.pointerId);
      }
    } catch (err) {}
  }

  function onPointerCancel(e) {
    if (isDragging && e.pointerId === pointerId) {
      isDragging = false;
      pointerId = null;
      snapBack();
    }
  }

  card.addEventListener('pointerdown', onPointerDown);
  card.addEventListener('pointermove', onPointerMove);
  card.addEventListener('pointerup', onPointerUp);
  card.addEventListener('pointercancel', onPointerCancel);

  card.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) return;
    if (e.target === peekBtn || peekBtn.contains(e.target)) return;
    e.preventDefault();
  }, { passive: false });

  card.addEventListener('touchmove', (e) => {
    e.preventDefault();
  }, { passive: false });

  card.addEventListener('dragstart', (e) => e.preventDefault());

  // ========== КЛАВИАТУРА ==========
  document.addEventListener('keydown', (e) => {
    if (!menuScreen.classList.contains('hidden')) return;
    if (!modeScreen.classList.contains('hidden')) return;
    if (!finishScreen.classList.contains('hidden')) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        restartBtn.click();
      }
      return;
    }
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      handleForget();
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      handleRemember();
    }
  });

  // ========== КНОПКИ ==========
  btnForget.addEventListener('click', handleForget);
  btnRemember.addEventListener('click', handleRemember);
  backToMenuBtn.addEventListener('click', backToMenu);

  document.getElementById('modeWithPinyin').addEventListener('click', () => startWithMode(true));
  document.getElementById('modeWithoutPinyin').addEventListener('click', () => startWithMode(false));
  document.getElementById('modeBackBtn').addEventListener('click', () => {
    modeScreen.classList.add('hidden');
    menuScreen.classList.remove('hidden');
  });

  // ========== РЕНДЕР МЕНЮ НАБОРОВ ==========
  function renderMenu() {
    // Удаляем все кнопки, кроме заголовка и подзаголовка
    const existingButtons = menuScreen.querySelectorAll('.set-btn');
    existingButtons.forEach(b => b.remove());

    SETS.forEach((set, index) => {
      const btn = document.createElement('button');
      btn.className = 'set-btn';
      btn.dataset.set = index;

      const num = document.createElement('div');
      num.className = 'set-num';
      num.textContent = index + 1;

      const info = document.createElement('div');
      info.className = 'set-info';
      const name = document.createElement('div');
      name.className = 'set-name';
      name.textContent = set.title.replace(/^Набор \d+ · /, '');
      const desc = document.createElement('div');
      desc.className = 'set-desc';
      desc.textContent = set.words.slice(0, 5).map(w => w.word).join(', ') + (set.words.length > 5 ? '...' : '');
      info.appendChild(name);
      info.appendChild(desc);

      const count = document.createElement('div');
      count.className = 'set-count';
      count.textContent = set.words.length;

      btn.appendChild(num);
      btn.appendChild(info);
      btn.appendChild(count);

      btn.addEventListener('click', () => selectSet(index));
      menuScreen.appendChild(btn);
    });
  }

  renderMenu();
</script>
