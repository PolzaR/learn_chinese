<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как достать лаоши</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--anger:0}
body{font-family:"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#667eea,#764ba2);transition:background .8s,filter .3s;overflow-x:hidden}
body.anger-1{background:linear-gradient(135deg,#657b83,#625080)}
body.anger-2{background:linear-gradient(135deg,#62506f,#70405c)}
body.anger-3{background:linear-gradient(135deg,#593447,#692b35)}
body.anger-4{background:linear-gradient(135deg,#421e2c,#601b25)}
body.anger-5{background:radial-gradient(circle,#650000,#100000)}
.app{width:min(1150px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0004;display:grid;grid-template-columns:minmax(280px,1fr) 280px 76px;gap:22px;position:relative;overflow:hidden}
h1{grid-column:1/-1;text-align:center;color:#333;margin-bottom:4px}
.setup{grid-column:1/-1;text-align:center;max-width:760px;width:100%;justify-self:center}
.setup label{display:block;text-align:left;margin:15px 0 7px;font-weight:700;color:#555}
.setup textarea,.setup input[type=file]{width:100%;padding:11px;border:2px solid #ddd;border-radius:10px;font:inherit;background:#fff}
.setup textarea{min-height:115px;resize:vertical}
.hint{font-size:12px;color:#777;text-align:left;margin-top:5px}
.btn{border:0;border-radius:12px;padding:13px 20px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#667eea,#764ba2);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.start{margin-top:20px}
.game-area{display:none;flex-direction:column;gap:17px;min-width:0}
.game-area.active{display:flex}
.progress{font-size:14px;font-weight:700;color:#666;display:flex;justify-content:space-between;gap:10px}
.card{min-height:190px;padding:30px 18px;border:3px solid #667eea;border-radius:20px;background:linear-gradient(135deg,#f6f8ff,#e8ecff);display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(38px,5vw,58px);font-weight:750;color:#333;overflow-wrap:anywhere;transition:background .2s,border-color .2s}
.card.correct{background:#d8f3df;border-color:#28a745}
.card.wrong{background:#f8d7da;border-color:#dc3545;animation:cardShake .42s}
@keyframes cardShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.controls{display:flex;gap:12px}
.controls .btn{flex:1}
.btn-ok{background:linear-gradient(135deg,#28a745,#20c997)}
.btn-fail{background:linear-gradient(135deg,#dc3545,#e83e8c)}
.teacher-panel{display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#f8f9fc;border-radius:18px;padding:18px;overflow:hidden;transition:background .7s}
.teacher-panel.active{display:flex}
.teacher-panel.dark{background:#24151c}
.teacher-wrap{width:220px;height:220px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:18px;isolation:isolate}
#teacherImg{max-width:92%;max-height:92%;width:auto;height:auto;object-fit:contain;border-radius:15px;box-shadow:0 5px 18px #0003;transform:scale(1);transition:filter .5s,transform .4s;z-index:1}
.teacher-wrap.aura-1{filter:drop-shadow(0 0 9px #ff9b45)}
.teacher-wrap.aura-2{filter:drop-shadow(0 0 17px #ff6b35)}
.teacher-wrap.aura-3{filter:drop-shadow(0 0 24px #f33);animation:shake 1.3s infinite}
.teacher-wrap.aura-4{filter:drop-shadow(0 0 32px #f22);animation:shake .75s infinite}
.teacher-wrap.aura-5{filter:drop-shadow(0 0 42px red);animation:shake .35s infinite}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-2px,1px) rotate(-1deg)}40%{transform:translate(2px,-1px) rotate(1deg)}60%{transform:translate(-2px,-1px) rotate(-.7deg)}80%{transform:translate(2px,1px) rotate(.7deg)}}
.teacher-wrap.aura-2 #teacherImg{filter:saturate(1.25) sepia(.15)}
.teacher-wrap.aura-3 #teacherImg{filter:saturate(1.6) sepia(.3) contrast(1.1)}
.teacher-wrap.aura-4 #teacherImg{filter:saturate(2) sepia(.45) contrast(1.2) brightness(.9)}
.teacher-wrap.aura-5 #teacherImg{filter:saturate(2.4) sepia(.6) contrast(1.3) brightness(.8)}
.aura{position:absolute;inset:0;border:3px solid #f33;border-radius:18px;opacity:0;pointer-events:none;z-index:2}
.aura.active{animation:auraPulse 1.2s infinite}
@keyframes auraPulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.anger-face{position:absolute;z-index:4;right:7px;top:3px;font-size:38px;opacity:0;transform:scale(.3) rotate(-20deg);transition:.25s;filter:drop-shadow(0 2px 2px #0005)}
.anger-face.show{opacity:1;transform:scale(1) rotate(8deg)}
.teacher-speech{min-height:48px;text-align:center;font-weight:700;color:#555;font-size:14px;line-height:1.35}
.teacher-panel.dark .teacher-speech{color:#ffb0b0}
.teacher-caption{font-size:12px;color:#888}
.steam{position:absolute;z-index:3;font-size:25px;pointer-events:none;animation:steamUp 1s ease-out forwards}
@keyframes steamUp{0%{opacity:0;transform:translateY(8px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-55px) scale(1.3)}}
.dark-particle{position:absolute;width:7px;height:7px;border-radius:50%;background:#ff3020;box-shadow:0 0 9px red;z-index:3;pointer-events:none}
.patience-scale{display:none;align-items:center;flex-direction:column;justify-content:space-between;background:#f8f9fc;border-radius:16px;padding:14px 10px;height:290px;align-self:center;transition:background .7s}
.patience-scale.active{display:flex}
.patience-scale.dark{background:#24151c}
.patience-title{font-size:11px;font-weight:800;letter-spacing:1px;writing-mode:vertical-rl;transform:rotate(180deg);color:#666}
.patience-scale.dark .patience-title{color:#ff8585}
.thermo{width:34px;flex:1;position:relative;margin:10px 0;background:#e3e6e8;border-radius:18px;overflow:hidden;box-shadow:inset 0 2px 6px #0002}
#patienceFill{position:absolute;left:0;right:0;bottom:0;height:0%;border-radius:18px;background:linear-gradient(to top,#dc3545 0%,#ff8c00 48%,#ffd43b 75%,#28a745 100%);transition:height .65s cubic-bezier(.2,1.2,.4,1)}
.thermo-marks{position:absolute;inset:0;display:flex;flex-direction:column-reverse;justify-content:space-around;pointer-events:none}
.thermo-marks span{height:1px;background:#fff9;margin:0 4px}
#patienceValue{font-size:14px;font-weight:800;color:#444;font-variant-numeric:tabular-nums}
.patience-scale.dark #patienceValue{color:#ff9999}
.win-screen{display:none;grid-column:1/-1;text-align:center;padding:30px 10px}
.win-screen.active{display:block}
.win-screen h2{font-size:clamp(30px,5vw,44px);color:#dc3545;margin-bottom:12px}
.win-screen p{font-size:18px;color:#555;margin:12px 0 20px}
.censored-line{min-height:75px;max-width:650px;margin:18px auto 22px;padding:18px;border-radius:12px;background:#190000;border:2px solid #650000;color:#ff3333;font:700 24px "Courier New",monospace;letter-spacing:3px;box-shadow:0 0 30px #f003;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:5px}
.censored-line span{animation:glitch .18s}
@keyframes glitch{0%{transform:translate(2px,-2px);color:#fff}50%{transform:translate(-2px,2px)}100%{transform:none}}
.win-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.flash{position:fixed;inset:0;background:#ff1b1b;opacity:0;pointer-events:none;z-index:10}
.flash.go{animation:flash .35s}
@keyframes flash{0%,100%{opacity:0}35%{opacity:.38}}
body.final-shake{animation:bigShake .09s infinite}
@keyframes bigShake{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,3px)}50%{transform:translate(4px,-3px)}75%{transform:translate(-3px,-4px)}}
@media(max-width:850px){.app{grid-template-columns:1fr;max-width:650px}.teacher-panel{grid-row:auto}.patience-scale{height:auto;min-height:72px;flex-direction:row;padding:12px 16px}.patience-title{writing-mode:horizontal-tb;transform:none}.thermo{height:25px;width:auto;flex:1;margin:0 12px}.controls{flex-direction:column}.teacher-wrap{width:200px;height:200px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <h1>🎈 Как достать лаоши</h1>

  <section class="setup" id="setup">
    <label for="wordsInput">📝 Слова (каждое с новой строки или через запятую):</label>
    <textarea id="wordsInput">你好, 谢谢, 再见, 老师, 学生, 对不起</textarea>

    <label for="photoInput">📸 Фотография учителя</label>
    <input type="file" id="photoInput" accept="image/*">
    <div class="hint">По умолчанию игра ищет файл <b>teacher.jpg</b> рядом с HTML. Выбранная здесь фотография заменит его.</div>

    <button class="btn start" id="startBtn">Начать игру 🚀</button>
  </section>

  <section class="game-area" id="gameArea">
    <div class="progress"><span id="progressText">Слово 1 из 6</span><span id="mistakeText">Ошибок: 0/5</span></div>
    <div class="card" id="card">你好</div>
    <div class="controls">
      <button class="btn btn-ok" id="correctBtn">✅ Прочитал верно</button>
      <button class="btn btn-fail" id="wrongBtn">❌ Ошибся</button>
    </div>
  </section>

  <section class="teacher-panel" id="teacherPanel">
    <div class="teacher-wrap" id="teacherWrap">
      <div class="aura" id="aura"></div>
      <img id="teacherImg" alt="Учитель">
      <div class="anger-face" id="angerFace">💢</div>
    </div>
    <div class="teacher-speech" id="teacherSpeech">Лаоши спокоен. Пока что.</div>
    <div class="teacher-caption">Уровень раздражения растёт…</div>
  </section>

  <aside class="patience-scale" id="patienceScale">
    <div class="patience-title">РАЗДРАЖЕНИЕ</div>
    <div class="thermo">
      <div id="patienceFill"></div>
      <div class="thermo-marks"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div id="patienceValue">0%</div>
  </aside>

  <section class="win-screen" id="winScreen">
    <h2 id="winTitle">💥 БУМ! Лаоши лопнул!</h2>
    <p id="winMessage">Ты довёл учителя до предела!</p>
    <div class="censored-line" id="censoredLine"></div>
    <div class="win-actions">
      <button class="btn" id="restartBtn">Играть снова 🔄</button>
      <button class="btn" id="backBtn">Изменить настройки</button>
    </div>
  </section>
</div>
<div class="flash" id="flash"></div>
<audio id="finalAudio" preload="auto"></audio>

<script>
const MAX_MISTAKES = 5;

// Здесь указываются файлы по умолчанию:
const DEFAULT_PHOTO = "pol.jpg";
const FINAL_AUDIO = "swearing.mp3";

let words = [], currentIndex = 0, mistakes = 0, locked = false;
let photoObjectUrl = null;

const $ = id => document.getElementById(id);
const setup = $("setup"), gameArea = $("gameArea"), teacherPanel = $("teacherPanel");
const teacherWrap = $("teacherWrap"), teacherImg = $("teacherImg"), aura = $("aura");
const card = $("card"), progressText = $("progressText"), mistakeText = $("mistakeText");
const patienceScale = $("patienceScale"), patienceFill = $("patienceFill"), patienceValue = $("patienceValue");
const winScreen = $("winScreen"), wordsInput = $("wordsInput"), photoInput = $("photoInput");
const censoredLine = $("censoredLine"), finalAudio = $("finalAudio");

const speechByLevel = [
  "Лаоши спокоен. Пока что.",
  "嗯？ Давай попробуем ещё раз.",
  "老师开始不高兴了…",
  "Сколько можно ошибаться?!",
  "Лаоши глубоко дышит. Очень глубоко.",
  "最后一次机会！ Это была последняя капля!"
];

function setAudioSource() {
  // Финальная дорожка задаётся прямо здесь, в константе FINAL_AUDIO.
  finalAudio.src = FINAL_AUDIO;
  finalAudio.load();
}

function setPhotoSource() {
  if (photoObjectUrl) URL.revokeObjectURL(photoObjectUrl);
  photoObjectUrl = photoInput.files[0] ? URL.createObjectURL(photoInput.files[0]) : null;
  teacherImg.src = photoObjectUrl || DEFAULT_PHOTO;
  teacherImg.onerror = () => {
    teacherImg.onerror = null;
    teacherImg.src = makePlaceholderTeacher();
  };
}

function makePlaceholderTeacher() {
  const c = document.createElement("canvas");
  c.width = c.height = 300;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#ffd6a5";
  ctx.beginPath();
  ctx.arc(150,150,140,0,Math.PI*2);
  ctx.fill();
  ctx.font = "180px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("👩‍🏫",150,160);
  return c.toDataURL();
}

$("startBtn").addEventListener("click", () => {
  const raw = wordsInput.value.trim();
  if (!raw) {
    alert("Введи хотя бы одно слово!");
    return;
  }

  words = raw.split(/[\n,;]+/).map(w => w.trim()).filter(Boolean);
  if (!words.length) {
    alert("Не удалось найти слова 🤔");
    return;
  }

  setPhotoSource();
  setAudioSource();

  currentIndex = 0;
  mistakes = 0;
  locked = false;

  document.body.className = "";
  document.body.style.transform = "";
  $("winScreen").classList.remove("active");

  setup.style.display = "none";
  gameArea.classList.add("active");
  teacherPanel.classList.add("active");
  patienceScale.classList.add("active");

  updatePatience();
  updateTeacherMood();
  showCard();

  finalAudio.pause();
  finalAudio.currentTime = 0;
});

function showCard() {
  if (currentIndex >= words.length) {
    showWin("🎉 Все слова прочитаны! Лаоши выжил… но запомнил всё.", false);
    return;
  }

  card.textContent = words[currentIndex];
  card.className = "card";
  progressText.textContent = `Слово ${currentIndex + 1} из ${words.length}`;
  mistakeText.textContent = `Ошибок: ${mistakes}/${MAX_MISTAKES}`;
  locked = false;
}

$("correctBtn").addEventListener("click", () => {
  if (locked) return;

  locked = true;
  card.classList.add("correct");
  playSuccessSound();

  setTimeout(() => {
    currentIndex++;
    showCard();
  }, 450);
});

$("wrongBtn").addEventListener("click", () => {
  if (locked) return;

  locked = true;
  card.classList.add("wrong");
  mistakes = Math.min(MAX_MISTAKES, mistakes + 1);

  updatePatience();
  playAngerSound(mistakes);
  updateTeacherMood();
  spawnSteam();
  spawnDarkParticles();
  screenFlash();

  if (mistakes >= MAX_MISTAKES) {
    setTimeout(explodeTeacher, 650);
  } else {
    setTimeout(() => {
      card.classList.remove("wrong");
      locked = false;
    }, 850);
  }
});

function updatePatience() {
  const anger = Math.round(mistakes / MAX_MISTAKES * 100);
  patienceFill.style.height = anger + "%";
  patienceValue.textContent = anger + "%";
  mistakeText.textContent = `Ошибок: ${mistakes}/${MAX_MISTAKES}`;
}

function updateTeacherMood() {
  teacherWrap.className = "teacher-wrap";
  aura.classList.toggle("active", mistakes > 0);

  if (mistakes > 0) {
    teacherWrap.classList.add("aura-" + mistakes);
  }

  $("angerFace").classList.toggle("show", mistakes > 0);
  $("angerFace").textContent =
    mistakes >= 4 ? "🤬" :
    mistakes >= 2 ? "😡" : "💢";

  $("teacherSpeech").textContent = speechByLevel[mistakes];

  document.body.className = mistakes ? "anger-" + mistakes : "";
  teacherPanel.classList.toggle("dark", mistakes >= 3);
  patienceScale.classList.toggle("dark", mistakes >= 3);

  const scale = 1 + mistakes * 0.095;
  teacherImg.style.transform = `scale(${scale})`;

  if (mistakes >= 3) {
    teacherImg.style.transform += ` rotate(${mistakes % 2 ? -2 : 2}deg)`;
  }
}

function spawnSteam() {
  const emojis = mistakes >= 4 ? ["💨","💢","🔥"] : ["💨","💢"];

  for (let i = 0; i < Math.min(mistakes + 1, 5); i++) {
    const el = document.createElement("div");
    el.className = "steam";
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (22 + Math.random() * 145) + "px";
    el.style.top = (25 + Math.random() * 95) + "px";

    teacherWrap.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }
}

function spawnDarkParticles() {
  for (let i = 0; i < mistakes * 3; i++) {
    const p = document.createElement("div");
    p.className = "dark-particle";

    const angle = Math.random() * Math.PI * 2;
    const x = 110 + Math.cos(angle) * 82;
    const y = 110 + Math.sin(angle) * 82;

    p.style.left = x + "px";
    p.style.top = y + "px";
    teacherWrap.appendChild(p);

    const dx = Math.cos(angle) * (35 + Math.random() * 45);
    const dy = Math.sin(angle) * (35 + Math.random() * 45);

    const anim = p.animate(
      [
        {transform:"translate(0,0) scale(1)",opacity:1},
        {transform:`translate(${dx}px,${dy}px) scale(0)`,opacity:0}
      ],
      {
        duration:650 + Math.random() * 400,
        easing:"ease-out"
      }
    );

    anim.onfinish = () => p.remove();
  }
}

function screenFlash() {
  const flash = $("flash");
  flash.classList.remove("go");
  void flash.offsetWidth;
  flash.classList.add("go");
}

/* ---------------- ЗВУКИ ИЗ ИСХОДНОЙ ИГРЫ ---------------- */

function getAudioCtx() {
  if (!window.audioCtx) {
    window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (window.audioCtx.state === "suspended") {
    window.audioCtx.resume();
  }

  return window.audioCtx;
}

// Звук раздражения при ошибке.
function playAngerSound(level) {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(120 + level * 40, now);
    osc.frequency.exponentialRampToValueAtTime(60 + level * 30, now + 0.5);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.3, now + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.65);
  } catch (e) {
    console.warn("Не удалось воспроизвести звук раздражения", e);
  }
}

// Звук взрыва.
function playExplosionSound() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const bufferSize = ctx.sampleRate * 1.2;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }

    const src = ctx.createBufferSource();
    src.buffer = buffer;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(1000, now);
    filter.frequency.exponentialRampToValueAtTime(100, now + 1.2);

    src.connect(filter).connect(gain).connect(ctx.destination);
    src.start(now);
  } catch (e) {
    console.warn("Не удалось воспроизвести звук взрыва", e);
  }
}

// Три ноты при правильном ответе.
function playSuccessSound() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;

    [523, 659, 784].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.frequency.value = freq;
      osc.type = "sine";

      const t = now + i * 0.08;

      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);

      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.22);
    });
  } catch (e) {
    console.warn("Не удалось воспроизвести звук успеха", e);
  }
}

/* ---------------- ВЗРЫВ И ФИНАЛ ---------------- */

function explodeTeacher() {
  locked = true;

  playExplosionSound();

  document.body.classList.add("final-shake");
  screenFlash();

  teacherImg.animate(
    [
      {transform:"scale(1.4) rotate(0)",opacity:1},
      {transform:"scale(2.2) rotate(12deg)",opacity:.8},
      {transform:"scale(3.4) rotate(-20deg)",opacity:0}
    ],
    {
      duration:1050,
      fill:"forwards",
      easing:"ease-in"
    }
  );

  setTimeout(() => {
    document.body.classList.remove("final-shake");
    showWin("💥 БУМ! Лаоши больше не может это терпеть!", true);
    playFinalAudio();
  }, 1150);
}

// Вместо звуковых «Бип» запускается твоя аудиодорожка.
function playFinalAudio() {
  finalAudio.currentTime = 0;
  finalAudio.volume = 1;

  const p = finalAudio.play();

  if (p && typeof p.catch === "function") {
    p.catch(() => {
      censoredLine.textContent = "Не удалось запустить аудио. Проверь FINAL_AUDIO.";
    });
  }
}

function showWin(message, exploded) {
  gameArea.classList.remove("active");
  teacherPanel.classList.remove("active");
  patienceScale.classList.remove("active");
  winScreen.classList.add("active");

  $("winMessage").textContent = message;
  document.body.className = exploded ? "anger-5" : "";

  if (exploded) {
    censoredLine.textContent = "";
  } else {
    censoredLine.textContent = "老师今天心情不错！";
  }
}

// Когда аудиодорожка закончится, появляется новая надпись.
finalAudio.addEventListener("ended", () => {
  censoredLine.textContent = "лаоши познал дзен, попробуем еще раз?";
});

/* ---------------- КНОПКИ ПЕРЕЗАПУСКА ---------------- */

$("restartBtn").addEventListener("click", () => {
  finalAudio.pause();
  finalAudio.currentTime = 0;

  winScreen.classList.remove("active");
  setup.style.display = "block";
  gameArea.classList.remove("active");
  teacherPanel.classList.remove("active");
  patienceScale.classList.remove("active");

  teacherImg.style.transform = "scale(1)";
  teacherImg.style.opacity = "1";

  document.body.className = "";
  censoredLine.textContent = "";
});

$("backBtn").addEventListener("click", () => {
  finalAudio.pause();
  finalAudio.currentTime = 0;

  winScreen.classList.remove("active");
  setup.style.display = "block";
  gameArea.classList.remove("active");
  teacherPanel.classList.remove("active");
  patienceScale.classList.remove("active");

  document.body.className = "";
});

window.addEventListener("beforeunload", () => {
  if (photoObjectUrl) {
    URL.revokeObjectURL(photoObjectUrl);
  }
});
</script>
