    <button class="phrase" data-phrase="到了">🔊 到了</button>

<script>
/* ============================================================
   НАСТРОЙКИ ЗВУКА
   ============================================================ */
const STEP_VOLUME = 0.06;       // громкость обычного шага (тихо)
const NEAR_VOLUME = 0.10;       // громкость предупреждения о монстре рядом

/* ============================================================
   ЗВУК (Web Audio API)
   ============================================================ */
let audioCtx = null;
let soundEnabled = true;

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, dur, type = 'sine', startTime = 0, gain = 0.15) {
  if (!soundEnabled) return;
  ensureAudio();
  const t0 = audioCtx.currentTime + startTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g);
  g.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}

function playThud() {
  if (!soundEnabled) return;
  ensureAudio();
  const t0 = audioCtx.currentTime;
  const dur = 0.12;
  const bufferSize = audioCtx.sampleRate * dur;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(400, t0);
  filter.frequency.exponentialRampToValueAtTime(80, t0 + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.35, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filter);
  filter.connect(g);
  g.connect(audioCtx.destination);
  src.start(t0);
}

function soundStart() {
  playTone(523.25, 0.12, 'triangle', 0.00, 0.15);
  playTone(659.25, 0.12, 'triangle', 0.10, 0.15);
  playTone(783.99, 0.20, 'triangle', 0.20, 0.15);
}

function soundWallHit() { playThud(); }

function soundLose() {
  playTone(392.00, 0.18, 'square', 0.00, 0.18);
  playTone(311.13, 0.18, 'square', 0.15, 0.18);
  playTone(233.08, 0.40, 'square', 0.30, 0.20);
}

function soundMonster() {
  playTone(155.56, 0.35, 'sawtooth', 0.00, 0.18);
  playTone(220.00, 0.35, 'sawtooth', 0.00, 0.18);
  playTone(329.63, 0.45, 'sawtooth', 0.20, 0.20);
  playTone(220.00, 0.45, 'sawtooth', 0.35, 0.20);
  playTone(110.00, 0.55, 'sawtooth', 0.50, 0.22);
}

function soundWin() {
  playTone(523.25, 0.15, 'triangle', 0.00, 0.16);
  playTone(659.25, 0.15, 'triangle', 0.13, 0.16);
  playTone(783.99, 0.15, 'triangle', 0.26, 0.16);
  playTone(1046.50, 0.35, 'triangle', 0.39, 0.18);
  playTone(523.25, 0.50, 'sine', 0.60, 0.10);
  playTone(659.25, 0.50, 'sine', 0.60, 0.10);
  playTone(783.99, 0.50, 'sine', 0.60, 0.10);
}

// Тихий «тик» шага. Частота чередуется, чтобы не сливалось в один тон.
function soundStep() {
  const freq = (game.moves % 2 === 0) ? 660 : 740;
  playTone(freq, 0.05, 'square', 0, STEP_VOLUME);
}

// Предупреждение: игрок встал рядом с монстром
function soundNearMonster() {
  playTone(880, 0.08, 'triangle', 0, NEAR_VOLUME);
  playTone(660, 0.12, 'triangle', 0.06, NEAR_VOLUME * 0.8);
}

/* ============================================================
   ПАРАМЕТРЫ
   ============================================================ */
const COLS = 13;
const ROWS = 9;
const WALL_BREAK_RATIO = 0.18;
const MIN_PATH_LEN = 10;
const MAX_PATH_LEN = 20;
const MAX_STRAIGHT = 5;
const MAX_MAZE_ATTEMPTS = 200;

const WALL_MONSTERS_COUNT = 4;
const PATH_MONSTERS_COUNT = 2;

/* ============================================================
   БАЗОВАЯ ГЕНЕРАЦИЯ
   ============================================================ */
function generateMazeBase(cols, rows) {
  const grid = Array.from({ length: rows }, () => Array(cols).fill(1));
  const sx = 1, sy = 1;
  const stack = [[sx, sy]];
  grid[sy][sx] = 0;
  const visited = new Set([`${sx},${sy}`]);
  const dirs = [[2,0],[-2,0],[0,2],[0,-2]];

  while (stack.length) {
    const [cx, cy] = stack[stack.length - 1];
    const cands = dirs
      .map(([dx, dy]) => [cx + dx, cy + dy, dx, dy])
      .filter(([nx, ny]) =>
        nx > 0 && nx < cols - 1 && ny > 0 && ny < rows - 1 &&
        !visited.has(`${nx},${ny}`)
      );
    if (!cands.length) { stack.pop(); continue; }
    const [nx, ny, dx, dy] = cands[Math.floor(Math.random() * cands.length)];
    grid[cy + dy/2][cx + dx/2] = 0;
    grid[ny][nx] = 0;
    visited.add(`${nx},${ny}`);
    stack.push([nx, ny]);
  }

  const breakable = [];
  for (let y = 1; y < rows - 1; y++) {
    for (let x = 1; x < cols - 1; x++) {
      if (grid[y][x] !== 1) continue;
      const up    = grid[y-1][x] === 0;
      const down  = grid[y+1][x] === 0;
      const left  = grid[y][x-1] === 0;
      const right = grid[y][x+1] === 0;
      if ((up && down && !left && !right) || (left && right && !up && !down)) {
        breakable.push([x, y]);
      }
    }
  }
  shuffle(breakable);
  const toRemove = Math.floor(breakable.length * WALL_BREAK_RATIO);
  for (let i = 0; i < toRemove; i++) {
    const [x, y] = breakable[i];
    grid[y][x] = 0;
  }
  return grid;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}

/* ============================================================
   BFS / ПРОВЕРКИ
   ============================================================ */
function bfsPath(grid, start, goal) {
  const rows = grid.length, cols = grid[0].length;
  const seen = Array.from({ length: rows }, () => Array(cols).fill(false));
  const prev = Array.from({ length: rows }, () => Array(cols).fill(null));
  const queue = [start];
  seen[start[1]][start[0]] = true;

  while (queue.length) {
    const [x, y] = queue.shift();
    if (x === goal[0] && y === goal[1]) {
      const path = [];
      let cur = [x, y];
      while (cur) { path.push(cur); cur = prev[cur[1]][cur[0]]; }
      return path.reverse();
    }
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < cols && ny >= 0 && ny < rows &&
          !seen[ny][nx] && grid[ny][nx] === 0) {
        seen[ny][nx] = true;
        prev[ny][nx] = [x, y];
        queue.push([nx, ny]);
      }
    }
  }
  return null;
}

function pathExists(grid, start, goal) {
  return bfsPath(grid, start, goal) !== null;
}

function allPathsConnected(grid) {
  const rows = grid.length, cols = grid[0].length;
  let first = null, total = 0;
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < cols; x++)
      if (grid[y][x] === 0) { total++; if (!first) first = [x, y]; }
  if (!first) return true;
  const seen = Array.from({ length: rows }, () => Array(cols).fill(false));
  const queue = [first];
  seen[first[1]][first[0]] = true;
  let reached = 1;
  while (queue.length) {
    const [cx, cy] = queue.shift();
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx >= 0 && nx < cols && ny >= 0 && ny < rows &&
          !seen[ny][nx] && grid[ny][nx] === 0) {
        seen[ny][nx] = true; reached++; queue.push([nx, ny]);
      }
    }
  }
  return reached === total;
}

function hasLongStraight(grid, maxRun) {
  const rows = grid.length, cols = grid[0].length;
  for (let y = 1; y < rows - 1; y++) {
    let run = 0;
    for (let x = 0; x < cols; x++) {
      if (grid[y][x] === 0) run++; else run = 0;
      if (run > maxRun) return true;
    }
  }
  for (let x = 1; x < cols - 1; x++) {
    let run = 0;
    for (let y = 0; y < rows; y++) {
      if (grid[y][x] === 0) run++; else run = 0;
      if (run > maxRun) return true;
    }
  }
  return false;
}

function pathMaxStraight(path, maxRun) {
  if (!path || path.length < 2) return false;
  let run = 1;
  let dir = null;
  for (let i = 1; i < path.length; i++) {
    const dx = path[i][0] - path[i-1][0];
    const dy = path[i][1] - path[i-1][1];
    const cur = `${dx},${dy}`;
    if (cur === dir) run++;
    else { dir = cur; run = 1; }
    if (run > maxRun) return true;
  }
  return false;
}

/* ============================================================
   УКОРАЧИВАНИЕ ПРЯМЫХ
   ============================================================ */
function shortenStraights(grid, start, goal) {
  const rows = grid.length, cols = grid[0].length;

  for (let pass = 0; pass < 50; pass++) {
    let changed = false;

    for (let y = 1; y < rows - 1; y++) {
      let x = 1;
      while (x < cols - 1) {
        if (grid[y][x] !== 0) { x++; continue; }
        let end = x;
        while (end < cols - 1 && grid[y][end] === 0) end++;
        const run = end - x;

        if (run > MAX_STRAIGHT) {
          const need = run - MAX_STRAIGHT;
          for (let k = 0; k < need; k++) {
            let cx = x;
            let cend = x;
            while (cend < cols - 1 && grid[y][cend] === 0) cend++;
            if (cend - cx <= MAX_STRAIGHT) break;
            const mid = cx + Math.floor((cend - cx) / 2);
            let placed = false;
            for (let d = 0; d <= Math.floor((cend - cx) / 2); d++) {
              for (const cand of [mid + d, mid - d]) {
                if (cand <= cx || cand >= cend - 1) continue;
                if (tryInsertWall(grid, cand, y, start, goal)) {
                  placed = true; changed = true; break;
                }
              }
              if (placed) break;
            }
            if (!placed) break;
          }
        }
        x = end;
      }
    }

    for (let x = 1; x < cols - 1; x++) {
      let y = 1;
      while (y < rows - 1) {
        if (grid[y][x] !== 0) { y++; continue; }
        let end = y;
        while (end < rows - 1 && grid[end][x] === 0) end++;
        const run = end - y;

        if (run > MAX_STRAIGHT) {
          const need = run - MAX_STRAIGHT;
          for (let k = 0; k < need; k++) {
            let cy = y;
            let cend = y;
            while (cend < rows - 1 && grid[cend][x] === 0) cend++;
            if (cend - cy <= MAX_STRAIGHT) break;
            const mid = cy + Math.floor((cend - cy) / 2);
            let placed = false;
            for (let d = 0; d <= Math.floor((cend - cy) / 2); d++) {
              for (const cand of [mid + d, mid - d]) {
                if (cand <= cy || cand >= cend - 1) continue;
                if (tryInsertWall(grid, x, cand, start, goal)) {
                  placed = true; changed = true; break;
                }
              }
              if (placed) break;
            }
            if (!placed) break;
          }
        }
        y = end;
      }
    }

    if (!changed) break;
  }
}

function tryInsertWall(grid, x, y, start, goal) {
  if (grid[y][x] !== 0) return false;
  if ((x === start[0] && y === start[1]) ||
      (x === goal[0]  && y === goal[1]))  return false;

  grid[y][x] = 1;

  const rows = grid.length, cols = grid[0].length;
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    const nx = x + dx, ny = y + dy;
    if (nx <= 0 || ny <= 0 || nx >= cols - 1 || ny >= rows - 1) continue;
    if (grid[ny][nx] !== 0) continue;
    if (nx === start[0] && ny === start[1]) continue;
    if (nx === goal[0]  && ny === goal[1])  continue;

    let openN = 0;
    for (const [ddx, ddy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      if (grid[ny + ddy][nx + ddx] === 0) openN++;
    }
    if (openN === 0) { grid[y][x] = 0; return false; }
  }

  if (!allPathsConnected(grid) || !pathExists(grid, start, goal)) {
    grid[y][x] = 0;
    return false;
  }
  return true;
}

/* ============================================================
   СТАРТ / ВЫХОД
   ============================================================ */
function innerCells(grid) {
  const rows = grid.length, cols = grid[0].length;
  const cells = [];
  for (let y = 1; y < rows - 1; y++)
    for (let x = 1; x < cols - 1; x++)
      if (grid[y][x] === 0) cells.push([x, y]);
  return cells;
}

function exitCandidates(grid) {
  const rows = grid.length, cols = grid[0].length;
  const cands = [];
  for (let x = 1; x < cols - 1; x++) {
    if (grid[1][x] === 0)        cands.push({ x, y: 0,        inner: [x, 1] });
    if (grid[rows - 2][x] === 0) cands.push({ x, y: rows - 1, inner: [x, rows - 2] });
  }
  for (let y = 1; y < rows - 1; y++) {
    if (grid[y][1] === 0)        cands.push({ x: 0,        y, inner: [1, y] });
    if (grid[y][cols - 2] === 0) cands.push({ x: cols - 1, y, inner: [cols - 2, y] });
  }
  return cands;
}

function carveExit(grid, exit) {
  grid[exit.y][exit.x] = 0;
}

function pickStartAndExit(grid) {
  const inners = innerCells(grid);
  if (!inners.length) return null;

  for (let attempt = 0; attempt < 300; attempt++) {
    const start = inners[Math.floor(Math.random() * inners.length)];
    const exits = exitCandidates(grid);
    if (!exits.length) continue;
    shuffle(exits);

    for (const exit of exits) {
      const prev = grid[exit.y][exit.x];
      carveExit(grid, exit);
      const path = bfsPath(grid, start, [exit.x, exit.y]);
      grid[exit.y][exit.x] = prev;
      if (!path) continue;
      const len = path.length - 1;
      if (len >= MIN_PATH_LEN && len <= MAX_PATH_LEN) {
        return { start, exit, pathLen: len };
      }
    }
  }
  return null;
}

/* ============================================================
   МОНСТРЫ
   ============================================================ */
function innerWalls(grid, start, goal) {
  const rows = grid.length, cols = grid[0].length;
  const walls = [];
  for (let y = 1; y < rows - 1; y++)
    for (let x = 1; x < cols - 1; x++) {
      if (grid[y][x] !== 1) continue;
      if (x === start[0] && y === start[1]) continue;
      if (x === goal[0]  && y === goal[1])  continue;
      walls.push([x, y]);
    }
  return walls;
}

function placeMonstersInWalls(grid, start, goal, count) {
  const walls = innerWalls(grid, start, goal);
  shuffle(walls);
  const chosen = walls.slice(0, Math.min(count, walls.length));
  const set = new Set();
  for (const [x, y] of chosen) set.add(`${x},${y}`);
  return set;
}

function placeMonstersOnPath(grid, start, goal, shortestPath, count) {
  if (!shortestPath || shortestPath.length < 5) return new Set();

  const forbidden = new Set();
  forbidden.add(`${start[0]},${start[1]}`);
  forbidden.add(`${goal[0]},${goal[1]}`);
  forbidden.add(`${shortestPath[1][0]},${shortestPath[1][1]}`);
  forbidden.add(`${shortestPath[shortestPath.length - 2][0]},${shortestPath[shortestPath.length - 2][1]}`);

  const candidates = shortestPath.filter(([x, y]) => !forbidden.has(`${x},${y}`));
  shuffle(candidates);

  const monsters = new Set();
  for (const [x, y] of candidates) {
    if (monsters.size >= count) break;
    grid[y][x] = 1;
    const ok = pathExists(grid, start, goal);
    grid[y][x] = 0;
    if (ok) monsters.add(`${x},${y}`);
  }
  return monsters;
}

/* ============================================================
   СБОРКА
   ============================================================ */
function buildMaze() {
  for (let attempt = 1; attempt <= MAX_MAZE_ATTEMPTS; attempt++) {
    const grid = generateMazeBase(COLS, ROWS);
    const pair = pickStartAndExit(grid);
    if (!pair) continue;

    const goal = [pair.exit.x, pair.exit.y];
    carveExit(grid, pair.exit);
    shortenStraights(grid, pair.start, goal);

    if (hasLongStraight(grid, MAX_STRAIGHT)) continue;

    const finalPath = bfsPath(grid, pair.start, goal);
    if (!finalPath) continue;
    const len = finalPath.length - 1;
    if (len < MIN_PATH_LEN || len > MAX_PATH_LEN) continue;
    if (pathMaxStraight(finalPath, MAX_STRAIGHT)) continue;
    if (!allPathsConnected(grid)) continue;

    const wallMonsters = placeMonstersInWalls(grid, pair.start, goal, WALL_MONSTERS_COUNT);
    const pathMonsters = placeMonstersOnPath(grid, pair.start, goal, finalPath, PATH_MONSTERS_COUNT);

    return {
      grid,
      start: pair.start,
      goal,
      pathLen: len,
      attempts: attempt,
      wallMonsters,
      pathMonsters,
    };
  }
  return null;
}

/* ============================================================
   СОСТОЯНИЕ ИГРЫ
   ============================================================ */
const mazeEl = document.getElementById('maze');
const infoEl = document.getElementById('info');
const statMoves = document.getElementById('statMoves');
const statStart = document.getElementById('statStart');
const statGoal  = document.getElementById('statGoal');
const statLen   = document.getElementById('statLen');
const soundBtn  = document.getElementById('soundBtn');

let game = null;

function newGame() {
  const result = buildMaze();
  if (!result) {
    infoEl.innerHTML = `<span class="bad">Не удалось сгенерировать лабиринт. Нажми «Новая игра» ещё раз.</span>`;
    return;
  }
  game = {
    ...result,
    player: { x: result.start[0], y: result.start[1] },
    moves: 0,
    finished: false,
  };
  renderMaze();
  updateStats();
  infoEl.innerHTML = `Лабиринт готов. Ведите пакмана к 🚪.`;
  soundStart();
}

/* ============================================================
   РЕНДЕР
   ============================================================ */
function renderMaze() {
  const { grid, start, goal, wallMonsters, pathMonsters, player } = game;
  mazeEl.innerHTML = '';
  mazeEl.style.gridTemplateColumns = `repeat(${grid[0].length}, 30px)`;

  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      const cell = document.createElement('div');
      const key = `${x},${y}`;

      if (grid[y][x] === 1) {
        cell.className = 'cell wall';
        if (wallMonsters.has(key)) {
          cell.classList.add('wall-monster');
          cell.textContent = '👾';
        }
      } else {
        cell.className = 'cell path';
      }

      if (x === start[0] && y === start[1] && !(player.x === x && player.y === y)) {
        cell.className = 'cell start';
        cell.textContent = 'A';
      } else if (x === goal[0] && y === goal[1] && !(player.x === x && player.y === y)) {
        cell.className = 'cell goal';
        cell.textContent = '🚪';
      } else if (pathMonsters.has(key) && !(player.x === x && player.y === y)) {
        cell.classList.add('path-monster');
        cell.textContent = '🐲';
      }

      if (player.x === x && player.y === y) {
        cell.classList.add('pac');
        cell.textContent = '🐱';
      }

      mazeEl.appendChild(cell);
    }
  }
}

function updateStats() {
  statMoves.textContent = game.moves;
  statStart.textContent = `(${game.start[0]}, ${game.start[1]})`;
  statGoal.textContent  = `(${game.goal[0]}, ${game.goal[1]})`;
  statLen.textContent   = game.pathLen;
}

/* ============================================================
   ПРОВЕРКА «РЯДОМ С МОНСТРОМ»
   ============================================================ */
function isMonsterNearby(x, y) {
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    const nx = x + dx, ny = y + dy;
    const key = `${nx},${ny}`;
    if (game.wallMonsters.has(key)) return true;
    if (game.pathMonsters.has(key)) return true;
  }
  return false;
}

/* ============================================================
   ДВИЖЕНИЕ
   ============================================================ */
const DIRS = {
  up:    { dx: 0,  dy: -1 },
  down:  { dx: 0,  dy: 1  },
  left:  { dx: -1, dy: 0  },
  right: { dx: 1,  dy: 0  },
};

function tryMove(dir) {
  if (!game || game.finished) return;
  const d = DIRS[dir];
  if (!d) return;

  const nx = game.player.x + d.dx;
  const ny = game.player.y + d.dy;
  const key = `${nx},${ny}`;

  // За пределами поля — как стена
  if (ny < 0 || ny >= game.grid.length || nx < 0 || nx >= game.grid[0].length) {
    game.finished = true;
    soundWallHit();
    setTimeout(soundLose, 200);
    infoEl.innerHTML = '<span class="bad">💥 Ты врезался в невидимую стену! Игра окончена.</span>';
    return;
  }

  // Стена (обычная или с монстром)
  if (game.grid[ny][nx] === 1) {
    game.finished = true;
    if (game.wallMonsters.has(key)) {
      soundMonster();
      setTimeout(soundLose, 500);
      infoEl.innerHTML = '<span class="bad">💀 Из стены выскочил монстр! Игра окончена.</span>';
    } else {
      soundWallHit();
      setTimeout(soundLose, 200);
      infoEl.innerHTML = '<span class="bad">💥 Ты врезался в стену! Игра окончена.</span>';
    }
    return;
  }

  // Монстр на пути
  if (game.pathMonsters.has(key)) {
    game.finished = true;
    soundMonster();
    setTimeout(soundLose, 500);
    infoEl.innerHTML = '<span class="bad">💀 Ты наступил на спящего дракона! Игра окончена.</span>';
    return;
  }

  // Успешный шаг
  game.player.x = nx;
  game.player.y = ny;
  game.moves++;
  renderMaze();
  updateStats();

  // Победа? Проверяем ДО звука шага, чтобы не накладывать тик на фанфары.
  if (nx === game.goal[0] && ny === game.goal[1]) {
    game.finished = true;
    soundWin();
    infoEl.innerHTML = '<span class="good">🎉 ПОБЕДА! Ты нашёл выход!</span>';
    return;
  }

  // Звук шага: если рядом монстр — предупреждение, иначе — тихий тик
  if (isMonsterNearby(nx, ny)) {
    soundNearMonster();
  } else {
    soundStep();
  }

  infoEl.textContent = '';
}

/* ============================================================
   УПРАВЛЕНИЕ
   ============================================================ */
document.querySelectorAll('.dpad button').forEach(btn => {
  btn.addEventListener('click', () => {
    ensureAudio();
    tryMove(btn.dataset.dir);
  });
});

document.addEventListener('keydown', (e) => {
  const map = {
    ArrowUp: 'up',    ArrowDown: 'down',
    ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right',
  };
  const dir = map[e.key];
  if (dir) {
    e.preventDefault();
    ensureAudio();
    tryMove(dir);
  }
});

document.getElementById('startBtn').addEventListener('click', () => {
  ensureAudio();
  newGame();
});

soundBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundBtn.textContent = soundEnabled ? '🔊 Звук вкл' : '🔇 Звук выкл';
  if (soundEnabled) {
    ensureAudio();
    soundStart();
  }
});

/* ============================================================
   ОЗВУЧКА КИТАЙСКИХ ФРАЗ (Web Speech API)
   ============================================================ */
let preferredVoice = null;

function pickChineseVoice() {
  const voices = speechSynthesis.getVoices();
  preferredVoice =
    voices.find(v => v.lang === 'zh-CN') ||
    voices.find(v => v.lang === 'zh-TW') ||
    voices.find(v => v.lang.startsWith('zh')) ||
    null;
}

if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickChineseVoice;
  pickChineseVoice();
}

function speakChinese(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = 0.85;
  u.pitch = 1.0;
  if (preferredVoice) u.voice = preferredVoice;
  speechSynthesis.speak(u);
}

document.querySelectorAll('.cheatsheet-buttons .phrase').forEach(btn => {
  btn.addEventListener('click', () => {
    ensureAudio();
    speakChinese(btn.dataset.phrase);
  });
});

/* ============================================================
   СТАРТ
   ============================================================ */
window.addEventListener('load', newGame);
</script>
