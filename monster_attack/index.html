<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>🎃 僵尸来袭 🧟</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body {
    background:#000;
    font-family:'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif;
    overflow:hidden; color:#fff;
    height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  #game {
    position:relative;
    width:1100px; height:640px;
    border:2px solid #3a1a1a; border-radius:6px;
    overflow:hidden;
    transition:background .5s;
  }

  /* ============ ФОН ============ */
  body.theme-horror #game {
    background:
      radial-gradient(ellipse at 50% 120%, #5a0808 0%, #2a0303 30%, #0a0000 60%, #000 100%);
    box-shadow:0 0 100px rgba(150,0,0,.9), inset 0 0 250px rgba(0,0,0,1);
  }
  body.theme-funny #game {
    background:linear-gradient(180deg, #87ceeb 0%, #b0e0e6 40%, #ffd9a8 80%, #d9c890 100%);
    box-shadow:0 0 60px rgba(255,200,100,.5), inset 0 0 120px rgba(255,220,150,.3);
  }
  body.theme-lotr #game {
    background:linear-gradient(180deg,
      #7cb4d8 0%, #a8d4e8 25%, #d8e8c8 50%, #8ab86a 78%, #5a8a3a 100%);
    box-shadow:0 0 60px rgba(120,180,80,.5), inset 0 0 120px rgba(200,230,180,.2);
  }

  /* ============ СЛОИ ============ */
  #stars, #moon, #ground, #fog, #scene, #bloodfog, #bloodDrops,
  #vignette, #glitch, #flashLightning { position:absolute; inset:0; pointer-events:none; }

  #stars { z-index:1; }
  .star { position:absolute; background:#fff; border-radius:50%; opacity:.5; animation:twinkle 3s infinite; }
  @keyframes twinkle { 0%,100%{opacity:.15} 50%{opacity:.9} }

  #moon { z-index:2; }
  body.theme-horror #moon::after {
    content:'';
    position:absolute; top:25px; right:25px;
    width:100px; height:100px; border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #ffe8a0 0%, #cc6622 35%, #8a1a08 90%);
    box-shadow:
      0 0 80px rgba(220,60,20,1),
      0 0 160px rgba(150,20,0,.9),
      0 0 260px rgba(100,0,0,.6);
    animation:moonPulse 3s infinite alternate;
  }
  @keyframes moonPulse {
    0% { box-shadow:0 0 80px rgba(220,60,20,1), 0 0 160px rgba(150,20,0,.9); }
    100% { box-shadow:0 0 120px rgba(255,80,40,1), 0 0 240px rgba(220,30,0,1), 0 0 340px rgba(140,0,0,.8); }
  }

  #flashLightning {
    z-index:14; opacity:0;
    background:radial-gradient(ellipse at 70% 20%, rgba(255,255,255,1), rgba(200,200,255,.6) 30%, transparent 70%);
    display:none;
  }
  body.theme-horror #flashLightning { display:block; }

  #bloodfog {
    left:0; right:0; bottom:0; top:auto; height:220px;
    background:linear-gradient(0deg, rgba(150,10,10,.9) 0%, rgba(90,5,5,.6) 40%, transparent 100%);
    z-index:3; opacity:0; pointer-events:none;
    animation:fogPulse 5s infinite alternate;
    transition:opacity .6s;
  }
  body.theme-horror #bloodfog { opacity:1; }
  @keyframes fogPulse { 0% { opacity:.7; transform:translateY(0); } 100% { opacity:1; transform:translateY(-8px); } }

  #ground {
    top:auto; bottom:0; left:0; right:0; height:100px; z-index:4;
    transition:background .5s;
  }
  body.theme-horror #ground {
    background:
      radial-gradient(ellipse at 50% 0%, #4a0a0a 0%, #1a0202 60%, #000 100%),
      linear-gradient(180deg, transparent 0%, #000 100%);
    border-top:2px solid #6a0000;
  }
  body.theme-horror #ground::before {
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(circle at 15% 40%, rgba(150,0,0,.8) 8px, transparent 20px),
      radial-gradient(circle at 38% 60%, rgba(180,0,0,.7) 12px, transparent 26px),
      radial-gradient(circle at 62% 35%, rgba(120,0,0,.8) 10px, transparent 22px),
      radial-gradient(circle at 85% 55%, rgba(160,0,0,.7) 14px, transparent 30px);
    background-size:200px 100px;
    filter:blur(2px);
  }
  body.theme-funny #ground {
    background:radial-gradient(ellipse at 20% 0%, #a8d878 0%, #78b048 40%, #4a7a28 100%);
    border-top:3px dashed rgba(255,255,255,.4);
  }
  body.theme-lotr #ground {
    background:radial-gradient(ellipse at 30% 0%, #9ac87a 0%, #6a9a4a 40%, #3a6a2a 100%);
    border-top:2px solid rgba(80,120,60,.5);
  }

  #fog {
    z-index:3; opacity:0; transition:opacity .6s;
    background:
      radial-gradient(circle at 20% 80%, rgba(180,20,20,.25), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(120,10,10,.25), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(60,0,0,.3), transparent 60%);
    animation:fogMove 12s infinite alternate;
  }
  body.theme-horror #fog { opacity:1; }
  @keyframes fogMove {
    0% { transform:translateX(0) scale(1); }
    100% { transform:translateX(-60px) scale(1.1); }
  }

  #bloodDrops {
    z-index:6; overflow:hidden; display:none;
  }
  body.theme-horror #bloodDrops { display:block; }
  .blood-drop {
    position:absolute; top:-30px; width:4px;
    background:linear-gradient(180deg, #cc0000, #5a0000);
    border-radius:50% 50% 40% 40%;
    filter:blur(.5px);
    animation:dropFall linear forwards;
  }
  .blood-drop::after {
    content:''; position:absolute; bottom:-3px; left:50%;
    transform:translateX(-50%); width:10px; height:10px;
    background:radial-gradient(circle, #8a0000 0%, transparent 70%);
    border-radius:50%;
  }
  @keyframes dropFall {
    0%   { transform:translateY(0); opacity:0; }
    10%  { opacity:1; }
    100% { transform:translateY(700px); opacity:.6; }
  }

  #vignette { z-index:15; transition:background .5s; }
  body.theme-horror #vignette {
    background:radial-gradient(ellipse at 50% 55%,
      transparent 15%,
      rgba(40,0,0,.5) 45%,
      rgba(0,0,0,.95) 85%);
    animation:vignettePulse 2.5s infinite alternate;
  }
  @keyframes vignettePulse {
    0% { opacity:.9; }
    100% { opacity:1; }
  }

  .shadow-runner {
    position:absolute; width:60px; height:180px;
    background:radial-gradient(ellipse at 50% 50%, #000 0%, transparent 70%);
    opacity:.9; z-index:5; filter:blur(4px);
    pointer-events:none;
  }

  #glitch {
    z-index:16; opacity:0;
    background:linear-gradient(90deg, transparent 0%, rgba(255,0,0,.4) 48%, transparent 50%, rgba(255,0,0,.4) 52%, transparent 100%);
    mix-blend-mode:screen; display:none;
  }
  body.theme-horror #glitch { display:block; }
  #glitch.active { animation:glitchFlash .3s; }
  @keyframes glitchFlash {
    0%   { opacity:0; transform:translate(0); }
    20%  { opacity:1; transform:translate(-8px, 4px); }
    40%  { opacity:0; transform:translate(6px, -3px); }
    60%  { opacity:1; transform:translate(-4px, 2px); }
    80%  { opacity:0; transform:translate(2px, -1px); }
    100% { opacity:0; transform:translate(0); }
  }

  #scene { z-index:2; overflow:hidden; }

  /* FUNNY */
  .rainbow {
    position:absolute; top:-60px; left:50%; transform:translateX(-50%);
    width:600px; height:300px; border-radius:50% 50% 0 0 / 100% 100% 0 0;
    background:conic-gradient(from 200deg at 50% 100%,
      #ff5555 0 20deg, #ffaa33 20deg 40deg, #ffee44 40deg 60deg,
      #66dd66 60deg 80deg, #44aaff 80deg 100deg, #aa66ff 100deg 120deg,
      #ff5555 120deg 140deg);
    opacity:.35; filter:blur(2px);
  }
  .cloud {
    position:absolute; background:#ffffff; border-radius:50%;
    opacity:.85; filter:blur(.5px);
  }
  .candy {
    position:absolute; width:14px; height:14px; border-radius:50%; opacity:.9;
  }
  .candy::after {
    content:''; position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%); width:60%; height:60%;
    border-radius:50%; background:rgba(255,255,255,.7);
  }
  .balloon {
    position:absolute; width:24px; height:30px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity:.9; animation:float 4s ease-in-out infinite alternate;
  }
  .balloon::after {
    content:''; position:absolute; top:100%; left:50%;
    width:1px; height:24px; background:rgba(0,0,0,.3);
    transform:translateX(-50%);
  }
  @keyframes float {
    0% { transform:translateY(0) rotate(-3deg); }
    100% { transform:translateY(-10px) rotate(3deg); }
  }

  /* LOTR */
  .mountain { position:absolute; bottom:80px; width:0; height:0; border-style:solid; }
  .hill { position:absolute; bottom:60px; border-radius:50% 50% 0 0 / 100% 100% 0 0; }
  .sun {
    position:absolute; top:50px; right:120px;
    width:70px; height:70px; border-radius:50%;
    background:radial-gradient(circle, #fff8c0 0%, #ffe060 50%, #ffb020 100%);
    box-shadow:0 0 60px rgba(255,220,120,.9), 0 0 120px rgba(255,180,60,.5);
  }
  .softcloud {
    position:absolute; background:#ffffff; border-radius:50%;
    opacity:.75; filter:blur(1px);
  }
  .lotr-tree {
    position:absolute; bottom:80px; width:8px; height:80px;
    background:linear-gradient(180deg, #6a4a20, #3a2a08);
    border-radius:3px;
  }
  .lotr-tree::before {
    content:''; position:absolute; top:-40px; left:50%;
    transform:translateX(-50%); width:70px; height:60px;
    border-radius:50% 50% 40% 40%;
    background:radial-gradient(circle at 40% 40%, #6a9a3a 0%, #3a6a20 70%, #1a3a08 100%);
    box-shadow:-20px 10px 0 -10px #4a7a28, 20px 10px 0 -10px #4a7a28;
  }

  /* ============ HUD ============ */
  #hud {
    position:absolute; top:14px; left:14px;
    display:flex; gap:14px; font-size:15px; z-index:20;
    font-family:'Courier New', monospace; letter-spacing:1px;
  }
  #hud div {
    background:rgba(20,0,0,.9);
    padding:7px 14px; border-radius:4px;
    border:1px solid #8a0000;
    box-shadow:0 0 15px rgba(255,0,0,.6), inset 0 0 10px rgba(80,0,0,.5);
    text-shadow:0 0 10px rgba(255,20,20,.9);
    color:#ffaaaa;
    transition:all .4s;
  }
  body.theme-funny #hud div {
    background:rgba(255,255,255,.9); color:#6a3a00;
    border:2px solid #ff8844;
    box-shadow:0 4px 12px rgba(0,0,0,.2); text-shadow:none;
  }
  body.theme-lotr #hud div {
    background:rgba(30,50,20,.85); color:#e8f0c8;
    border:1px solid #8ab86a;
    box-shadow:0 0 15px rgba(120,180,80,.5);
    text-shadow:0 0 8px rgba(180,220,140,.6);
  }
  #hud .accent { color:#ff2222; text-shadow:0 0 15px #ff0000; font-weight:bold; }
  body.theme-funny #hud .accent { color:#d95400; text-shadow:none; }
  body.theme-lotr #hud .accent { color:#d8e88a; text-shadow:0 0 8px rgba(180,220,140,.6); }

  /* ============ ВРАГИ ============ */
  .zombie {
    position:absolute; width:85px; height:160px; z-index:8;
    transition:filter .15s;
  }

  body.theme-horror .zombie {
    filter:
      drop-shadow(0 12px 20px rgba(0,0,0,1))
      drop-shadow(0 0 20px rgba(180,10,10,.8))
      contrast(1.15) saturate(1.2);
    animation:zombieSway 2.4s infinite alternate;
  }
  @keyframes zombieSway {
    0% { transform:rotate(-3deg) translateY(0);}
    100% { transform:rotate(3deg) translateY(-3px);}
  }
  body.theme-horror .zombie.charging {
    animation:chargeAttack .8s ease-in forwards !important;
    filter:drop-shadow(0 0 60px #ff0000) brightness(1.8) saturate(2.5);
  }
  @keyframes chargeAttack {
    0% { transform:translateX(0) scale(1) rotate(0); }
    40% { transform:translateX(-90px) scale(1.4) rotate(-12deg); }
    100% { transform:translateX(-170px) scale(0.3) rotate(-45deg); opacity:.1; }
  }

  body.theme-horror .z-torso {
    position:absolute; top:55px; left:15px;
    width:55px; height:70px;
    background:
      radial-gradient(ellipse at 30% 40%, #7a4a28 0%, #3a1a10 50%, #0a0200 100%),
      linear-gradient(180deg, #8a3a18 0%, #2a0808 100%);
    border-radius:8px 8px 5px 5px;
    border:1px solid #000;
    box-shadow:
      inset 0 0 20px rgba(0,0,0,1),
      inset 8px 10px 12px rgba(180,10,10,.85),
      inset -6px -6px 10px rgba(0,0,0,.95),
      0 0 25px rgba(180,0,0,.5);
    overflow:hidden;
  }
  body.theme-horror .z-torso::before {
    content:''; position:absolute;
    top:15px; left:8px;
    width:34px; height:26px;
    background:
      radial-gradient(ellipse at 30% 30%,
        #f0d8b0 0%, #c01818 30%, #8a0a0a 60%, #2a0000 90%, transparent 100%);
    border-radius:50%;
    transform:rotate(-15deg);
    box-shadow:0 0 14px rgba(0,0,0,.9), inset 0 0 10px rgba(180,0,0,.9);
    filter:blur(.4px);
  }
  body.theme-horror .z-torso::after {
    content:''; position:absolute;
    bottom:0; left:20px;
    width:16px; height:40px;
    background:linear-gradient(180deg, #b80a0a 0%, #6a0000 60%, #1a0000 100%);
    border-radius:0 0 40% 40%;
    box-shadow:inset 2px 0 6px rgba(0,0,0,.9), 0 0 8px rgba(180,0,0,.6);
    transform:rotate(8deg);
    filter:blur(.3px);
  }

  body.theme-horror .z-arm {
    position:absolute; top:60px;
    width:52px; height:14px;
    background:linear-gradient(180deg, #6a4028 0%, #4a2010 40%, #1a0800 100%);
    border-radius:6px;
    border:1px solid #000;
    box-shadow:
      inset -4px 0 10px rgba(0,0,0,.95),
      0 0 12px rgba(180,0,0,.7);
  }
  body.theme-horror .z-arm.l { left:-40px; transform:rotate(-10deg); transform-origin:right center; }
  body.theme-horror .z-arm.r { right:-40px; transform:rotate(10deg); transform-origin:left center; }
  body.theme-horror .z-arm::after {
    content:''; position:absolute; top:50%;
    transform:translateY(-50%);
    width:16px; height:16px;
    background:radial-gradient(circle at 40% 40%, #ff2222 0%, #a80000 50%, #2a0000 100%);
    border-radius:50%;
    box-shadow:0 0 15px #ff0000, 0 0 30px #ff0000, inset 0 0 8px rgba(0,0,0,.9);
  }
  body.theme-horror .z-arm.l::after { left:-8px; }
  body.theme-horror .z-arm.r::after { right:-8px; }
  body.theme-horror .z-arm::before {
    content:''; position:absolute;
    top:50%; transform:translateY(-50%);
    width:8px; height:20px;
    background:linear-gradient(180deg, #f0e0b8, #8a7040);
    clip-path:polygon(50% 0, 100% 100%, 0 100%);
    filter:drop-shadow(0 0 4px rgba(0,0,0,.9));
  }
  body.theme-horror .z-arm.l::before { left:-6px; }
  body.theme-horror .z-arm.r::before { right:-6px; transform:translateY(-50%) rotate(180deg); }

  body.theme-horror .z-head {
    position:absolute; top:5px; left:14px;
    width:55px; height:60px;
    background:
      radial-gradient(circle at 35% 35%,
        #b8a878 0%,
        #7a5a38 40%,
        #3a2010 80%,
        #0a0400 100%);
    border-radius:50% 50% 45% 45% / 55% 55% 45% 45%;
    border:1px solid #000;
    box-shadow:
      inset -6px -6px 14px rgba(0,0,0,.95),
      inset 6px 6px 10px rgba(200,160,80,.2),
      0 0 30px rgba(180,0,0,.7);
    animation:headTwitch 2.5s infinite;
  }
  @keyframes headTwitch {
    0%, 88%, 100% { transform:rotate(0); }
    90% { transform:rotate(6deg); }
    92% { transform:rotate(-8deg); }
    94% { transform:rotate(4deg); }
  }
  body.theme-horror .z-head::before {
    content:''; position:absolute;
    top:-10px; left:8px;
    width:40px; height:24px;
    background:
      radial-gradient(ellipse at 50% 80%,
        #2a0000 0%, #8a0a0a 30%, #d8a0a0 55%, transparent 85%);
    border-radius:50% 50% 0 0;
    box-shadow:
      inset 0 -6px 12px rgba(0,0,0,.95),
      0 0 18px rgba(180,0,0,.9);
    filter:blur(.4px);
  }
  body.theme-horror .z-head::after {
    content:''; position:absolute;
    top:-2px; left:4px; right:4px;
    height:14px;
    background:
      radial-gradient(circle at 15% 50%, #1a0e0a 0 3px, transparent 4px),
      radial-gradient(circle at 32% 30%, #1a0e0a 0 3px, transparent 4px),
      radial-gradient(circle at 52% 60%, #1a0e0a 0 3px, transparent 4px),
      radial-gradient(circle at 72% 40%, #1a0e0a 0 3px, transparent 4px),
      radial-gradient(circle at 88% 55%, #1a0e0a 0 3px, transparent 4px);
    border-radius:50%;
    filter:drop-shadow(0 0 3px rgba(0,0,0,.95));
  }

  body.theme-horror .z-eye {
    position:absolute;
    width:14px; height:14px;
    background:radial-gradient(circle,
      #fff 0%,
      #ff5500 20%,
      #ff0000 45%,
      #5a0000 75%,
      #000 100%);
    border-radius:50%;
    box-shadow:
      0 0 20px #ff2200,
      0 0 40px #ff0000,
      0 0 70px rgba(255,0,0,.9),
      0 0 100px rgba(255,0,0,.6),
      inset 0 0 10px #000;
    animation:eyeGlow 0.9s infinite alternate;
    z-index:2;
  }
  body.theme-horror .z-eye.l { top:22px; left:8px; }
  body.theme-horror .z-eye.r { top:20px; right:6px; }
  @keyframes eyeGlow {
    0% { box-shadow:0 0 15px #ff2200, 0 0 30px #ff0000, 0 0 50px rgba(255,0,0,.7); }
    100% { box-shadow:0 0 25px #ff5500, 0 0 55px #ff0000, 0 0 100px rgba(255,0,0,1); }
  }

  body.theme-horror .z-mouth {
    position:absolute; top:42px; left:50%;
    transform:translateX(-50%);
    width:32px; height:18px;
    background:radial-gradient(ellipse at 50% 20%,
        #000 0%, #2a0000 40%, #8a0000 100%);
    border-radius:0 0 50% 50% / 0 0 90% 90%;
    border-top:2px solid #1a0000;
    box-shadow:
      inset 0 6px 12px rgba(180,0,0,.9),
      0 0 15px rgba(180,0,0,.8);
    z-index:2;
  }
  body.theme-horror .z-mouth::before {
    content:''; position:absolute;
    top:0; left:2px; right:2px; height:7px;
    background:repeating-linear-gradient(90deg,
        #f0e0b8 0 3px, #8a7040 3px 4px, transparent 4px 6px);
    clip-path:polygon(
      0 0, 15% 100%, 30% 0, 45% 100%, 60% 0, 75% 100%, 90% 0, 100% 100%, 100% 0);
    filter:drop-shadow(0 1px 2px #000);
  }
  body.theme-horror .z-mouth::after {
    content:''; position:absolute;
    top:100%; left:50%;
    transform:translateX(-50%);
    width:4px; height:22px;
    background:linear-gradient(180deg, #b80a0a, #3a0000, transparent);
    border-radius:0 0 50% 50%;
    filter:blur(.3px);
    box-shadow:0 0 6px rgba(180,0,0,.9);
  }

  body.theme-horror .z-leg {
    position:absolute; top:118px;
    width:20px; height:45px;
    background:linear-gradient(180deg, #4a2818 0%, #2a1008 70%, #0a0200 100%);
    border-radius:4px;
    border:1px solid #000;
    box-shadow:inset -4px 0 8px rgba(0,0,0,.95);
  }
  body.theme-horror .z-leg.l { left:18px; transform:rotate(-8deg); transform-origin:top center; }
  body.theme-horror .z-leg.r { right:18px; transform:rotate(10deg); transform-origin:top center; }

  body.theme-horror .z-shadow {
    position:absolute; bottom:-8px; left:50%;
    transform:translateX(-50%);
    width:90px; height:16px;
    background:radial-gradient(ellipse, rgba(180,0,0,.9) 0%, rgba(0,0,0,.9) 40%, transparent 80%);
    border-radius:50%;
    filter:blur(3px);
  }

  /* ============ FUNNY: МОНСТРЫ ============ */
  body.theme-funny .zombie {
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.5));
    animation:zombieSway 2.4s infinite alternate;
  }
  body.theme-funny .zombie.charging {
    animation:chargeAttack .8s ease-in forwards !important;
    filter:drop-shadow(0 0 30px #ff8844) brightness(1.3);
  }
  body.theme-funny .zombie .z-head {
    position:absolute; top:5px; left:14px;
    width:55px; height:60px;
    background:radial-gradient(circle at 35% 35%, #a8e878 0%, #66b848 55%, #3a8a20 100%);
    border-radius:50% 50% 45% 45%;
    border:1px solid #000;
    box-shadow:inset -4px -4px 8px rgba(0,0,0,.3), inset 4px 4px 6px rgba(255,255,255,.2);
  }
  body.theme-funny .zombie .z-head::before {
    content:''; position:absolute;
    top:-4px; left:8px;
    width:38px; height:16px;
    background:radial-gradient(ellipse, #ff4477 0%, #aa2255 80%, transparent);
    border-radius:50% 50% 0 0;
  }
  body.theme-funny .zombie .z-head::after {
    content:''; position:absolute;
    top:-2px; left:4px; right:4px;
    height:10px;
    background:
      radial-gradient(circle at 20% 50%, #3a5a1a 0 3px, transparent 4px),
      radial-gradient(circle at 45% 30%, #3a5a1a 0 3px, transparent 4px),
      radial-gradient(circle at 70% 55%, #3a5a1a 0 3px, transparent 4px);
    border-radius:50%;
  }
  body.theme-funny .zombie .z-eye {
    position:absolute;
    width:12px; height:12px;

  /* ============ LOTR: УРУК-ХАИ ============ */

    width:16px; height:16px;

  body.theme-lotr .z-head::after {

  body.theme-lotr .z-eye {

      #ffcc00 30%,
      #aa5500 60%,

  body.theme-lotr .z-eye.l { top:22px; left:14px; }

  body.theme-lotr .z-mouth {
    position:absolute; top:38px; left:50%;
    transform:translateX(-50%);
    width:34px; height:16px;
    background:radial-gradient(ellipse at 50% 30%,

  body.theme-lotr .z-mouth::before {
    content:''; position:absolute;
    top:-2px; left:2px;

    background:linear-gradient(180deg, #f0e0b8 0%, #a89050 100%);
    clip-path:polygon(50% 0, 100% 100%, 0 100%);

    box-shadow:
      12px 2px 0 -1px #f0e0b8,

  body.theme-lotr .z-mouth::after {
    content:''; position:absolute;
    bottom:-2px; left:8px;
    width:6px; height:10px;
    background:linear-gradient(180deg, #a89050 0%, #f0e0b8 100%);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    filter:drop-shadow(0 -1px 2px #000);
    box-shadow:
      10px 0 0 -1px #a89050;
  }

  body.theme-lotr .z-leg {
    position:absolute; top:116px;
    width:22px; height:48px;
    background:linear-gradient(180deg, #3a2810 0%, #1a0a00 70%, #050200 100%);
    border-radius:4px;
    border:1px solid #000;

      inset -4px 0 8px rgba(0,0,0,.95),

  body.theme-lotr .z-leg.l { left:16px; transform:rotate(-5deg); transform-origin:top center; }
  body.theme-lotr .z-leg.r { right:16px; transform:rotate(7deg); transform-origin:top center; }

    content:''; position:absolute;
    bottom:-2px; left:-3px; right:-3px;

    background:linear-gradient(180deg, #2a1a08, #0a0500);

    width:85px; height:14px;
    background:radial-gradient(ellipse, rgba(0,0,0,.9) 0%, transparent 80%);
    border-radius:50%;

  /* ============ СМЕРТЬ ВРАГА ============ */
  .zombie.dying { animation:bloodyDeath .6s forwards !important; }
  @keyframes bloodyDeath {
    0%   { transform:scale(1) rotate(0); opacity:1; filter:brightness(1);}
    15%  { transform:scale(1.2) rotate(-8deg); filter:brightness(4) hue-rotate(-40deg) saturate(3);}
    35%  { transform:scale(1.1) rotate(15deg); filter:brightness(3) saturate(4) hue-rotate(-20deg);}
    60%  { transform:scale(.7) rotate(45deg); filter:brightness(2) saturate(3); opacity:.8;}
    100% { transform:scale(0) rotate(180deg); opacity:0; }
  }

  /* ============ ТАБЛИЧКА ============ */
  .sign {
    position:absolute; top:-75px; left:50%;
    transform:translateX(-50%);
    font-size:32px; font-weight:bold;
    padding:10px 18px;
    border-radius:4px;
    white-space:nowrap;
    font-family:'KaiTi','SimSun','Microsoft YaHei',serif;
    letter-spacing:2px;
  }
  body.theme-horror .sign {
    background:linear-gradient(180deg, #a88850 0%, #7a5a20 50%, #4a2808 100%);
    color:#fff8e0;
    border:3px solid #2a1000;
    box-shadow:
      0 0 30px rgba(255,20,0,.7),
      0 6px 12px rgba(0,0,0,.95),
      inset 0 0 20px rgba(0,0,0,.5),
      0 0 60px rgba(180,0,0,.6);
    text-shadow:0 0 12px rgba(255,40,0,.8), 1px 1px 0 #000;
    animation:signFlicker 2.5s infinite;
  }
  @keyframes signFlicker {
    0%, 90%, 100% { opacity:1; }
    92% { opacity:.5; }
    94% { opacity:1; }
    96% { opacity:.6; }
  }
  body.theme-horror .sign::before {
    content:''; position:absolute;
    top:0; left:20%; right:25%; height:100%;
    background:linear-gradient(180deg, rgba(150,0,0,.7) 0%, rgba(100,0,0,.5) 30%, transparent 100%);
    border-radius:0 0 40% 40%;
    pointer-events:none;
    filter:blur(1px);
  }
  body.theme-horror .sign::after {
    content:''; position:absolute;
    bottom:-22px; left:50%;
    transform:translateX(-50%);
    width:6px; height:22px;
    background:linear-gradient(180deg, #4a2808, #1a0800);
    box-shadow:0 0 4px rgba(0,0,0,.9);
  }
  body.theme-funny .sign {
    background:linear-gradient(180deg, #ffffff 0%, #fff8e8 100%);
    color:#8a3a10;
    border:4px solid #ff8844;
    box-shadow:0 6px 12px rgba(0,0,0,.2), inset 0 0 15px rgba(255,180,80,.3);
    text-shadow:0 1px 0 #fff;
  }
  body.theme-funny .sign::after {
    content:''; position:absolute;
    bottom:-20px; left:50%;
    transform:translateX(-50%);
    width:6px; height:20px;
    background:linear-gradient(180deg, #ff8844, #8a3a10);
  }
  body.theme-lotr .sign {
    background:linear-gradient(180deg, #e8d8a8 0%, #c8b878 100%);
    color:#3a2a08;
    border:3px solid #6a4a10;
    box-shadow:
      0 0 15px rgba(200,150,60,.4),
      0 6px 12px rgba(0,0,0,.5),
      inset 0 0 20px rgba(120,80,20,.3);
    text-shadow:1px 1px 0 rgba(255,255,255,.4);
  }
  body.theme-lotr .sign::after {
    content:''; position:absolute;
    bottom:-20px; left:50%;
    transform:translateX(-50%);
    width:5px; height:20px;
    background:linear-gradient(180deg, #6a4a10, #2a1a04);
  }

  .sign.len-2 { font-size:26px; padding:8px 16px; letter-spacing:1px; }
  .sign.len-3 { font-size:21px; padding:7px 14px; letter-spacing:0; }
  .sign.len-4 { font-size:18px; padding:6px 12px; letter-spacing:0; }
  .sign.len-5 { font-size:15px; padding:6px 10px; letter-spacing:0; }

  /* ============ СНАРЯДЫ ============ */
  .laser {
    position:absolute; height:10px;
    background:linear-gradient(90deg,
      rgba(255,20,0,0), #ff3300 15%, #ffaa00 40%, #ffffff 50%, #ffaa00 60%, #ff3300 85%, rgba(255,20,0,0));
    border-radius:5px;
    box-shadow:
      0 0 15px #ff4400, 0 0 30px #ff2200,
      0 0 60px rgba(255,60,0,.9), 0 0 120px rgba(255,40,0,.6);
    z-index:12;
  }
  .arrow {
    position:absolute; height:5px; width:60px;
    background:linear-gradient(90deg, #2a3a1a 0%, #6a8a3a 40%, #a8c86a 100%);
    border-radius:3px;
    box-shadow:0 0 10px rgba(180,220,140,.9), 0 0 20px rgba(120,200,80,.5);
    z-index:10;
    transform-origin:left center;
  }
  .arrow::before {
    content:''; position:absolute; right:-10px; top:-3px;
    width:0; height:0;
    border-left:12px solid #d8e8c0;
    border-top:5px solid transparent;
    border-bottom:5px solid transparent;
    filter:drop-shadow(0 0 3px #a8c86a);
  }
  .arrow::after {
    content:''; position:absolute; left:-6px; top:-3px;
    width:12px; height:10px;
    background:
      radial-gradient(circle at 30% 50%, #c8d8a0 0 2px, transparent 3px),
      radial-gradient(circle at 70% 50%, #8aa860 0 2px, transparent 3px);
    border-radius:2px;
    filter:drop-shadow(0 0 2px #a8c86a);
  }
  .pumpkin-proj {
    position:absolute; width:36px; height:36px; border-radius:50%;
    background:radial-gradient(circle at 40% 40%, #ffb347, #ff7518);
    box-shadow:inset -6px -4px 0 rgba(0,0,0,.2), 0 0 20px #ff7518;
    z-index:10;
    will-change:transform, left, top;
  }
  .pumpkin-proj::before, .pumpkin-proj::after {
    content:''; position:absolute; top:12px;
    width:6px; height:8px; background:#000;
    border-radius:50%;
  }
  .pumpkin-proj::before { left:8px; }
  .pumpkin-proj::after  { right:8px; }
  .pumpkin-proj .pj-mouth {
    position:absolute; top:24px; left:50%;
    transform:translateX(-50%);
    width:16px; height:5px;
    border-bottom:2px solid #000;
    border-radius:0 0 12px 12px;
  }
  .pumpkin-proj .pj-stem {
    position:absolute; top:-4px; left:14px;
    width:8px; height:8px;
    background:#4a6a10;
    border-radius:2px 2px 0 0;
    transform:rotate(-15deg);
  }

  /* ============ ЭФФЕКТЫ ПОПАДАНИЯ ============ */
  /* Общие искры — оставим для всех, но с разным цветом через тему */
  .spark {
    position:absolute; width:5px; height:5px;
    border-radius:50%; z-index:12;
    pointer-events:none;
  }

  /* Хоррор: взрыв (кровавый) */
  .explosion {
    position:absolute; width:80px; height:80px; border-radius:50%;
    background:radial-gradient(circle, #ffffff 0%, #ffff00 15%, #ff8800 35%, #ff0000 55%, #6a0000 75%, transparent 100%);
    z-index:11; animation:explode .55s forwards;
    pointer-events:none; box-shadow:0 0 40px #ff4400;
  }
  @keyframes explode {
    0%   { transform:scale(0) rotate(0); opacity:1; }
    60%  { transform:scale(1.6) rotate(180deg); opacity:.9; }
    100% { transform:scale(2.6) rotate(360deg); opacity:0; }
  }

  /* Funny: облачко тыквы + разлетающиеся мини-тыковки */
  .puff-funny {
    position:absolute; width:70px; height:70px; border-radius:50%;
    background:
      radial-gradient(circle, rgba(255,220,140,.9) 0%, rgba(255,160,60,.7) 30%, rgba(255,120,30,.4) 60%, transparent 85%);
    z-index:11;
    animation:puffExplode .5s ease-out forwards;
    pointer-events:none;
    filter:blur(2px);
  }
  @keyframes puffExplode {
    0%   { transform:scale(.2); opacity:1; }
    60%  { transform:scale(1.5); opacity:.9; }
    100% { transform:scale(2.2); opacity:0; }
  }

  .mini-pumpkin {
    position:absolute; width:20px; height:20px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #ffcc70, #ff7518);
    z-index:12;
    pointer-events:none;
    box-shadow:0 0 10px rgba(255,150,50,.8);
    animation:miniPumpkinFly .7s ease-out forwards;
  }
  .mini-pumpkin::before, .mini-pumpkin::after {
    content:''; position:absolute; top:8px;
    width:3px; height:4px; background:#000;
    border-radius:50%;
  }
  .mini-pumpkin::before { left:5px; }
  .mini-pumpkin::after  { right:5px; }
  @keyframes miniPumpkinFly {
    0%   { transform:scale(.6) rotate(0); opacity:1; }
    100% { transform:scale(1.3) rotate(360deg) translate(var(--dx), var(--dy)); opacity:0; }
  }

  /* LOTR: эльфийская вспышка — серебристо-зелёная */
  .elf-flash {
    position:absolute; width:80px; height:80px; border-radius:50%;
    background:
      radial-gradient(circle, #ffffff 0%, #c8ffa0 20%, #88dd55 45%, #3a8a20 70%, transparent 95%);
    z-index:11;
    animation:elfFlash .5s ease-out forwards;
    pointer-events:none;
    box-shadow:
      0 0 40px #88dd55,
      0 0 80px rgba(140,220,80,.6);
  }
  @keyframes elfFlash {
    0%   { transform:scale(.3); opacity:1; }
    60%  { transform:scale(1.6); opacity:.9; }
    100% { transform:scale(2.4); opacity:0; }
  }

  /* Эльфийский лист — осколок */
  .elf-leaf {
    position:absolute; width:14px; height:8px;
    background:linear-gradient(90deg, #4a8a20 0%, #88dd55 100%);
    border-radius:50% 0 50% 0;
    z-index:12;
    pointer-events:none;
    box-shadow:0 0 8px rgba(140,220,80,.9);
    animation:leafFly .8s ease-out forwards;
  }
  @keyframes leafFly {
    0%   { transform:rotate(0) scale(.7); opacity:1; }
    100% { transform:rotate(720deg) scale(1.1) translate(var(--dx), var(--dy)); opacity:0; }
  }

  /* Эльфийская искра */
  .elf-spark {
    position:absolute; width:5px; height:5px;
    background:radial-gradient(circle, #ffffff, #aaff66);
    border-radius:50%;
    z-index:12;
    pointer-events:none;
    box-shadow:0 0 10px #aaff66, 0 0 20px #88dd55;
    animation:elfSparkFly .7s ease-out forwards;
  }
  @keyframes elfSparkFly {
    0%   { transform:scale(1); opacity:1; }
    100% { transform:scale(0) translate(var(--dx), var(--dy)); opacity:0; }
  }

  /* Кровавые брызги (только хоррор) */
  .blood-splat {
    position:absolute; width:20px; height:20px;

<script>
/* =========================================================
   ЗВУК (без изменений)
   ========================================================= */
const Sound = (() => {
  let ctx = null;
  let muted = false;
  let bgSources = [];
  let bgLoopId = null;
  let heartbeatId = null;
  let breathId = null;

  function ensure() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e) {}
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function playOsc({ freq=440, dur=0.2, type='sine', vol=0.15, slideTo=null,
                    delay=0, attack=0.005, release=0.05 }) {
    if (muted) return;
    const c = ensure(); if (!c) return;
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + release);
    osc.connect(g).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + release + 0.02);
  }

  function playNoise({ dur=0.2, vol=0.15, filterFreq=1000, filterQ=1,
                       filterType='lowpass', delay=0 }) {
    if (muted) return;
    const c = ensure(); if (!c) return;
    const t0 = c.currentTime + delay;
    const bufferSize = Math.floor(c.sampleRate * dur);
    const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource();
    src.buffer = buffer;
    const filter = c.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.value = filterFreq;
    filter.Q.value = filterQ;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter).connect(g).connect(c.destination);
    src.start(t0);
    src.stop(t0 + dur + 0.05);
  }

  function blasterHorror() {
    playOsc({ freq:1800, dur:0.15, type:'sawtooth', vol:0.22, slideTo:120 });
    playOsc({ freq:900, dur:0.2, type:'square', vol:0.15, slideTo:80, delay:0.01 });
    playNoise({ dur:0.12, vol:0.15, filterFreq:5000 });
    playOsc({ freq:60, dur:0.3, type:'sine', vol:0.18, slideTo:30, delay:0.02 });
  }
  function hitHorror() {
    playNoise({ dur:0.4, vol:0.35, filterFreq:800, filterQ:1 });
    playNoise({ dur:0.15, vol:0.25, filterFreq:2500, filterType:'bandpass', filterQ:3 });
    playOsc({ freq:150, dur:0.3, type:'sine', vol:0.28, slideTo:45 });
    playOsc({ freq:320, dur:0.25, type:'sawtooth', vol:0.12, slideTo:60, delay:0.03 });
  }
  function zombieAttackHorror() {
    playOsc({ freq:140, dur:1.2, type:'sawtooth', vol:0.35, slideTo:60 });
    playOsc({ freq:200, dur:1.0, type:'square', vol:0.15, slideTo:80, delay:0.05 });
    playNoise({ dur:0.8, vol:0.28, filterFreq:600, filterType:'lowpass' });
    playOsc({ freq:800, dur:0.15, type:'sine', vol:0.15, slideTo:200, delay:0.02 });
  }
  function zombieSpawnHorror() {
    playOsc({ freq:110, dur:0.6, type:'sawtooth', vol:0.12, slideTo:70 });
    playNoise({ dur:0.5, vol:0.1, filterFreq:400 });
  }
  function whisper() {
    playNoise({ dur:1.5, vol:0.05, filterFreq:1200, filterType:'bandpass', filterQ:0.5 });
  }
  function scream() {
    playOsc({ freq:1500, dur:0.7, type:'sawtooth', vol:0.4, slideTo:2400 });
    playOsc({ freq:1200, dur:0.7, type:'square', vol:0.25, slideTo:2000, delay:0.02 });
    playOsc({ freq:80, dur:0.9, type:'sawtooth', vol:0.4, slideTo:40 });
    playNoise({ dur:0.9, vol:0.35, filterFreq:3000, filterType:'highpass' });
    playNoise({ dur:0.5, vol:0.4, filterFreq:150, delay:0.3 });
    playOsc({ freq:50, dur:0.6, type:'sine', vol:0.4, slideTo:25, delay:0.3 });
  }
  function heartbeat() {
    playOsc({ freq:60, dur:0.1, type:'sine', vol:0.18, slideTo:40 });
    setTimeout(() => {
      if (muted) return;
      playOsc({ freq:55, dur:0.12, type:'sine', vol:0.14, slideTo:35 });
    }, 220);
  }
  function breath() {
    playNoise({ dur:0.5, vol:0.05, filterFreq:600, filterType:'bandpass', filterQ:0.8 });
    setTimeout(() => {
      if (muted) return;
      playNoise({ dur:0.4, vol:0.04, filterFreq:800, filterType:'bandpass', filterQ:0.8 });
    }, 900);
  }
  function thunder() {
    playNoise({ dur:1.8, vol:0.3, filterFreq:400, filterType:'lowpass' });
    playNoise({ dur:0.4, vol:0.4, filterFreq:6000, filterType:'highpass' });
    playOsc({ freq:45, dur:1.5, type:'sine', vol:0.3, slideTo:25, delay:0.1 });
  }

  function pumpkinThrow() {
    playOsc({ freq:280, dur:0.18, type:'triangle', vol:0.18, slideTo:120 });
    playNoise({ dur:0.15, vol:0.08, filterFreq:800 });
  }
  function hitFunny() {
    // Приятный "поп"-звук
    playOsc({ freq:600, dur:0.15, type:'sine', vol:0.18, slideTo:900 });
    playOsc({ freq:900, dur:0.1, type:'triangle', vol:0.12, slideTo:1200, delay:0.05 });
    playNoise({ dur:0.1, vol:0.05, filterFreq:2000, filterType:'highpass' });
  }
  function zombieAttackFunny() {
    playOsc({ freq:300, dur:0.3, type:'triangle', vol:0.15, slideTo:150 });
    playOsc({ freq:180, dur:0.5, type:'sine', vol:0.12, slideTo:90, delay:0.15 });
  }
  function zombieSpawnFunny() {
    playOsc({ freq:440, dur:0.15, type:'sine', vol:0.08, slideTo:330 });
  }

  function arrowShot() {
    playNoise({ dur:0.25, vol:0.15, filterFreq:3000, filterType:'bandpass', filterQ:2 });
    playOsc({ freq:1800, dur:0.18, type:'sine', vol:0.08, slideTo:400 });
  }
  function hitLOTR() {
    // Эльфийский колокольчик + мягкий удар
    playOsc({ freq:900, dur:0.3, type:'sine', vol:0.14, slideTo:1400 });
    playOsc({ freq:1300, dur:0.25, type:'triangle', vol:0.08, slideTo:1800, delay:0.05 });
    playNoise({ dur:0.15, vol:0.08, filterFreq:1500, filterType:'bandpass', filterQ:2 });
  }
  function zombieAttackLOTR() {
    playOsc({ freq:200, dur:0.5, type:'sawtooth', vol:0.22, slideTo:80 });
    playOsc({ freq:140, dur:0.7, type:'triangle', vol:0.18, slideTo:60, delay:0.1 });
    playNoise({ dur:0.5, vol:0.18, filterFreq:500 });
  }
  function zombieSpawnLOTR() {
    playOsc({ freq:180, dur:0.3, type:'triangle', vol:0.08, slideTo:140 });
  }

  function victory() {
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f, i) => {
      playOsc({ freq:f, dur:0.35, type:'triangle', vol:0.18, delay:i * 0.15 });
      playOsc({ freq:f*2, dur:0.3, type:'sine', vol:0.08, delay:i * 0.15 });
    });
  }
  function defeat() {
    playOsc({ freq:180, dur:0.6, type:'sawtooth', vol:0.25, slideTo:60 });
    playOsc({ freq:140, dur:0.8, type:'sawtooth', vol:0.25, slideTo:40, delay:0.5 });
    playOsc({ freq:100, dur:1.5, type:'sawtooth', vol:0.3, slideTo:30, delay:1.2 });
    playNoise({ dur:2.0, vol:0.15, filterFreq:200, delay:1.5 });
  }

  function stopBg() {
    bgSources.forEach(s => { try { s.stop(); } catch(e){} });
    bgSources = [];
    if (bgLoopId) { clearTimeout(bgLoopId); bgLoopId = null; }
    if (heartbeatId) { clearInterval(heartbeatId); heartbeatId = null; }
    if (breathId) { clearInterval(breathId); breathId = null; }
  }

  function drone(freq, vol, type='sine') {
    const c = ensure(); if (!c) return;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.value = vol;
    osc.connect(g).connect(c.destination);
    osc.start();
    bgSources.push(osc);
  }

  function startBg(theme) {
    if (muted) return;
    stopBg();
    const c = ensure(); if (!c) return;

    if (theme === 'horror') {
      drone(40, 0.08, 'sine');
      drone(55, 0.06, 'triangle');
      drone(82, 0.04, 'sine');
      drone(110, 0.03, 'sine');
      const bufferSize = c.sampleRate * 4;
      const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random()*2-1)*0.12;
      const src = c.createBufferSource();
      src.buffer = buffer; src.loop = true;
      const filter = c.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = 200;
      const g = c.createGain(); g.gain.value = 0.2;
      src.connect(filter).connect(g).connect(c.destination);
      src.start();
      bgSources.push(src);

      function scheduleWhisper() {
        if (muted) return;
        whisper();
        bgLoopId = setTimeout(scheduleWhisper, 8000 + Math.random() * 12000);
      }
      scheduleWhisper();
      heartbeat();
      heartbeatId = setInterval(heartbeat, 1400);
      breath();
      breathId = setInterval(breath, 5000);
    } else if (theme === 'funny') {
      const melody = [
        [659.25, 0.15], [784.0, 0.15], [880.0, 0.15], [1046.5, 0.15],
        [880.0, 0.15], [784.0, 0.15], [659.25, 0.3],
        [587.33, 0.15], [659.25, 0.15], [784.0, 0.15], [880.0, 0.3],
        [784.0, 0.15], [659.25, 0.15], [587.33, 0.4]
      ];
      let idx = 0;
      function playNote() {
        if (muted) return;
        const [freq, dur] = melody[idx];
        playOsc({ freq, dur, type:'triangle', vol:0.06 });
        idx = (idx + 1) % melody.length;
        bgLoopId = setTimeout(playNote, dur * 1000 + 80);
      }
      playNote();
      drone(130.8, 0.03, 'sine');
    } else if (theme === 'lotr') {
      drone(98, 0.05, 'sine');
      drone(146.8, 0.035, 'triangle');
      drone(196, 0.03, 'sine');
      const notes = [523.25, 587.33, 659.25, 783.99];
      let i = 0;
      function chime() {
        if (muted) return;
        playOsc({ freq: notes[i % notes.length], dur: 1.2, type:'sine', vol:0.035 });
        i++;
        bgLoopId = setTimeout(chime, 1800);
      }
      chime();
    }
  }

  function setMuted(v) { muted = v; if (v) stopBg(); }
  function isMuted() { return muted; }

  return {
    shoot(theme) {
      if (theme === 'horror') blasterHorror();
      else if (theme === 'funny') pumpkinThrow();
      else arrowShot();
    },
    hit(theme) {
      if (theme === 'horror') hitHorror();
      else if (theme === 'funny') hitFunny();
      else hitLOTR();
    },
    zombieAttack(theme) {
      if (theme === 'horror') zombieAttackHorror();
      else if (theme === 'funny') zombieAttackFunny();
      else zombieAttackLOTR();
    },
    zombieSpawn(theme) {
      if (theme === 'horror') zombieSpawnHorror();
      else if (theme === 'funny') zombieSpawnFunny();
      else zombieSpawnLOTR();
    },
    scream, thunder, victory, defeat,
    startBg, stopBg, setMuted, isMuted
  };
})();

function buildStars() {
  starsEl.innerHTML = '';
  if (theme !== 'horror') return;
  for (let i = 0; i < 100; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 1;

    s.style.height = size + 'px';

    s.style.top  = Math.random() * 55 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    starsEl.appendChild(s);
  }
}

function buildScene() {
  sceneEl.innerHTML = '';
  if (theme === 'horror') return;

  if (theme === 'funny') {
    const rb = document.createElement('div');
    rb.className = 'rainbow';
    sceneEl.appendChild(rb);

    for (let i = 0; i < 5; i++) {
      const c = document.createElement('div');
      c.className = 'cloud';

      const h = 30 + Math.random() * 20;

      c.style.height = h + 'px';
      c.style.left = (Math.random() * 90) + '%';
      c.style.top  = (5 + Math.random() * 30) + '%';
      c.style.animation = `float ${3 + Math.random() * 2}s ease-in-out infinite alternate`;
      sceneEl.appendChild(c);
    }

    const candyColors = ['#ff4466', '#ffaa33', '#44cc44', '#4488ff', '#cc44ff'];
    for (let i = 0; i < 25; i++) {
      const cd = document.createElement('div');
      cd.className = 'candy';
      cd.style.left = (Math.random() * 95) + '%';
      cd.style.bottom = (5 + Math.random() * 70) + 'px';
      cd.style.background = candyColors[Math.floor(Math.random() * candyColors.length)];
      sceneEl.appendChild(cd);
    }

    const balloonColors = ['#ff4466', '#ffaa33', '#44cc44', '#4488ff', '#cc44ff', '#ff88cc'];
    for (let i = 0; i < 6; i++) {
      const b = document.createElement('div');
      b.className = 'balloon';
      b.style.left = (5 + Math.random() * 90) + '%';
      b.style.top = (15 + Math.random() * 30) + '%';
      b.style.background = `radial-gradient(circle at 35% 35%, #fff 0%, ${balloonColors[i]} 60%)`;
      b.style.animationDelay = (Math.random() * 3) + 's';
      sceneEl.appendChild(b);
    }
    return;
  }

  if (theme === 'lotr') {
    const sun = document.createElement('div');
    sun.className = 'sun';
    sceneEl.appendChild(sun);

    for (let i = 0; i < 6; i++) {
      const c = document.createElement('div');
      c.className = 'softcloud';
      const w = 100 + Math.random() * 100;
      const h = 24 + Math.random() * 20;
      c.style.width = w + 'px';
      c.style.height = h + 'px';

      c.style.animation = `float ${5 + Math.random() * 3}s ease-in-out infinite alternate`;
      sceneEl.appendChild(c);
    }

    const mts = [
      { x:'5%',  w:200, h:140, color:'#8aa4b8' },
      { x:'25%', w:260, h:180, color:'#7a94a8' },
      { x:'55%', w:240, h:160, color:'#8aa4b8' },
      { x:'78%', w:220, h:150, color:'#7a94a8' },
    ];
    mts.forEach(m => {
      const t = document.createElement('div');
      t.className = 'mountain';
      t.style.left = m.x;
      t.style.borderLeftWidth  = (m.w/2) + 'px';
      t.style.borderRightWidth = (m.w/2) + 'px';
      t.style.borderBottomWidth = m.h + 'px';
      t.style.borderLeftColor  = 'transparent';
      t.style.borderRightColor = 'transparent';
      t.style.borderBottomColor = m.color;
      t.style.filter = 'drop-shadow(0 4px 8px rgba(0,0,0,.2))';
      sceneEl.appendChild(t);
      const snow = document.createElement('div');
      snow.style.cssText = `
        position:absolute; left:${m.x}; bottom:${80 + m.h - 30}px;
        width:0; height:0;
        border-left:${m.w/6}px solid transparent;
        border-right:${m.w/6}px solid transparent;
        border-bottom:30px solid rgba(255,255,255,.85);
        transform:translateX(${m.w/3}px);

      sceneEl.appendChild(snow);
    });

    for (let i = 0; i < 3; i++) {
      const h = document.createElement('div');
      h.className = 'hill';
      const w = 400 + Math.random() * 300;
      const hh = 60 + Math.random() * 40;

      h.style.opacity = .95;
      sceneEl.appendChild(h);

    const trees = [{ x:'10%' }, { x:'30%' }, { x:'55%' }, { x:'80%' }, { x:'92%' }];

      tr.style.transform = `scale(${0.8 + Math.random() * 0.4})`;
      sceneEl.appendChild(tr);
    });
    return;
  }

  if (WORD_QUEUE.length === 0) return false;
  const word = pickNextWord();
  if (!word) return false;

  const z = document.createElement('div');
  z.className = 'zombie';

  const lenClass = word.length <= 1 ? '' :
                   word.length === 2 ? 'len-2' :
                   word.length === 3 ? 'len-3' :

  z.innerHTML = `

  `;

  const startX = game.clientWidth + 30;

  z.style.bottom = '50px';

  Sound.zombieSpawn(theme);

  zombies.push({
    el: z, word,
    x: startX,
    speed: zombieSpeed * (0.9 + Math.random() * 0.4),
    alive: true
  });
  return true;
}

/* =========================================================
   ВЫСТРЕЛ
   ========================================================= */
function shoot(target) {
  if (!target || !target.alive) return;

  const hp = heroPos();
  const zr = target.el.getBoundingClientRect();
  const gr = game.getBoundingClientRect();
  const signEl = target.el.querySelector('.sign');
  const sr = signEl ? signEl.getBoundingClientRect() : zr;
  const tx = sr.left - gr.left + sr.width / 2;
  const ty = sr.top  - gr.top  + sr.height / 2;

  let sx = hp.x + 30;
  let sy = hp.y + 5;
  if (theme === 'funny')      { sx = hp.x + 30; sy = hp.y + 10; }
  else if (theme === 'lotr')  { sx = hp.x + 25; sy = hp.y - 10; }

  const dx = tx - sx, dy = ty - sy;
  const dist = Math.hypot(dx, dy);
  const angleDeg = Math.atan2(dy, dx) * 180 / Math.PI;

  Sound.shoot(theme);

  if (theme === 'horror') {
    const laser = document.createElement('div');
    laser.className = 'laser';
    laser.style.left = sx + 'px';
    laser.style.top  = (sy - 5) + 'px';
    laser.style.width = '0px';
    laser.style.transformOrigin = '0 50%';
    laser.style.transform = `rotate(${angleDeg}deg)`;
    game.appendChild(laser);

    let w = 0;
    const grow = setInterval(() => {
      w += dist / 5;
      if (w >= dist) { w = dist; clearInterval(grow); }
      laser.style.width = w + 'px';
    }, 15);

    setTimeout(() => {
      laser.style.transition = 'opacity .12s';
      laser.style.opacity = '0';
      setTimeout(() => laser.remove(), 130);
      killEnemy(target);
    }, 150);
    recoil();
    return;
  }

  if (theme === 'funny') {
    const proj = document.createElement('div');
    proj.className = 'pumpkin-proj';
    proj.innerHTML = `<div class="pj-stem"></div><div class="pj-mouth"></div>`;
    proj.style.left = (sx - 18) + 'px';
    proj.style.top  = (sy - 18) + 'px';
    game.appendChild(proj);

    const flightTime = Math.max(180, Math.min(600, dist * 1.1));
    const startT = performance.now();
    function flyPumpkin(now) {
      const t = Math.min(1, (now - startT) / flightTime);
      const cx = sx + (tx - sx) * t;
      const cy = sy + (ty - sy) * t;
      proj.style.left = (cx - 18) + 'px';
      proj.style.top  = (cy - 18) + 'px';
      proj.style.transform = `rotate(${t * 360}deg)`;
      if (t < 1) requestAnimationFrame(flyPumpkin);
      else { proj.remove(); killEnemy(target); }
    }
    requestAnimationFrame(flyPumpkin);
    recoil();
    return;
  }

  const proj = document.createElement('div');
  proj.className = 'arrow';
  proj.style.left = sx + 'px';
  proj.style.top  = (sy - 3) + 'px';
  proj.style.transformOrigin = '0 50%';
  proj.style.transform = `rotate(${angleDeg}deg)`;
  game.appendChild(proj);

  const flightTime = Math.max(180, Math.min(600, dist * 1.1));
  const startT = performance.now();
  const cos = Math.cos(angleDeg * Math.PI / 180);
  const sin = Math.sin(angleDeg * Math.PI / 180);

  function flyArrow(now) {
    const t = Math.min(1, (now - startT) / flightTime);
    const cx = sx + cos * dist * t;
    const cy = sy + sin * dist * t;
    proj.style.left = cx + 'px';
    proj.style.top  = (cy - 3) + 'px';
    if (t < 1) requestAnimationFrame(flyArrow);
    else { proj.remove(); killEnemy(target); }
  }
  requestAnimationFrame(flyArrow);
  recoil();
}

function recoil() {
  const hero = document.getElementById('hero');
  if (!hero) return;
  hero.animate([
    { transform:'translateX(0)' },
    { transform:'translateX(-6px)' },
    { transform:'translateX(0)' }
  ], { duration:150 });
}

/* =========================================================
   УБИЙСТВО — БЕЗ ЗАДЕРЖКИ, МГНОВЕННОЕ УДАЛЕНИЕ
   ========================================================= */
function killEnemy(z) {
  if (!z.alive) return;
  z.alive = false;

  Sound.hit(theme);

  const r = z.el.getBoundingClientRect();
  const gr = game.getBoundingClientRect();
  const cx = r.left - gr.left + r.width / 2;
  const cy = r.top  - gr.top  + r.height / 2;

  // === МГНОВЕННОЕ УДАЛЕНИЕ — зомби не задерживается
  z.el.remove();

  // === Эффекты по теме ===
  if (theme === 'horror') {
    // Кровавый взрыв + брызги + вспышка
    const hf = document.createElement('div');
    hf.className = 'hit-flash';
    hf.style.left = (cx - 20) + 'px';
    hf.style.top  = (cy - 20) + 'px';
    game.appendChild(hf);
    setTimeout(() => hf.remove(), 350);

    const ex = document.createElement('div');
    ex.className = 'explosion';
    ex.style.left = (cx - 40) + 'px';
    ex.style.top  = (cy - 40) + 'px';
    game.appendChild(ex);
    setTimeout(() => ex.remove(), 600);

    for (let i = 0; i < 20; i++) {
      const b = document.createElement('div');
      b.className = 'blood-splat';
      const angle = Math.random() * Math.PI * 2;
      const d = 50 + Math.random() * 120;
      b.style.setProperty('--dx', Math.cos(angle) * d + 'px');
      b.style.setProperty('--dy', Math.sin(angle) * d + 'px');
      b.style.left = cx + 'px';
      b.style.top  = cy + 'px';
      b.style.width  = (6 + Math.random() * 18) + 'px';
      b.style.height = (6 + Math.random() * 18) + 'px';
      b.style.animationDelay = (Math.random() * 0.15) + 's';
      game.appendChild(b);
      setTimeout(() => b.remove(), 1000);
    }
  }
  else if (theme === 'funny') {
    // === Тыквенное облачко + разлетающиеся мини-тыковки ===
    const puff = document.createElement('div');
    puff.className = 'puff-funny';
    puff.style.left = (cx - 35) + 'px';
    puff.style.top  = (cy - 35) + 'px';
    game.appendChild(puff);
    setTimeout(() => puff.remove(), 550);

    // Разлетающиеся мини-тыковки
    for (let i = 0; i < 12; i++) {
      const mp = document.createElement('div');
      mp.className = 'mini-pumpkin';
      const angle = Math.random() * Math.PI * 2;
      const d = 50 + Math.random() * 100;
      mp.style.setProperty('--dx', Math.cos(angle) * d + 'px');
      mp.style.setProperty('--dy', Math.sin(angle) * d + 'px');
      mp.style.left = (cx - 10) + 'px';
      mp.style.top  = (cy - 10) + 'px';
      mp.style.animationDelay = (Math.random() * 0.1) + 's';
      game.appendChild(mp);
      setTimeout(() => mp.remove(), 800);
    }

    // Немного оранжевых искр
    for (let i = 0; i < 8; i++) {
      const sp = document.createElement('div');
      sp.className = 'spark';
      sp.style.background = ['#ffcc00','#ff8844','#ffee88'][Math.floor(Math.random()*3)];
      sp.style.boxShadow = '0 0 10px #ff8844';
      sp.style.left = cx + 'px';
      sp.style.top  = cy + 'px';
      const ang = Math.random() * Math.PI * 2;
      const d = 40 + Math.random() * 60;
      sp.style.transition = 'transform .5s ease-out, opacity .5s';
      game.appendChild(sp);
      requestAnimationFrame(() => {
        sp.style.transform = `translate(${Math.cos(ang)*d}px, ${Math.sin(ang)*d}px) scale(0)`;
        sp.style.opacity = '0';
      });
      setTimeout(() => sp.remove(), 550);
    }
  }
  else {
    // === LOTR: эльфийская вспышка + листья + зелёные искры ===
    const ef = document.createElement('div');
    ef.className = 'elf-flash';
    ef.style.left = (cx - 40) + 'px';
    ef.style.top  = (cy - 40) + 'px';
    game.appendChild(ef);
    setTimeout(() => ef.remove(), 550);

    // Разлетающиеся листья
    for (let i = 0; i < 8; i++) {
      const leaf = document.createElement('div');
      leaf.className = 'elf-leaf';
      const angle = Math.random() * Math.PI * 2;
      const d = 60 + Math.random() * 110;
      leaf.style.setProperty('--dx', Math.cos(angle) * d + 'px');
      leaf.style.setProperty('--dy', Math.sin(angle) * d + 'px');
      leaf.style.left = (cx - 7) + 'px';
      leaf.style.top  = (cy - 4) + 'px';
      leaf.style.animationDelay = (Math.random() * 0.1) + 's';
      game.appendChild(leaf);
      setTimeout(() => leaf.remove(), 850);
    }

    // Светящиеся эльфийские искры
    for (let i = 0; i < 12; i++) {
      const sp = document.createElement('div');
      sp.className = 'elf-spark';
      const angle = Math.random() * Math.PI * 2;
      const d = 40 + Math.random() * 90;
      sp.style.setProperty('--dx', Math.cos(angle) * d + 'px');
      sp.style.setProperty('--dy', Math.sin(angle) * d + 'px');
      sp.style.left = cx + 'px';
      sp.style.top  = cy + 'px';
      sp.style.animationDelay = (Math.random() * 0.1) + 's';
      game.appendChild(sp);
      setTimeout(() => sp.remove(), 800);
    }
  }

  // === Счётчики ===
  score++;
  KILLED++;
  scoreEl.textContent = score;
  updateRemaining();

  if (score % 4 === 0) {
    const d = DIFF[difficulty];
    spawnInterval = Math.max(d.minSpawn, spawnInterval - d.spawnStep);
    zombieSpeed = Math.min(d.minSpeed, zombieSpeed + d.speedStep);
  }

  if (KILLED >= TOTAL_WORDS) {
    setTimeout(winGame, 800);
  }
}

function updateRemaining() {
  const left = TOTAL_WORDS - KILLED;
  waveEl.textContent = Math.max(0, left);
}

/* =========================================================
   АТАКА
   ========================================================= */
function hurtHero() {
  Sound.zombieAttack(theme);

  lives--;
  livesEl.textContent = lives;

  attackFlash.style.transition = 'opacity .05s';
  attackFlash.style.opacity = '1';
  setTimeout(() => {
    attackFlash.style.transition = 'opacity .5s';
    attackFlash.style.opacity = '0';
  }, 100);

  game.animate([
    { transform:'translate(0,0) rotate(0)' },
    { transform:'translate(-20px,15px) rotate(-3deg)' },
    { transform:'translate(18px,-12px) rotate(3deg)' },
    { transform:'translate(-14px,8px) rotate(-2deg)' },
    { transform:'translate(10px,-5px) rotate(1.5deg)' },
    { transform:'translate(-5px,3px) rotate(0)' },
    { transform:'translate(0,0) rotate(0)' }
  ], { duration:650, easing:'ease-out' });

  const hp = heroPos();

  // Брызги по теме
  if (theme === 'horror') {
    for (let i = 0; i < 25; i++) {
      const b = document.createElement('div');
      b.className = 'blood-splat';
      const angle = Math.random() * Math.PI * 2;
      const d = 50 + Math.random() * 120;
      b.style.setProperty('--dx', Math.cos(angle) * d + 'px');
      b.style.setProperty('--dy', Math.sin(angle) * d + 'px');
      b.style.left = hp.x + 'px';
      b.style.top  = hp.y + 'px';
      b.style.width  = (8 + Math.random() * 22) + 'px';
      b.style.height = (8 + Math.random() * 22) + 'px';
      game.appendChild(b);
      setTimeout(() => b.remove(), 1000);
    }
    bloodScreenEffect();
    triggerGlitch();
    if (Math.random() < 0.5) triggerLightning();
  }
  else if (theme === 'funny') {
    // Разлетающиеся тыковки
    for (let i = 0; i < 15; i++) {
      const mp = document.createElement('div');
      mp.className = 'mini-pumpkin';
      const angle = Math.random() * Math.PI * 2;
      const d = 50 + Math.random() * 100;
      mp.style.setProperty('--dx', Math.cos(angle) * d + 'px');
      mp.style.setProperty('--dy', Math.sin(angle) * d + 'px');
      mp.style.left = (hp.x - 10) + 'px';
      mp.style.top  = (hp.y - 10) + 'px';
      game.appendChild(mp);
      setTimeout(() => mp.remove(), 800);
    }
  }
  else {
    // LOTR: зелёные листья
    for (let i = 0; i < 15; i++) {
      const leaf = document.createElement('div');
      leaf.className = 'elf-leaf';
      const angle = Math.random() * Math.PI * 2;
      const d = 50 + Math.random() * 120;
      leaf.style.setProperty('--dx', Math.cos(angle) * d + 'px');
      leaf.style.setProperty('--dy', Math.sin(angle) * d + 'px');
      leaf.style.left = (hp.x - 7) + 'px';
      leaf.style.top  = (hp.y - 4) + 'px';
      game.appendChild(leaf);
      setTimeout(() => leaf.remove(), 850);
    }
  }

  const hero = document.getElementById('hero');
  if (hero) {
    hero.classList.remove('hurt');
    void hero.offsetWidth;
    hero.classList.add('hurt');
    setTimeout(() => hero.classList.remove('hurt'), 700);
  }

  if (lives <= 0) {
    setTimeout(() => gameOver(), 900);
  }
}

/* =========================================================
   ИГРОВОЙ ЦИКЛ
   ========================================================= */
function fireAtClosest() {
  if (!running || zombies.length === 0) return;
  let target = null, minX = Infinity;
  for (const z of zombies) if (z.alive && z.x < minX) { minX = z.x; target = z; }
  if (target) shoot(target);
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (running) fireAtClosest();
  }
});

function loop(t) {
  if (!running) return;
  if (!lastTime) lastTime = t;
  const dt = Math.min(50, t - lastTime);
  lastTime = t;

  if (WORD_QUEUE.length > 0) {
    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnEnemy();
    }
  }

  for (const z of zombies) {
    if (!z.alive) continue;
    z.x -= z.speed * dt * 0.06 * 60 / 16;
    z.el.style.left = z.x + 'px';
    if (z.x < 130) {
      z.alive = false;
      z.el.classList.add('charging');
      const ze = z.el;
      setTimeout(() => ze.remove(), 800);
      hurtHero();
      WORD_QUEUE.push(z.word);
    }
  }
  zombies = zombies.filter(z => z.alive);
  rafId = requestAnimationFrame(loop);
}

/* =========================================================
   СТАРТ / ФИНАЛ
   ========================================================= */
function startGame() {
  const raw = wordInput.value
    .split('\n')
    .map(l => l.trim())
    .filter(l => l.length > 0);

  if (raw.length === 0) {
    alert('请至少输入一个汉字或词语！');
    return;
  }

  const unique = [...new Set(raw)];
  WORD_QUEUE = [...unique].sort(() => Math.random() - 0.5);
  TOTAL_WORDS = unique.length;
  KILLED = 0;

  document.querySelectorAll('.zombie').forEach(z => z.remove());
  zombies = [];

  renderHero();

  const d = DIFF[difficulty];
  zombieSpeed = d.startSpeed;
  spawnInterval = d.spawn;

  score = 0; lives = 3;
  spawnTimer = 0; lastTime = 0;
  scoreEl.textContent = '0';
  livesEl.textContent = '3';
  updateRemaining();

  setupScr.classList.add('hidden');
  loseScr.classList.add('hidden');
  winScr.classList.add('hidden');

  Sound.startBg(theme);

  const intro = document.createElement('div');
  intro.className = 'intro-banner';
  intro.textContent = theme === 'horror' ? '准备受死' :
                      theme === 'funny'  ? '奶奶出击！' :
                                            '为了中土！';
  game.appendChild(intro);
  setTimeout(() => intro.remove(), 2500);

  running = true;
  setTimeout(() => {
    if (running) spawnEnemy();
  }, 600);

  if (theme === 'horror') {
    setTimeout(() => {
      if (running) {
        triggerScreamer();
        scheduleScreamer();
        scheduleLightning();
      }
    }, 7000);
  }

  rafId = requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  Sound.stopBg();
  Sound.defeat();

  finalScr.textContent = score;
  loseScr.classList.remove('hidden');
  document.querySelectorAll('.zombie').forEach(z => z.remove());
  zombies = [];
}

function winGame() {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  Sound.stopBg();
  Sound.victory();

  const colors = ['#ff4466', '#ffaa33', '#44cc44', '#4488ff', '#cc44ff', '#ffd84a'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = (Math.random() * 100) + '%';
    c.style.top = '-20px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (2 + Math.random() * 3) + 's';
    c.style.animationDelay = (Math.random() * 1.5) + 's';
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    game.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }

  winTotal.textContent = TOTAL_WORDS;
  winLives.textContent = lives;
  winScr.classList.remove('hidden');
  document.querySelectorAll('.zombie').forEach(z => z.remove());
  zombies = [];
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', () => {
  loseScr.classList.add('hidden');
  setupScr.classList.remove('hidden');
  running = false;
  Sound.stopBg();
  if (rafId) cancelAnimationFrame(rafId);
});
winRestartBtn.addEventListener('click', () => {
  winScr.classList.add('hidden');
  setupScr.classList.remove('hidden');
  running = false;
  Sound.stopBg();
  if (rafId) cancelAnimationFrame(rafId);
});

muteBtn.addEventListener('click', () => {
  const m = !Sound.isMuted();
  Sound.setMuted(m);
  muteBtn.textContent = m ? '🔇 声音: 关' : '🔊 声音: 开';
  if (!m && running) Sound.startBg(theme);
});
</script>
