<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>🎃 僵尸来袭 🧟</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body {
    background:#000;
    font-family:'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif;
    overflow:hidden; color:#fff;
    height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  #game {
    position:relative;
    width:1100px; height:640px;
    border:2px solid #3a1a1a; border-radius:6px;
    overflow:hidden;
    transition:background .5s;
  }

  /* ============ ФОНЫ ============ */
  body.theme-funny #game {
    background:linear-gradient(180deg, #87ceeb 0%, #b0e0e6 40%, #ffd9a8 80%, #d9c890 100%);
    box-shadow:0 0 60px rgba(255,200,100,.5), inset 0 0 120px rgba(255,220,150,.3);
  }
  body.theme-lotr #game {
    background:linear-gradient(180deg,
      #7cb4d8 0%, #a8d4e8 25%, #d8e8c8 50%, #8ab86a 78%, #5a8a3a 100%);
    box-shadow:0 0 60px rgba(120,180,80,.5), inset 0 0 120px rgba(200,230,180,.2);
  }
  /* РЕАЛИСТИЧНЫЙ (Леон) */
  body.theme-realistic #game {
    background:
      linear-gradient(180deg,
        #0a0d14 0%,
        #141820 30%,
        #1a1e26 55%,
        #0a0d10 80%,
        #050608 100%);
    box-shadow:0 0 100px rgba(60,80,120,.4), inset 0 0 250px rgba(0,0,0,1);
  }

  /* ============ СЛОИ ============ */
  #stars, #moon, #ground, #fog, #scene, #bloodfog, #bloodDrops,
  #vignette, #glitch, #flashLightning { position:absolute; inset:0; pointer-events:none; }

  #stars { z-index:1; }
  .star { position:absolute; background:#fff; border-radius:50%; opacity:.5; animation:twinkle 3s infinite; }
  @keyframes twinkle { 0%,100%{opacity:.15} 50%{opacity:.9} }

  #moon { z-index:2; }
  /* Обычная белая луна для реалистичного */
  body.theme-realistic #moon::after {
    content:'';
    position:absolute; top:35px; right:80px;
    width:80px; height:80px; border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #f8f8f0 0%, #c8c8b8 60%, #8a8a78 100%);
    box-shadow:
      0 0 50px rgba(220,220,200,.7),
      0 0 100px rgba(180,180,150,.5),
      0 0 180px rgba(120,120,100,.3);
  }

  #flashLightning {
    z-index:14; opacity:0;
    background:radial-gradient(ellipse at 70% 20%, rgba(255,255,255,1), rgba(200,200,255,.6) 30%, transparent 70%);
    display:none;
  }
  body.theme-realistic #flashLightning { display:block; }

  #bloodfog {
    left:0; right:0; bottom:0; top:auto; height:220px;
    background:linear-gradient(0deg, rgba(150,10,10,.9) 0%, rgba(90,5,5,.6) 40%, transparent 100%);
    z-index:3; opacity:0; pointer-events:none;
    animation:fogPulse 5s infinite alternate;
    transition:opacity .6s;
  }
  /* Реалистичный: холодный сине-серый туман */
  body.theme-realistic #bloodfog {
    background:linear-gradient(0deg, rgba(40,50,70,.8) 0%, rgba(30,35,45,.5) 40%, transparent 100%);
    opacity:1;
    animation:fogPulse 6s infinite alternate;
  }
  @keyframes fogPulse { 0% { opacity:.7; transform:translateY(0); } 100% { opacity:1; transform:translateY(-8px); } }

  #ground {
    top:auto; bottom:0; left:0; right:0; height:100px; z-index:4;
    transition:background .5s;
  }
  body.theme-funny #ground {
    background:radial-gradient(ellipse at 20% 0%, #a8d878 0%, #78b048 40%, #4a7a28 100%);
    border-top:3px dashed rgba(255,255,255,.4);
  }
  body.theme-lotr #ground {
    background:radial-gradient(ellipse at 30% 0%, #9ac87a 0%, #6a9a4a 40%, #3a6a2a 100%);
    border-top:2px solid rgba(80,120,60,.5);
  }
  /* РЕАЛИСТИЧНОЕ: мокрый асфальт */
  body.theme-realistic #ground {
    background:
      linear-gradient(180deg,
        rgba(30,30,40,.9) 0%,
        rgba(15,15,20,.95) 40%,
        #050505 100%);
    border-top:1px solid rgba(80,90,110,.4);
  }
  body.theme-realistic #ground::before {
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 20% 60%, rgba(100,120,160,.15) 20px, transparent 40px),
      radial-gradient(ellipse at 55% 40%, rgba(80,100,140,.12) 30px, transparent 50px),
      radial-gradient(ellipse at 85% 70%, rgba(120,140,180,.1) 25px, transparent 45px),
      repeating-linear-gradient(90deg, transparent 0 40px, rgba(60,70,90,.15) 40px 42px);
    filter:blur(1px);
  }
  /* Мокрые отражения */
  body.theme-realistic #ground::after {
    content:''; position:absolute; top:0; left:0; right:0; height:40px;
    background:linear-gradient(180deg, rgba(120,140,180,.08) 0%, transparent 100%);
    pointer-events:none;
  }

  #fog {
    z-index:3; opacity:0; transition:opacity .6s;
  }
  body.theme-realistic #fog {
    opacity:.9;
    background:
      radial-gradient(circle at 15% 75%, rgba(40,50,70,.4), transparent 50%),
      radial-gradient(circle at 85% 65%, rgba(30,40,60,.4), transparent 50%),
      radial-gradient(circle at 50% 85%, rgba(20,25,40,.5), transparent 60%);
    animation:fogMove 15s infinite alternate;
  }
  @keyframes fogMove {
    0% { transform:translateX(0) scale(1); }
    100% { transform:translateX(-60px) scale(1.1); }
  }

  /* Дождь для реалистичного режима */
  #rain {
    position:absolute; inset:0;
    z-index:5; pointer-events:none;
    overflow:hidden;
    display:none;
  }
  body.theme-realistic #rain { display:block; }
  .raindrop {
    position:absolute;
    width:1px;
    background:linear-gradient(180deg, transparent 0%, rgba(180,200,220,.6) 50%, rgba(180,200,220,.9) 100%);
    animation:rainFall linear infinite;
  }
  @keyframes rainFall {
    0%   { transform:translateY(-100px) translateX(0); }
    100% { transform:translateY(700px) translateX(-30px); }
  }

  /* Молнии для реалистичного */
  body.theme-realistic #flashLightning {
    background:radial-gradient(ellipse at 60% 15%, rgba(255,255,255,1), rgba(180,200,255,.6) 40%, transparent 75%);
  }

  #bloodDrops {
    z-index:6; overflow:hidden; display:none;
  }
  body.theme-realistic #bloodDrops { display:block; }
  .blood-drop {
    position:absolute; top:-30px; width:4px;
    background:linear-gradient(180deg, #cc0000, #5a0000);
    border-radius:50% 50% 40% 40%;
    filter:blur(.5px);
    animation:dropFall linear forwards;
  }
  .blood-drop::after {
    content:''; position:absolute; bottom:-3px; left:50%;
    transform:translateX(-50%); width:10px; height:10px;
    background:radial-gradient(circle, #8a0000 0%, transparent 70%);
    border-radius:50%;
  }
  @keyframes dropFall {
    0%   { transform:translateY(0); opacity:0; }
    10%  { opacity:1; }
    100% { transform:translateY(700px); opacity:.6; }
  }

  #vignette { z-index:15; transition:background .5s; }
  body.theme-realistic #vignette {
    background:radial-gradient(ellipse at 50% 55%,
      transparent 20%, rgba(0,0,0,.4) 50%, rgba(0,0,0,.92) 90%);
  }

  .shadow-runner {
    position:absolute; width:60px; height:180px;
    background:radial-gradient(ellipse at 50% 50%, #000 0%, transparent 70%);
    opacity:.9; z-index:5; filter:blur(4px);
    pointer-events:none;
  }

  #scene { z-index:2; overflow:hidden; }

  /* FUNNY */
  .rainbow {
    position:absolute; top:-60px; left:50%; transform:translateX(-50%);
    width:600px; height:300px; border-radius:50% 50% 0 0 / 100% 100% 0 0;
    background:conic-gradient(from 200deg at 50% 100%,
      #ff5555 0 20deg, #ffaa33 20deg 40deg, #ffee44 40deg 60deg,
      #66dd66 60deg 80deg, #44aaff 80deg 100deg, #aa66ff 100deg 120deg,
      #ff5555 120deg 140deg);
    opacity:.35; filter:blur(2px);
  }
  .cloud {
    position:absolute; background:#ffffff; border-radius:50%;
    opacity:.85; filter:blur(.5px);
  }
  .candy {
    position:absolute; width:14px; height:14px; border-radius:50%; opacity:.9;
  }
  .candy::after {
    content:''; position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%); width:60%; height:60%;
    border-radius:50%; background:rgba(255,255,255,.7);
  }
  .balloon {
    position:absolute; width:24px; height:30px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity:.9; animation:float 4s ease-in-out infinite alternate;
  }
  .balloon::after {
    content:''; position:absolute; top:100%; left:50%;
    width:1px; height:24px; background:rgba(0,0,0,.3);
    transform:translateX(-50%);
  }
  @keyframes float {
    0% { transform:translateY(0) rotate(-3deg); }
    100% { transform:translateY(-10px) rotate(3deg); }
  }

  /* LOTR */
  .mountain { position:absolute; bottom:80px; width:0; height:0; border-style:solid; }
  .hill { position:absolute; bottom:60px; border-radius:50% 50% 0 0 / 100% 100% 0 0; }
  .sun {
    position:absolute; top:50px; right:120px;
    width:70px; height:70px; border-radius:50%;
    background:radial-gradient(circle, #fff8c0 0%, #ffe060 50%, #ffb020 100%);
    box-shadow:0 0 60px rgba(255,220,120,.9), 0 0 120px rgba(255,180,60,.5);
  }
  .softcloud {
    position:absolute; background:#ffffff; border-radius:50%;
    opacity:.75; filter:blur(1px);
  }
  .lotr-tree {
    position:absolute; bottom:80px; width:8px; height:80px;
    background:linear-gradient(180deg, #6a4a20, #3a2a08);
    border-radius:3px;
  }
  .lotr-tree::before {
    content:''; position:absolute; top:-40px; left:50%;
    transform:translateX(-50%); width:70px; height:60px;
    border-radius:50% 50% 40% 40%;
    background:radial-gradient(circle at 40% 40%, #6a9a3a 0%, #3a6a20 70%, #1a3a08 100%);
    box-shadow:-20px 10px 0 -10px #4a7a28, 20px 10px 0 -10px #4a7a28;
  }

  /* ============ HUD ============ */
  #hud {
    position:absolute; top:14px; left:14px;
    display:flex; gap:14px; font-size:15px; z-index:20;
    font-family:'Courier New', monospace; letter-spacing:1px;
  }
  #hud div {
    background:rgba(20,0,0,.9);
    padding:7px 14px; border-radius:4px;
    border:1px solid #8a0000;
    box-shadow:0 0 15px rgba(255,0,0,.6), inset 0 0 10px rgba(80,0,0,.5);
    text-shadow:0 0 10px rgba(255,20,20,.9);
    color:#ffaaaa;
    transition:all .4s;
  }
  body.theme-funny #hud div {
    background:rgba(255,255,255,.9); color:#6a3a00;
    border:2px solid #ff8844;
    box-shadow:0 4px 12px rgba(0,0,0,.2); text-shadow:none;
  }
  body.theme-lotr #hud div {
    background:rgba(30,50,20,.85); color:#e8f0c8;
    border:1px solid #8ab86a;
    box-shadow:0 0 15px rgba(120,180,80,.5);
    text-shadow:0 0 8px rgba(180,220,140,.6);
  }
  body.theme-realistic #hud div {
    background:rgba(10,15,25,.9);
    color:#c8d8e8;
    border:1px solid #5a7a9a;
    box-shadow:0 0 15px rgba(80,140,200,.5), inset 0 0 10px rgba(20,40,60,.5);
    text-shadow:0 0 8px rgba(150,200,255,.7);
    font-family:'Courier New', monospace;
  }
  #hud .accent { color:#ff2222; text-shadow:0 0 15px #ff0000; font-weight:bold; }
  body.theme-funny #hud .accent { color:#d95400; text-shadow:none; }
  body.theme-lotr #hud .accent { color:#d8e88a; text-shadow:0 0 8px rgba(180,220,140,.6); }
  body.theme-realistic #hud .accent { color:#88c8ff; text-shadow:0 0 12px #4488dd; }

  /* ============ ВРАГИ ============ */
  .zombie {
    position:absolute; width:85px; height:160px; z-index:8;
    transition:filter .15s;
  }

  /* ============ FUNNY МОНСТРЫ ============ */
  body.theme-funny .zombie {
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.5));
    animation:zombieSway 2.4s infinite alternate;
  }
  @keyframes zombieSway {
    0% { transform:rotate(-3deg) translateY(0);}
    100% { transform:rotate(3deg) translateY(-3px);}
  }
  body.theme-funny .zombie.charging {
    animation:chargeAttack .8s ease-in forwards !important;
    filter:drop-shadow(0 0 30px #ff8844) brightness(1.3);
  }
  body.theme-realistic .zombie.charging {
    animation:chargeAttackReal .8s ease-in forwards !important;
    filter:drop-shadow(0 0 30px #cc0000) brightness(1.4);
  }
  @keyframes chargeAttack {
    0% { transform:translateX(0) scale(1) rotate(0); }
    40% { transform:translateX(-90px) scale(1.4) rotate(-12deg); }
    100% { transform:translateX(-170px) scale(0.3) rotate(-45deg); opacity:.1; }
  }
  @keyframes chargeAttackReal {
    0% { transform:translateX(0) scale(1) rotate(0); }
    100% { transform:translateX(-140px) scale(0.2) rotate(-25deg); opacity:0; }
  }

  body.theme-funny .zombie .z-head {
    position:absolute; top:5px; left:14px;
    width:55px; height:60px;
    background:radial-gradient(circle at 35% 35%, #a8e878 0%, #66b848 55%, #3a8a20 100%);
    border-radius:50% 50% 45% 45%;
    border:1px solid #000;
    box-shadow:inset -4px -4px 8px rgba(0,0,0,.3), inset 4px 4px 6px rgba(255,255,255,.2);
  }
  body.theme-funny .zombie .z-head::before {
    content:''; position:absolute;
    top:-4px; left:8px; width:38px; height:16px;
    background:radial-gradient(ellipse, #ff4477 0%, #aa2255 80%, transparent);
    border-radius:50% 50% 0 0;
  }
  body.theme-funny .zombie .z-head::after {
    content:''; position:absolute;
    top:-2px; left:4px; right:4px; height:10px;
    background:
      radial-gradient(circle at 20% 50%, #3a5a1a 0 3px, transparent 4px),
      radial-gradient(circle at 45% 30%, #3a5a1a 0 3px, transparent 4px),
      radial-gradient(circle at 70% 55%, #3a5a1a 0 3px, transparent 4px);
    border-radius:50%;
  }
  body.theme-funny .zombie .z-eye {
    position:absolute;
    width:12px; height:12px;
    background:radial-gradient(circle, #fff 0%, #ffdd00 50%, #aa6600 100%);
    border-radius:50%;
    box-shadow:0 0 10px #ffdd00, 0 0 20px #ffaa00;
  }
  body.theme-funny .zombie .z-eye.l { top:22px; left:10px; }
  body.theme-funny .zombie .z-eye.r { top:22px; right:8px; }
  body.theme-funny .zombie .z-mouth {
    position:absolute; top:42px; left:50%;
    transform:translateX(-50%);
    width:26px; height:14px;
    background:radial-gradient(ellipse at 50% 40%, #3a0000 0%, #6a0000 100%);
    border-radius:0 0 50% 50% / 0 0 90% 90%;
  }
  body.theme-funny .zombie .z-torso {
    position:absolute; top:55px; left:15px;
    width:55px; height:70px;
    background:radial-gradient(circle at 30% 30%, #d87040 0%, #a84820 40%, #6a2808 100%);
    border-radius:8px 8px 5px 5px;
    border:1px solid #000;
    box-shadow:inset 0 0 10px rgba(0,0,0,.4), inset 6px 8px 6px rgba(180,60,0,.4);
  }
  body.theme-funny .zombie .z-torso::before {
    content:''; position:absolute;
    top:15px; left:12px; width:30px; height:24px;
    background:radial-gradient(ellipse, #ff2266 0%, #aa0044 70%, transparent 100%);
    border-radius:50%;
    filter:blur(.5px);
  }
  body.theme-funny .zombie .z-arm {
    position:absolute; top:60px; width:44px; height:12px;
    background:linear-gradient(180deg, #d87040, #a84820);
    border-radius:6px; border:1px solid #000;
    box-shadow:inset -4px 0 6px rgba(0,0,0,.4);
  }
  body.theme-funny .zombie .z-arm.l { left:-32px; transform:rotate(-8deg); transform-origin:right center; }
  body.theme-funny .zombie .z-arm.r { right:-32px; transform:rotate(8deg); transform-origin:left center; }
  body.theme-funny .zombie .z-arm::after {
    content:''; position:absolute; top:50%;
    transform:translateY(-50%);
    width:12px; height:12px;
    background:radial-gradient(circle at 40% 40%, #ffdd88, #aa6600 60%, #4a2800 100%);
    border-radius:50%;
  }
  body.theme-funny .zombie .z-arm.l::after { left:-4px; }
  body.theme-funny .zombie .z-arm.r::after { right:-4px; }
  body.theme-funny .zombie .z-leg {
    position:absolute; top:118px;
    width:20px; height:45px;
    background:linear-gradient(180deg, #a84820, #6a2808);
    border-radius:4px; border:1px solid #000;
  }
  body.theme-funny .zombie .z-leg.l { left:18px; }
  body.theme-funny .zombie .z-leg.r { right:18px; }
  body.theme-funny .zombie .z-shadow {
    position:absolute; bottom:-6px; left:50%;
    transform:translateX(-50%);
    width:70px; height:12px;
    background:radial-gradient(ellipse, rgba(0,0,0,.6), transparent 75%);
    border-radius:50%;
  }

  /* ============ LOTR: УРУК-ХАИ ============ */
  body.theme-lotr .zombie {
    filter:
      drop-shadow(0 12px 20px rgba(0,0,0,.9))
      drop-shadow(0 0 10px rgba(40,20,0,.6))
      saturate(1.2);
    animation:zombieSway 2.6s infinite alternate;
  }
  body.theme-lotr .zombie.charging {
    animation:chargeAttack .8s ease-in forwards !important;
    filter:drop-shadow(0 0 40px #ffaa00) brightness(1.5) saturate(2);
  }
  body.theme-lotr .z-torso {
    position:absolute; top:55px; left:12px;
    width:60px; height:68px;
    background:
      radial-gradient(ellipse at 40% 30%, #5a4020 0%, #2a1a08 50%, #0a0500 100%),
      linear-gradient(180deg, #4a3010 0%, #1a0a00 100%);
    border-radius:6px 6px 4px 4px;
    border:2px solid #1a0e04;
    box-shadow:
      inset 0 0 20px rgba(0,0,0,1),
      inset 6px 8px 10px rgba(120,80,20,.4),
      inset -6px -6px 12px rgba(0,0,0,.95);
    overflow:hidden;
  }
  body.theme-lotr .z-torso::before {
    content:''; position:absolute;
    top:8px; left:4px; right:4px; height:50px;
    background:
      repeating-linear-gradient(0deg,
        rgba(120,120,120,.35) 0 2px, transparent 2px 6px),
      linear-gradient(180deg, rgba(80,80,80,.4) 0%, transparent 100%);
    border-radius:3px;
    box-shadow:inset 0 0 8px rgba(0,0,0,.9);
  }
  body.theme-lotr .z-torso::after {
    content:''; position:absolute;
    top:-6px; left:8px; width:0; height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-bottom:12px solid #3a3a3a;
    filter:drop-shadow(0 0 2px rgba(0,0,0,.9));
    box-shadow:22px 2px 0 -2px #3a3a3a;
  }
  body.theme-lotr .z-arm {
    position:absolute; top:60px; width:52px; height:14px;
    background:linear-gradient(180deg, #5a4a2a 0%, #3a2010 40%, #0a0500 100%);
    border-radius:6px; border:1px solid #000;
    box-shadow:inset -4px 0 8px rgba(0,0,0,.9);
  }
  body.theme-lotr .z-arm.l { left:-38px; transform:rotate(-12deg); transform-origin:right center; }
  body.theme-lotr .z-arm.r { right:-40px; transform:rotate(15deg); transform-origin:left center; }
  body.theme-lotr .z-arm::after {
    content:''; position:absolute; top:50%;
    transform:translateY(-50%);
    width:16px; height:16px;
    background:radial-gradient(circle at 35% 35%, #6a5a3a 0%, #3a2010 60%, #0a0500 100%);
    border-radius:50%;
    box-shadow:inset -3px -3px 6px rgba(0,0,0,.9);
  }
  body.theme-lotr .z-arm.l::after { left:-8px; }
  body.theme-lotr .z-arm.r::after { right:-8px; }
  body.theme-lotr .z-arm.r::before {
    content:''; position:absolute;
    right:-30px; top:-40px;
    width:6px; height:52px;
    background:linear-gradient(180deg, #b8b8b8 0%, #8a8a8a 40%, #4a4a4a 60%, #2a2a2a 100%);
    transform:rotate(20deg);
    border-radius:2px;
    box-shadow:0 0 8px rgba(180,180,180,.6), inset -1px 0 2px rgba(0,0,0,.7);
  }
  body.theme-lotr .z-head {
    position:absolute; top:2px; left:10px;
    width:64px; height:58px;
    background:radial-gradient(ellipse at 40% 45%,
        #7a7a5a 0%, #4a4a28 35%, #2a2a10 70%, #0a0a02 100%);
    border-radius:45% 55% 42% 58% / 50% 50% 45% 55%;
    border:1px solid #000;
    box-shadow:
      inset -8px -6px 14px rgba(0,0,0,.95),
      inset 8px 6px 10px rgba(120,140,60,.2),
      0 0 15px rgba(80,100,0,.5);
    animation:headTwitch 3.5s infinite;
    transform:rotate(-3deg);
  }
  @keyframes headTwitch {
    0%, 88%, 100% { transform:rotate(-3deg); }
    90% { transform:rotate(2deg); }
    92% { transform:rotate(-6deg); }
    94% { transform:rotate(0deg); }
  }
  body.theme-lotr .z-head::before {
    content:''; position:absolute;
    top:16px; left:6px; width:50px; height:3px;
    background:linear-gradient(90deg,
      transparent 0%, #8a0000 20%, #4a0000 50%, #8a0000 80%, transparent 100%);
    transform:rotate(-15deg);
    filter:blur(.5px);
    box-shadow:0 0 6px rgba(120,0,0,.7);
  }

  body.theme-lotr .z-mouth {

  body.theme-lotr .z-mouth::before {

  body.theme-lotr .z-leg {

  body.theme-lotr .z-leg.l { left:16px; transform:rotate(-5deg); transform-origin:top center; }
  body.theme-lotr .z-leg.r { right:16px; transform:rotate(7deg); transform-origin:top center; }
  body.theme-lotr .z-leg::after {
    content:''; position:absolute;

  /* =========================================================
     РЕАЛИСТИЧНЫЙ ЗОМБИ — максимально похож на человека
     ========================================================= */
  body.theme-realistic .zombie {
    filter:
      drop-shadow(0 15px 25px rgba(0,0,0,.95))
      drop-shadow(0 0 12px rgba(60,20,20,.5))
      contrast(1.1) saturate(.85);
    animation:zombieShamble 3s infinite alternate;
  }
  @keyframes zombieShamble {
    0% { transform:rotate(-2deg) translateY(0); }
    100% { transform:rotate(3deg) translateY(-2px); }
  }

  /* Голова — реалистичная: гниющая кожа, раны, впадины */
  body.theme-realistic .z-head {
    position:absolute; top:6px; left:16px;
    width:50px; height:56px;
    background:
      radial-gradient(ellipse at 40% 35%,
        #8a7a62 0%,
        #6a5a42 20%,
        #4a3a28 50%,
        #2a1e10 80%,
        #0a0500 100%),
      radial-gradient(circle at 30% 60%, rgba(90,20,20,.4) 5px, transparent 8px),
      radial-gradient(circle at 70% 40%, rgba(60,15,15,.4) 4px, transparent 7px);
    border-radius:48% 52% 50% 50% / 52% 52% 48% 48%;
    box-shadow:
      inset -8px -6px 14px rgba(0,0,0,.9),
      inset 6px 5px 10px rgba(180,160,120,.15),
      inset 0 -8px 12px rgba(60,20,20,.6),
      0 4px 8px rgba(0,0,0,.7);
    animation:realHeadTwitch 4s infinite;
  }
  @keyframes realHeadTwitch {
    0%, 92%, 100% { transform:rotate(0); }
    94% { transform:rotate(5deg); }
    96% { transform:rotate(-4deg); }
  }
  /* Рваная рана на голове — видно мясо */
  body.theme-realistic .z-head::before {
    content:''; position:absolute;
    top:4px; right:2px;
    width:26px; height:16px;
    background:
      radial-gradient(ellipse at 40% 50%,
        #5a0808 0%,
        #8a1010 25%,
        #3a0505 60%,
        transparent 90%);
    border-radius:50%;
    transform:rotate(-25deg);
    box-shadow:
      inset 0 0 6px rgba(0,0,0,.9),
      0 0 8px rgba(60,0,0,.7);
    filter:blur(.5px);
  }
  /* Волосы — грязные, свалявшиеся клочья */
  body.theme-realistic .z-head::after {
    content:''; position:absolute;
    top:-6px; left:2px; right:2px; height:18px;
    background:
      radial-gradient(ellipse at 20% 80%, #1a1008 0 5px, transparent 6px),
      radial-gradient(ellipse at 40% 60%, #2a1a08 0 6px, transparent 7px),
      radial-gradient(ellipse at 60% 80%, #1a1008 0 5px, transparent 6px),
      radial-gradient(ellipse at 80% 55%, #2a1a08 0 6px, transparent 7px),
      radial-gradient(ellipse at 50% 40%, #1a1008 0 4px, transparent 5px);
    border-radius:50% 50% 30% 30%;
    filter:blur(.5px);
    opacity:.95;
  }

  /* Глаза — мутные, впалые, с красными прожилками */
  body.theme-realistic .z-eye {
    position:absolute;
    width:12px; height:12px;
    background:
      radial-gradient(circle at 50% 50%,
        #ffffff 0%,
        #d8d8c8 25%,
        #8a2020 45%,
        #5a0808 65%,
        #1a0000 100%);
    border-radius:50%;
    box-shadow:
      0 0 6px rgba(120,20,20,.6),
      inset 0 -2px 4px rgba(0,0,0,.8),
      inset 2px 2px 2px rgba(255,255,255,.1);
    z-index:2;
    border:1px solid #1a0a05;
    animation:realEyeTwitch 5s infinite;
  }
  @keyframes realEyeTwitch {
    0%, 90%, 100% { transform:scale(1); }
    92% { transform:scale(1.15); }
    94% { transform:scale(.95); }
  }
  body.theme-realistic .z-eye.l { top:20px; left:10px; }
  body.theme-realistic .z-eye.r { top:18px; right:8px; }
  /* Красные прожилки */
  body.theme-realistic .z-eye::before {
    content:''; position:absolute; inset:1px;
    background:
      radial-gradient(circle at 30% 30%, rgba(180,20,20,.6) 1px, transparent 2px),
      radial-gradient(circle at 70% 60%, rgba(150,10,10,.5) 1px, transparent 2px),
      radial-gradient(circle at 50% 80%, rgba(180,20,20,.4) 1px, transparent 2px);
    border-radius:50%;
    pointer-events:none;

  /* Торс — рваная, грязная одежда, видны внутренности */
  body.theme-realistic .z-torso {
    position:absolute; top:58px; left:14px;
    width:56px; height:68px;
    background:
      radial-gradient(ellipse at 40% 30%,
        #3a3228 0%,
        #2a2218 40%,
        #1a1408 70%,
        #050302 100%),
      linear-gradient(180deg, #2a2418 0%, #0a0804 100%);
    border-radius:6px 6px 4px 4px;
    border:1px solid #000;
    box-shadow:
      inset 0 0 15px rgba(0,0,0,1),
      inset 6px 8px 12px rgba(0,0,0,.9),
      inset -6px -6px 10px rgba(0,0,0,.95);
    overflow:hidden;

  /* Рваная рана на груди — видно рёбра и мясо */
  body.theme-realistic .z-torso::before {
    content:''; position:absolute;
    top:12px; left:8px;
    width:36px; height:32px;
    background:
      radial-gradient(ellipse at 40% 45%,
        #6a0a0a 0%,
        #5a0808 20%,
        #d8c8a8 35%,
        #8a1010 55%,
        #2a0000 85%,
        transparent 100%);
    border-radius:50%;
    transform:rotate(-8deg);
    box-shadow:
      inset 0 0 8px rgba(0,0,0,.95),
      inset 0 0 14px rgba(120,0,0,.8),
      0 0 10px rgba(0,0,0,.8);
    filter:blur(.4px);
  }
  /* Кишки, свисающие из раны */
  body.theme-realistic .z-torso::after {
    content:''; position:absolute;
    bottom:0; left:22px;
    width:14px; height:44px;
    background:
      linear-gradient(180deg,
        #6a0808 0%,
        #4a0505 30%,
        #5a0808 50%,
        #3a0404 80%,
        #1a0202 100%);
    border-radius:0 0 40% 40%;
    box-shadow:
      inset 2px 0 6px rgba(0,0,0,.9),
      inset -2px 0 4px rgba(120,20,20,.6),
      0 0 8px rgba(0,0,0,.6);
    transform:rotate(6deg);
    filter:blur(.3px);
  }

  /* Руки — с ободранной кожей, с кровью */
  body.theme-realistic .z-arm {
    position:absolute; top:62px;
    width:48px; height:13px;
    background:
      linear-gradient(180deg,
        #7a6a52 0%,
        #5a4a34 30%,
        #3a2a1a 60%,
        #1a0e08 100%);
    border-radius:6px;
    border:1px solid #000;
    box-shadow:
      inset -4px 0 8px rgba(0,0,0,.9),
      inset 2px 0 4px rgba(150,130,90,.15),
      0 2px 6px rgba(0,0,0,.7);
  }
  body.theme-realistic .z-arm.l { left:-36px; transform:rotate(-10deg); transform-origin:right center; }
  body.theme-realistic .z-arm.r { right:-36px; transform:rotate(12deg); transform-origin:left center; }
  /* Кисть руки — с пальцами */
  body.theme-realistic .z-arm::after {
    content:''; position:absolute; top:50%;
    transform:translateY(-50%);
    width:14px; height:16px;
    background:
      radial-gradient(ellipse at 40% 40%,
        #8a7a62 0%,
        #5a4a34 50%,
        #3a2a1a 100%);
    border-radius:40% 60% 60% 40%;
    box-shadow:
      inset -3px -3px 5px rgba(0,0,0,.8),
      0 2px 4px rgba(0,0,0,.7);
  }
  body.theme-realistic .z-arm.l::after { left:-8px; }
  body.theme-realistic .z-arm.r::after { right:-8px; }
  /* Пальцы/когти */
  body.theme-realistic .z-arm::before {
    content:''; position:absolute;
    top:50%; transform:translateY(-50%);
    width:4px; height:14px;
    background:linear-gradient(180deg, #b8a888 0%, #6a5a42 100%);
    clip-path:polygon(50% 0, 100% 100%, 0 100%);
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.9));
    box-shadow:
      6px 0 0 -1px rgba(180,168,136,.6),
      12px 0 0 -2px rgba(180,168,136,.4);
  }
  body.theme-realistic .z-arm.l::before { left:-4px; }
  body.theme-realistic .z-arm.r::before { right:-4px; transform:translateY(-50%) rotate(180deg); }

  /* Рот — приоткрыт, зубы, кровь, гниющая плоть */
  body.theme-realistic .z-mouth {
    position:absolute; top:40px; left:50%;
    transform:translateX(-50%);
    width:26px; height:16px;
    background:
      radial-gradient(ellipse at 50% 30%,
        #1a0505 0%,
        #2a0808 40%,
        #3a0a0a 100%);
    border-radius:0 0 45% 45% / 0 0 85% 85%;
    border-top:1px solid #0a0303;
    box-shadow:
      inset 0 5px 8px rgba(0,0,0,.95),
      inset 0 -2px 4px rgba(80,10,10,.6),
      0 0 6px rgba(0,0,0,.6);
    z-index:2;
  }
  /* Зубы — неровные, грязные */
  body.theme-realistic .z-mouth::before {
    content:''; position:absolute;
    top:0; left:2px; right:2px; height:6px;
    background:
      repeating-linear-gradient(90deg,
        #d8c8a8 0 3px,
        #8a7a5a 3px 4px,
        #4a3a20 4px 5px,
        transparent 5px 7px);
    clip-path:polygon(
      0 0, 12% 100%, 25% 0, 37% 100%, 50% 0, 62% 100%, 75% 0, 87% 100%, 100% 0);
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.9));
  }
  /* Кровь изо рта */
  body.theme-realistic .z-mouth::after {
    content:''; position:absolute;
    top:100%; left:50%;
    transform:translateX(-50%);
    width:3px; height:18px;
    background:linear-gradient(180deg,
      #5a0808 0%,
      #3a0404 50%,
      transparent 100%);
    border-radius:0 0 50% 50%;
    filter:blur(.3px);
    box-shadow:0 0 4px rgba(60,0,0,.6);
  }

  /* Ноги — грязные джинсы/брюки, порванные */
  body.theme-realistic .z-leg {
    position:absolute; top:120px;
    width:20px; height:44px;
    background:
      linear-gradient(180deg,
        #1a1a1a 0%,
        #0a0a0a 60%,
        #050505 100%);
    border-radius:3px;
    border:1px solid #000;
    box-shadow:
      inset -4px 0 6px rgba(0,0,0,.95),
      inset 3px 0 4px rgba(60,60,60,.2);
  }
  body.theme-realistic .z-leg.l { left:18px; transform:rotate(-6deg); transform-origin:top center; }
  body.theme-realistic .z-leg.r { right:18px; transform:rotate(8deg); transform-origin:top center; }
  /* Прореха на колене */
  body.theme-realistic .z-leg::before {
    content:''; position:absolute;
    top:24px; left:50%;
    transform:translateX(-50%);
    width:10px; height:8px;
    background:radial-gradient(ellipse, #3a0505 0%, #1a0202 100%);
    border-radius:50%;
    box-shadow:inset 0 0 3px rgba(0,0,0,.9);
    filter:blur(.3px);
  }
  /* Обувь — тяжёлые ботинки */
  body.theme-realistic .z-leg::after {
    content:''; position:absolute;
    bottom:-3px; left:-4px; right:-4px;
    height:12px;
    background:
      linear-gradient(180deg,
        #1a1a1a 0%,
        #0a0a0a 60%,
        #000 100%);
    border-radius:4px 4px 6px 6px;
    border:1px solid #000;
    box-shadow:
      inset 0 3px 3px rgba(80,80,80,.2),
      0 3px 6px rgba(0,0,0,.8);
  }

  /* Тень — реалистичная */
  body.theme-realistic .z-shadow {
    position:absolute; bottom:-10px; left:50%;
    transform:translateX(-50%);
    width:90px; height:14px;
    background:
      radial-gradient(ellipse,
        rgba(0,0,0,.95) 0%,
        rgba(0,0,0,.7) 30%,
        transparent 80%);
    border-radius:50%;
    filter:blur(3px);
  }

  /* ============ СМЕРТЬ ВРАГА ============ */
  .zombie.dying { animation:bloodyDeath .6s forwards !important; }
  @keyframes bloodyDeath {
    0%   { transform:scale(1) rotate(0); opacity:1; filter:brightness(1);}
    15%  { transform:scale(1.2) rotate(-8deg); filter:brightness(4) hue-rotate(-40deg) saturate(3);}
    35%  { transform:scale(1.1) rotate(15deg); filter:brightness(3) saturate(4) hue-rotate(-20deg);}
    60%  { transform:scale(.7) rotate(45deg); filter:brightness(2) saturate(3); opacity:.8;}
    100% { transform:scale(0) rotate(180deg); opacity:0; }
  }

  /* ============ ТАБЛИЧКА ============ */
  .sign {
    position:absolute; top:-75px; left:50%;
    transform:translateX(-50%);
    font-size:32px; font-weight:bold;
    padding:10px 18px;
    border-radius:4px;
    white-space:nowrap;
    font-family:'KaiTi','SimSun','Microsoft YaHei',serif;
    letter-spacing:2px;
  }
  body.theme-funny .sign {
    background:linear-gradient(180deg, #ffffff 0%, #fff8e8 100%);
    color:#8a3a10;
    border:4px solid #ff8844;
    box-shadow:0 6px 12px rgba(0,0,0,.2), inset 0 0 15px rgba(255,180,80,.3);
    text-shadow:0 1px 0 #fff;
  }
  body.theme-funny .sign::after {
    content:''; position:absolute;
    bottom:-20px; left:50%;
    transform:translateX(-50%);
    width:6px; height:20px;
    background:linear-gradient(180deg, #ff8844, #8a3a10);

  body.theme-lotr .sign {
    background:linear-gradient(180deg, #e8d8a8 0%, #c8b878 100%);
    color:#3a2a08;
    border:3px solid #6a4a10;
    box-shadow:0 0 15px rgba(200,150,60,.4), 0 6px 12px rgba(0,0,0,.5), inset 0 0 20px rgba(120,80,20,.3);
    text-shadow:1px 1px 0 rgba(255,255,255,.4);
  }
  body.theme-lotr .sign::after {
    content:''; position:absolute;
    bottom:-20px; left:50%;
    transform:translateX(-50%);
    width:5px; height:20px;
    background:linear-gradient(180deg, #6a4a10, #2a1a04);
  }
  /* РЕАЛИСТИЧНАЯ табличка: картонка с надписью маркером */
  body.theme-realistic .sign {
    background:
      linear-gradient(180deg,
        #c8b898 0%,
        #a89878 40%,
        #887850 100%);
    color:#2a1810;
    border:2px solid #5a4a30;
    box-shadow:
      0 4px 10px rgba(0,0,0,.8),
      inset 0 0 15px rgba(60,40,20,.4),
      inset 0 2px 0 rgba(255,255,255,.15);
    text-shadow:1px 1px 0 rgba(0,0,0,.15);
    font-family:'Microsoft YaHei',serif;
    letter-spacing:1px;
    /* Потёртости, грязь */
    background-image:
      radial-gradient(circle at 15% 20%, rgba(80,50,20,.4) 3px, transparent 5px),
      radial-gradient(circle at 80% 60%, rgba(60,40,20,.3) 4px, transparent 6px),
      radial-gradient(circle at 45% 85%, rgba(40,25,10,.35) 2px, transparent 4px),
      linear-gradient(180deg, #c8b898 0%, #a89878 40%, #887850 100%);
  }
  body.theme-realistic .sign::after {
    content:''; position:absolute;
    bottom:-20px; left:50%;
    transform:translateX(-50%);
    width:5px; height:20px;
    background:linear-gradient(180deg, #5a4a30, #1a1008);
    box-shadow:0 0 3px rgba(0,0,0,.8);

  .sign.len-2 { font-size:26px; padding:8px 16px; letter-spacing:1px; }
  .sign.len-3 { font-size:21px; padding:7px 14px; letter-spacing:0; }
  .sign.len-4 { font-size:18px; padding:6px 12px; letter-spacing:0; }
  .sign.len-5 { font-size:15px; padding:6px 10px; letter-spacing:0; }

  /* ============ СНАРЯДЫ ============ */
  /* Реалистичная пуля — маленький жёлто-белый след */
  .bullet {
    position:absolute; height:3px; width:24px;
    background:linear-gradient(90deg,
      rgba(255,200,80,0),
      rgba(255,220,120,.9) 60%,
      #ffffff 100%);
    border-radius:2px;
    box-shadow:
      0 0 8px rgba(255,220,120,.9),
      0 0 16px rgba(255,180,60,.6);
    z-index:12;
    transform-origin:left center;

  .arrow {
    position:absolute; height:5px; width:60px;
    background:linear-gradient(90deg, #2a3a1a 0%, #6a8a3a 40%, #a8c86a 100%);
    border-radius:3px;
    box-shadow:0 0 10px rgba(180,220,140,.9), 0 0 20px rgba(120,200,80,.5);
    z-index:10;
    transform-origin:left center;
  }
  .arrow::before {
    content:''; position:absolute; right:-10px; top:-3px;
    width:0; height:0;
    border-left:12px solid #d8e8c0;
    border-top:5px solid transparent;
    border-bottom:5px solid transparent;
    filter:drop-shadow(0 0 3px #a8c86a);
  }
  .arrow::after {
    content:''; position:absolute; left:-6px; top:-3px;
    width:12px; height:10px;
    background:
      radial-gradient(circle at 30% 50%, #c8d8a0 0 2px, transparent 3px),
      radial-gradient(circle at 70% 50%, #8aa860 0 2px, transparent 3px);
    border-radius:2px;
    filter:drop-shadow(0 0 2px #a8c86a);
  }
  .pumpkin-proj {
    position:absolute; width:36px; height:36px; border-radius:50%;
    background:radial-gradient(circle at 40% 40%, #ffb347, #ff7518);
    box-shadow:inset -6px -4px 0 rgba(0,0,0,.2), 0 0 20px #ff7518;
    z-index:10;
    will-change:transform, left, top;
  }
  .pumpkin-proj::before, .pumpkin-proj::after {
    content:''; position:absolute; top:12px;
    width:6px; height:8px; background:#000;
    border-radius:50%;
  }
  .pumpkin-proj::before { left:8px; }
  .pumpkin-proj::after  { right:8px; }
  .pumpkin-proj .pj-mouth {
    position:absolute; top:24px; left:50%;
    transform:translateX(-50%);
    width:16px; height:5px;

  /* ============ СКРИМЕР ============ */
  #screamer {
    position:absolute; inset:0;
    z-index:60;
    display:none;
    background:#000;
    justify-content:center;
    align-items:center;
    overflow:hidden;
  }
  #screamer.show { display:flex; animation:screamerShake .5s; }
  @keyframes screamerShake {
    0%,100% { transform:translate(0); }
    20% { transform:translate(-8px, 6px); }
    40% { transform:translate(8px, -6px); }
    60% { transform:translate(-6px, 8px); }
    80% { transform:translate(6px, -8px); }
  }
  #screamer .face {
    position:relative;
    width:650px; height:650px;
    background:radial-gradient(ellipse at 50% 45%,
      #e8d8b0 0%, #9a8050 25%, #4a2810 60%, #1a0808 100%);
    border-radius:50% 50% 45% 45% / 55% 55% 45% 45%;
    box-shadow:
      inset 0 0 120px rgba(0,0,0,.95),
      inset 0 -60px 120px rgba(150,0,0,.7),
      0 0 250px rgba(220,0,0,1),
      0 0 400px rgba(150,0,0,.7);
    animation:faceZoom .4s;
  }
  @keyframes faceZoom {
    0% { transform:scale(.2) rotate(-8deg); }
    100% { transform:scale(1) rotate(0); }
  }
  #screamer .face::before,
  #screamer .face::after {
    content:''; position:absolute; top:35%;
    width:90px; height:90px;
    background:radial-gradient(circle,
      #ffffff 0%, #ff5522 20%, #ff0000 50%, #8a0000 75%, #000 100%);
    border-radius:50%;
    box-shadow:
      0 0 60px #ff0000,
      0 0 120px #ff0000,
      inset 0 0 30px #000;
    animation:eyeTwitch .08s infinite;
  }
  #screamer .face::before { left:20%; }
  #screamer .face::after  { right:20%; }
  @keyframes eyeTwitch {
    0%, 100% { transform:scale(1); }
    50% { transform:scale(1.12); }
  }
  #screamer .mouth {
    position:absolute; top:62%; left:50%;
    transform:translateX(-50%);
    width:320px; height:210px;
    background:radial-gradient(ellipse at 50% 30%,
      #000 0%, #3a0000 40%, #000 100%);
    border-radius:50% 50% 45% 45% / 30% 30% 70% 70%;
    box-shadow:
      inset 0 30px 60px rgba(150,0,0,.95),
      inset 0 -30px 60px rgba(0,0,0,.95),
      0 0 60px rgba(220,0,0,.8);
    animation:mouthOpen .5s infinite alternate;
  }
  @keyframes mouthOpen {
    0% { height:210px; }
    100% { height:260px; }
  }
  #screamer .mouth::before {
    content:''; position:absolute; top:0; left:0; right:0; height:60px;
    background:repeating-linear-gradient(90deg,
      #f0e0c0 0 10px, #8a7040 10px 12px, transparent 12px 34px);
    clip-path:polygon(
      0 0, 8% 100%, 16% 0, 24% 100%, 32% 0, 40% 100%, 48% 0,
      56% 100%, 64% 0, 72% 100%, 80% 0, 88% 100%, 96% 0, 100% 100%, 100% 0);
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.9));
  }
  #screamer .mouth::after {
    content:''; position:absolute; bottom:0; left:0; right:0; height:50px;
    background:repeating-linear-gradient(90deg,
      #f0e0c0 0 10px, #8a7040 10px 12px, transparent 12px 34px);
    clip-path:polygon(
      0 100%, 8% 0, 16% 100%, 24% 0, 32% 100%, 40% 0, 48% 100%,
      56% 0, 64% 100%, 72% 0, 80% 100%, 88% 0, 96% 100%, 100% 0, 100% 100%);
    filter:drop-shadow(0 -6px 10px rgba(0,0,0,.9));
  }
  #screamer .static {
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(0deg,
        rgba(255,255,255,.04) 0 2px, transparent 2px 4px);
    mix-blend-mode:overlay;
    pointer-events:none;
    animation:staticMove .08s infinite;
  }
  @keyframes staticMove {
    0% { transform:translateY(0); }
    100% { transform:translateY(4px); }
  }

  /* ============ ОВЕРЛЕИ ============ */

<script>
/* =========================================================
   ЗВУК
   ========================================================= */
const Sound = (() => {
  let ctx = null;
  let muted = false;
  let bgSources = [];
  let bgLoopId = null;
  let heartbeatId = null;
  let breathId = null;

  function ensure() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e) {}
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function playOsc({ freq=440, dur=0.2, type='sine', vol=0.15, slideTo=null,
                    delay=0, attack=0.005, release=0.05 }) {
    if (muted) return;
    const c = ensure(); if (!c) return;
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + release);
    osc.connect(g).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + release + 0.02);
  }

  function playNoise({ dur=0.2, vol=0.15, filterFreq=1000, filterQ=1,
                       filterType='lowpass', delay=0 }) {
    if (muted) return;
    const c = ensure(); if (!c) return;
    const t0 = c.currentTime + delay;
    const bufferSize = Math.floor(c.sampleRate * dur);
    const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource();
    src.buffer = buffer;
    const filter = c.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.value = filterFreq;
    filter.Q.value = filterQ;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter).connect(g).connect(c.destination);
    src.start(t0);
    src.stop(t0 + dur + 0.05);
  }

  /* Реалистичный выстрел — пистолет */
  function gunshot() {
    // Резкий удар — короткий белый шум
    playNoise({ dur:0.08, vol:0.5, filterFreq:4000, filterType:'highpass' });
    playNoise({ dur:0.15, vol:0.35, filterFreq:1200, filterType:'lowpass' });
    // Низкий "бум"
    playOsc({ freq:180, dur:0.12, type:'sine', vol:0.35, slideTo:40 });
    // Отдача
    playNoise({ dur:0.3, vol:0.1, filterFreq:600, delay:0.05 });
  }
  /* Реалистичное попадание — мясистый "шлепок" */
  function hitReal() {
    playNoise({ dur:0.18, vol:0.35, filterFreq:500, filterQ:1 });
    playOsc({ freq:120, dur:0.25, type:'sine', vol:0.3, slideTo:35 });
    playNoise({ dur:0.1, vol:0.2, filterFreq:2500, filterType:'bandpass', filterQ:2 });
  }
  /* Реалистичное рычание зомби */
  function zombieAttackReal() {
    playOsc({ freq:90, dur:1.0, type:'sawtooth', vol:0.3, slideTo:50 });
    playOsc({ freq:130, dur:0.8, type:'triangle', vol:0.15, slideTo:70, delay:0.1 });
    playNoise({ dur:1.0, vol:0.2, filterFreq:400, filterType:'lowpass' });
    // Хрип
    playNoise({ dur:0.6, vol:0.15, filterFreq:800, filterType:'bandpass', filterQ:1, delay:0.2 });
  }
  function zombieSpawnReal() {
    // Медленные шаркающие шаги
    playNoise({ dur:0.15, vol:0.08, filterFreq:250, filterType:'lowpass' });
    playNoise({ dur:0.12, vol:0.06, filterFreq:200, filterType:'lowpass', delay:0.3 });
    // Далёкий стон
    playOsc({ freq:95, dur:0.7, type:'sine', vol:0.08, slideTo:60, delay:0.15 });
  }
  function thunder() {
    playNoise({ dur:1.8, vol:0.3, filterFreq:400, filterType:'lowpass' });
    playNoise({ dur:0.4, vol:0.4, filterFreq:6000, filterType:'highpass' });
    playOsc({ freq:45, dur:1.5, type:'sine', vol:0.3, slideTo:25, delay:0.1 });
  }

  function pumpkinThrow() {
    playOsc({ freq:280, dur:0.18, type:'triangle', vol:0.18, slideTo:120 });
    playNoise({ dur:0.15, vol:0.08, filterFreq:800 });
  }
  function hitFunny() {
    playOsc({ freq:600, dur:0.15, type:'sine', vol:0.18, slideTo:900 });
    playOsc({ freq:900, dur:0.1, type:'triangle', vol:0.12, slideTo:1200, delay:0.05 });
    playNoise({ dur:0.1, vol:0.05, filterFreq:2000, filterType:'highpass' });
  }
  function zombieAttackFunny() {
    playOsc({ freq:300, dur:0.3, type:'triangle', vol:0.15, slideTo:150 });
    playOsc({ freq:180, dur:0.5, type:'sine', vol:0.12, slideTo:90, delay:0.15 });
  }
  function zombieSpawnFunny() {
    playOsc({ freq:440, dur:0.15, type:'sine', vol:0.08, slideTo:330 });
  }

  function arrowShot() {
    playNoise({ dur:0.25, vol:0.15, filterFreq:3000, filterType:'bandpass', filterQ:2 });
    playOsc({ freq:1800, dur:0.18, type:'sine', vol:0.08, slideTo:400 });
  }
  function hitLOTR() {
    playOsc({ freq:900, dur:0.3, type:'sine', vol:0.14, slideTo:1400 });
    playOsc({ freq:1300, dur:0.25, type:'triangle', vol:0.08, slideTo:1800, delay:0.05 });
    playNoise({ dur:0.15, vol:0.08, filterFreq:1500, filterType:'bandpass', filterQ:2 });
  }
  function zombieAttackLOTR() {
    playOsc({ freq:200, dur:0.5, type:'sawtooth', vol:0.22, slideTo:80 });
    playOsc({ freq:140, dur:0.7, type:'triangle', vol:0.18, slideTo:60, delay:0.1 });
    playNoise({ dur:0.5, vol:0.18, filterFreq:500 });
  }
  function zombieSpawnLOTR() {
    playOsc({ freq:180, dur:0.3, type:'triangle', vol:0.08, slideTo:140 });
  }

  function victory() {
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f, i) => {
      playOsc({ freq:f, dur:0.35, type:'triangle', vol:0.18, delay:i * 0.15 });
      playOsc({ freq:f*2, dur:0.3, type:'sine', vol:0.08, delay:i * 0.15 });
    });
  }
  function defeat() {
    playOsc({ freq:180, dur:0.6, type:'sawtooth', vol:0.25, slideTo:60 });
    playOsc({ freq:140, dur:0.8, type:'sawtooth', vol:0.25, slideTo:40, delay:0.5 });
    playOsc({ freq:100, dur:1.5, type:'sawtooth', vol:0.3, slideTo:30, delay:1.2 });
    playNoise({ dur:2.0, vol:0.15, filterFreq:200, delay:1.5 });
  }

  function stopBg() {
    bgSources.forEach(s => { try { s.stop(); } catch(e){} });
    bgSources = [];
    if (bgLoopId) { clearTimeout(bgLoopId); bgLoopId = null; }
    if (heartbeatId) { clearInterval(heartbeatId); heartbeatId = null; }
    if (breathId) { clearInterval(breathId); breathId = null; }
  }

  function drone(freq, vol, type='sine') {
    const c = ensure(); if (!c) return;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.value = vol;
    osc.connect(g).connect(c.destination);
    osc.start();
    bgSources.push(osc);
  }

  function startBg(theme) {
    if (muted) return;
    stopBg();
    const c = ensure(); if (!c) return;

    if (theme === 'realistic') {
      // Мрачный эмбиент ночи + дождь
      drone(45, 0.06, 'sine');
      drone(67, 0.04, 'triangle');
      // Шум дождя
      const bufferSize = c.sampleRate * 4;
      const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random()*2-1)*0.08;
      const src = c.createBufferSource();
      src.buffer = buffer; src.loop = true;
      const filter = c.createBiquadFilter();
      filter.type = 'highpass'; filter.frequency.value = 2000;
      const g = c.createGain(); g.gain.value = 0.15;
      src.connect(filter).connect(g).connect(c.destination);
      src.start();
      bgSources.push(src);

      // Далёкий гром
      function scheduleThunder() {
        if (muted) return;
        thunder();
        bgLoopId = setTimeout(scheduleThunder, 15000 + Math.random() * 20000);
      }
      scheduleThunder();
    }
    else if (theme === 'funny') {
      const melody = [
        [659.25, 0.15], [784.0, 0.15], [880.0, 0.15], [1046.5, 0.15],
        [880.0, 0.15], [784.0, 0.15], [659.25, 0.3],
        [587.33, 0.15], [659.25, 0.15], [784.0, 0.15], [880.0, 0.3],
        [784.0, 0.15], [659.25, 0.15], [587.33, 0.4]
      ];
      let idx = 0;
      function playNote() {
        if (muted) return;
        const [freq, dur] = melody[idx];
        playOsc({ freq, dur, type:'triangle', vol:0.06 });
        idx = (idx + 1) % melody.length;
        bgLoopId = setTimeout(playNote, dur * 1000 + 80);
      }
      playNote();
      drone(130.8, 0.03, 'sine');
    }
    else if (theme === 'lotr') {
      drone(98, 0.05, 'sine');
      drone(146.8, 0.035, 'triangle');
      drone(196, 0.03, 'sine');
      const notes = [523.25, 587.33, 659.25, 783.99];
      let i = 0;
      function chime() {
        if (muted) return;
        playOsc({ freq: notes[i % notes.length], dur: 1.2, type:'sine', vol:0.035 });
        i++;
        bgLoopId = setTimeout(chime, 1800);
      }
      chime();
    }
  }

  function setMuted(v) { muted = v; if (v) stopBg(); }
  function isMuted() { return muted; }

  return {
    shoot(theme) {
      if (theme === 'funny') pumpkinThrow();
      else if (theme === 'realistic') gunshot();
      else arrowShot();
    },
    hit(theme) {
      if (theme === 'funny') hitFunny();
      else if (theme === 'realistic') hitReal();
      else hitLOTR();
    },
    zombieAttack(theme) {
      if (theme === 'funny') zombieAttackFunny();
      else if (theme === 'realistic') zombieAttackReal();
      else zombieAttackLOTR();
    },
    zombieSpawn(theme) {
      if (theme === 'funny') zombieSpawnFunny();
      else if (theme === 'realistic') zombieSpawnReal();
      else zombieSpawnLOTR();
    },
    thunder, victory, defeat,
    startBg, stopBg, setMuted, isMuted
  };
})();

   DOM
   ========================================================= */

wordInput.value = `南瓜

let difficulty = 'easy';
let theme = 'realistic';

document.querySelectorAll('#diffRow .optBtn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#diffRow .optBtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.diff;
  };
});

function applyTheme() {
  document.body.className = 'theme-' + theme;
  buildStars();
  buildScene();
  buildRain();
}

function buildStars() {
  starsEl.innerHTML = '';
  if (theme !== 'realistic') return;
  for (let i = 0; i < 100; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top  = Math.random() * 55 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.opacity = '.3';
    starsEl.appendChild(s);
  }
}

function buildRain() {
  rainEl.innerHTML = '';
  if (theme !== 'realistic') return;
  for (let i = 0; i < 120; i++) {
    const r = document.createElement('div');
    r.className = 'raindrop';
    const h = 15 + Math.random() * 35;
    r.style.height = h + 'px';
    r.style.left = Math.random() * 110 + '%';
    r.style.animationDuration = (0.4 + Math.random() * 0.5) + 's';
    r.style.animationDelay = (Math.random() * 2) + 's';
    r.style.opacity = 0.3 + Math.random() * 0.5;
    rainEl.appendChild(r);

}

function buildScene() {
  sceneEl.innerHTML = '';
  if (theme === 'realistic') return;

  if (theme === 'funny') {
    const rb = document.createElement('div');
    rb.className = 'rainbow';
    sceneEl.appendChild(rb);

    for (let i = 0; i < 5; i++) {
      const c = document.createElement('div');
      c.className = 'cloud';
      const w = 80 + Math.random() * 80;
      const h = 30 + Math.random() * 20;
      c.style.width = w + 'px';
      c.style.height = h + 'px';
      c.style.left = (Math.random() * 90) + '%';
      c.style.top  = (5 + Math.random() * 30) + '%';
      c.style.animation = `float ${3 + Math.random() * 2}s ease-in-out infinite alternate`;
      sceneEl.appendChild(c);
    }

    const candyColors = ['#ff4466', '#ffaa33', '#44cc44', '#4488ff', '#cc44ff'];
    for (let i = 0; i < 25; i++) {
      const cd = document.createElement('div');
      cd.className = 'candy';
      cd.style.left = (Math.random() * 95) + '%';
      cd.style.bottom = (5 + Math.random() * 70) + 'px';
      cd.style.background = candyColors[Math.floor(Math.random() * candyColors.length)];
      sceneEl.appendChild(cd);
    }

    const balloonColors = ['#ff4466', '#ffaa33', '#44cc44', '#4488ff', '#cc44ff', '#ff88cc'];
    for (let i = 0; i < 6; i++) {
      const b = document.createElement('div');
      b.className = 'balloon';
      b.style.left = (5 + Math.random() * 90) + '%';
      b.style.top = (15 + Math.random() * 30) + '%';
      b.style.background = `radial-gradient(circle at 35% 35%, #fff 0%, ${balloonColors[i]} 60%)`;
      b.style.animationDelay = (Math.random() * 3) + 's';
      sceneEl.appendChild(b);
    }
    return;
  }

  if (theme === 'lotr') {
    const sun = document.createElement('div');
    sun.className = 'sun';
    sceneEl.appendChild(sun);

    for (let i = 0; i < 6; i++) {
      const c = document.createElement('div');
      c.className = 'softcloud';
      const w = 100 + Math.random() * 100;
      const h = 24 + Math.random() * 20;
      c.style.width = w + 'px';
      c.style.height = h + 'px';
      c.style.left = (Math.random() * 90) + '%';
      c.style.top  = (5 + Math.random() * 25) + '%';
      c.style.animation = `float ${5 + Math.random() * 3}s ease-in-out infinite alternate`;
      sceneEl.appendChild(c);
    }

    const mts = [
      { x:'5%',  w:200, h:140, color:'#8aa4b8' },
      { x:'25%', w:260, h:180, color:'#7a94a8' },
      { x:'55%', w:240, h:160, color:'#8aa4b8' },
      { x:'78%', w:220, h:150, color:'#7a94a8' },
    ];
    mts.forEach(m => {
      const t = document.createElement('div');
      t.className = 'mountain';
      t.style.left = m.x;
      t.style.borderLeftWidth  = (m.w/2) + 'px';
      t.style.borderRightWidth = (m.w/2) + 'px';
      t.style.borderBottomWidth = m.h + 'px';
      t.style.borderLeftColor  = 'transparent';
      t.style.borderRightColor = 'transparent';
      t.style.borderBottomColor = m.color;
      t.style.filter = 'drop-shadow(0 4px 8px rgba(0,0,0,.2))';
      sceneEl.appendChild(t);
      const snow = document.createElement('div');
      snow.style.cssText = `
        position:absolute; left:${m.x}; bottom:${80 + m.h - 30}px;
        width:0; height:0;
        border-left:${m.w/6}px solid transparent;
        border-right:${m.w/6}px solid transparent;
        border-bottom:30px solid rgba(255,255,255,.85);
        transform:translateX(${m.w/3}px);
      `;
      sceneEl.appendChild(snow);
    });

    for (let i = 0; i < 3; i++) {
      const h = document.createElement('div');
      h.className = 'hill';
      const w = 400 + Math.random() * 300;
      const hh = 60 + Math.random() * 40;
      h.style.width = w + 'px';
      h.style.height = hh + 'px';
      h.style.left = (i * 35 - 10) + '%';
      h.style.background = `radial-gradient(ellipse at 50% 100%, #7aad5a 0%, #4a7a28 100%)`;
      h.style.opacity = .95;
      sceneEl.appendChild(h);
    }

    const trees = [{ x:'10%' }, { x:'30%' }, { x:'55%' }, { x:'80%' }, { x:'92%' }];
    trees.forEach(t => {
      const tr = document.createElement('div');
      tr.className = 'lotr-tree';
      tr.style.left = t.x;
      tr.style.transform = `scale(${0.8 + Math.random() * 0.4})`;
      sceneEl.appendChild(tr);
    });
    return;
  }
}

    lightningEl.style.opacity = '0';

  }, 80);
  setTimeout(() => {
    if (!running) return;
    lightningEl.style.opacity = '.8';
    setTimeout(() => {
      lightningEl.style.transition = 'opacity .5s';
      lightningEl.style.opacity = '0';
      setTimeout(() => lightningEl.style.transition = 'opacity 0s', 500);
    }, 60);
  }, 200);
  setTimeout(() => Sound.thunder(), 300);

function pickNextWord() {
  if (WORD_QUEUE.length === 0) return null;
  return WORD_QUEUE.shift();
}

function spawnEnemy() {
  if (WORD_QUEUE.length === 0) return false;
  const word = pickNextWord();
  if (!word) return false;

  const z = document.createElement('div');
  z.className = 'zombie';

  const lenClass = word.length <= 1 ? '' :

    x: startX,
    speed: zombieSpeed * (0.9 + Math.random() * 0.4),
    alive: true
  });
  return true;
}

/* =========================================================
   ВЫСТРЕЛ
   ========================================================= */
function shoot(target) {
  if (!target || !target.alive) return;

  const hp = heroPos();
  const zr = target.el.getBoundingClientRect();
  const gr = game.getBoundingClientRect();
  const signEl = target.el.querySelector('.sign');
  const sr = signEl ? signEl.getBoundingClientRect() : zr;
  const tx = sr.left - gr.left + sr.width / 2;
  const ty = sr.top  - gr.top  + sr.height / 2;

  let sx = hp.x + 30;
  let sy = hp.y + 5;
  if (theme === 'funny')      { sx = hp.x + 30; sy = hp.y + 10; }
  else if (theme === 'lotr')  { sx = hp.x + 25; sy = hp.y - 10; }
  else if (theme === 'realistic') { sx = hp.x + 38; sy = hp.y + 5; }

  const dx = tx - sx, dy = ty - sy;
  const dist = Math.hypot(dx, dy);
  const angleDeg = Math.atan2(dy, dx) * 180 / Math.PI;

  Sound.shoot(theme);

  /* РЕАЛИСТИЧНЫЙ — быстрая пуля */
  if (theme === 'realistic') {
    // Вспышка на дуле
    const hero = document.getElementById('hero');
    if (hero) {
      hero.classList.remove('shoot');
      void hero.offsetWidth;
      hero.classList.add('shoot');
      setTimeout(() => hero.classList.remove('shoot'), 150);
    }

    const bullet = document.createElement('div');
    bullet.className = 'bullet';
    bullet.style.left = sx + 'px';
    bullet.style.top  = (sy - 1) + 'px';
    bullet.style.transformOrigin = '0 50%';
    bullet.style.transform = `rotate(${angleDeg}deg)`;
    game.appendChild(bullet);

    // Пуля летит быстро — 120 мс
    const flightTime = 120;
    const startT = performance.now();
    const cos = Math.cos(angleDeg * Math.PI / 180);
    const sin = Math.sin(angleDeg * Math.PI / 180);

    function flyBullet(now) {
      const t = Math.min(1, (now - startT) / flightTime);
      const cx = sx + cos * dist * t;
      const cy = sy + sin * dist * t;
      bullet.style.left = cx + 'px';
      bullet.style.top  = (cy - 1) + 'px';
      if (t < 1) requestAnimationFrame(flyBullet);
      else { bullet.remove(); killEnemy(target); }
    }
    requestAnimationFrame(flyBullet);
    recoil();
    return;
  }

  /* Funny */
  if (theme === 'funny') {
    const proj = document.createElement('div');
    proj.className = 'pumpkin-proj';
    proj.innerHTML = `<div class="pj-stem"></div><div class="pj-mouth"></div>`;
    proj.style.left = (sx - 18) + 'px';
    proj.style.top  = (sy - 18) + 'px';
    game.appendChild(proj);

    const flightTime = Math.max(180, Math.min(600, dist * 1.1));
    const startT = performance.now();
    function flyPumpkin(now) {
      const t = Math.min(1, (now - startT) / flightTime);
      const cx = sx + (tx - sx) * t;
      const cy = sy + (ty - sy) * t;
      proj.style.left = (cx - 18) + 'px';
      proj.style.top  = (cy - 18) + 'px';
      proj.style.transform = `rotate(${t * 360}deg)`;
      if (t < 1) requestAnimationFrame(flyPumpkin);
      else { proj.remove(); killEnemy(target); }
    }
    requestAnimationFrame(flyPumpkin);
    recoil();
    return;
  }

  /* LOTR — стрела */
  const proj = document.createElement('div');
  proj.className = 'arrow';
  proj.style.left = sx + 'px';
  proj.style.top  = (sy - 3) + 'px';
  proj.style.transformOrigin = '0 50%';
  proj.style.transform = `rotate(${angleDeg}deg)`;
  game.appendChild(proj);

  const flightTime = Math.max(180, Math.min(600, dist * 1.1));
  const startT = performance.now();
  const cos = Math.cos(angleDeg * Math.PI / 180);
  const sin = Math.sin(angleDeg * Math.PI / 180);

  function flyArrow(now) {
    const t = Math.min(1, (now - startT) / flightTime);
    const cx = sx + cos * dist * t;
    const cy = sy + sin * dist * t;
    proj.style.left = cx + 'px';
    proj.style.top  = (cy - 3) + 'px';
    if (t < 1) requestAnimationFrame(flyArrow);
    else { proj.remove(); killEnemy(target); }
  }
  requestAnimationFrame(flyArrow);
  recoil();
}

function recoil() {
  const hero = document.getElementById('hero');
  if (!hero) return;
  hero.animate([
    { transform:'translateX(0)' },
    { transform:'translateX(-6px)' },
    { transform:'translateX(0)' }
  ], { duration:150 });
}

/* =========================================================
   УБИЙСТВО
   ========================================================= */
function killEnemy(z) {
  if (!z.alive) return;
  z.alive = false;

  Sound.hit(theme);

  const r = z.el.getBoundingClientRect();
  const gr = game.getBoundingClientRect();
  const cx = r.left - gr.left + r.width / 2;
  const cy = r.top  - gr.top  + r.height / 2;

  z.el.remove();

  if (theme === 'realistic') {
    const bimp = document.createElement('div');
    bimp.className = 'bullet-impact';
    bimp.style.left = (cx - 18) + 'px';
    bimp.style.top  = (cy - 18) + 'px';
    game.appendChild(bimp);
    setTimeout(() => bimp.remove(), 300);

    for (let i = 0; i < 25; i++) {
      const b = document.createElement('div');
      b.className = 'blood-real';
      const angle = Math.random() * Math.PI * 2;
      const d = 40 + Math.random() * 130;
      b.style.setProperty('--dx', Math.cos(angle) * d + 'px');
      b.style.setProperty('--dy', Math.sin(angle) * d + 'px');
      b.style.left = cx + 'px';
      b.style.top  = cy + 'px';
      const size = 3 + Math.random() * 10;
      b.style.width  = size + 'px';
      b.style.height = size + 'px';
      b.style.animationDelay = (Math.random() * 0.2) + 's';
      game.appendChild(b);
      setTimeout(() => b.remove(), 900);
    }
  }
  else if (theme === 'funny') {
    const puff = document.createElement('div');
    puff.className = 'puff-funny';
    puff.style.left = (cx - 35) + 'px';
    puff.style.top  = (cy - 35) + 'px';
    game.appendChild(puff);
    setTimeout(() => puff.remove(), 550);

    for (let i = 0; i < 12; i++) {
      const mp = document.createElement('div');
      mp.className = 'mini-pumpkin';
      const angle = Math.random() * Math.PI * 2;
      const d = 50 + Math.random() * 100;
      mp.style.setProperty('--dx', Math.cos(angle) * d + 'px');
      mp.style.setProperty('--dy', Math.sin(angle) * d + 'px');
      mp.style.left = (cx - 10) + 'px';
      mp.style.top  = (cy - 10) + 'px';
      mp.style.animationDelay = (Math.random() * 0.1) + 's';
      game.appendChild(mp);
      setTimeout(() => mp.remove(), 800);
    }

    for (let i = 0; i < 8; i++) {
      const sp = document.createElement('div');
      sp.className = 'spark';
      sp.style.background = ['#ffcc00','#ff8844','#ffee88'][Math.floor(Math.random()*3)];
      sp.style.boxShadow = '0 0 10px #ff8844';
      sp.style.left = cx + 'px';
      sp.style.top  = cy + 'px';
      const ang = Math.random() * Math.PI * 2;
      const d = 40 + Math.random() * 60;
      sp.style.transition = 'transform .5s ease-out, opacity .5s';
      game.appendChild(sp);
      requestAnimationFrame(() => {
        sp.style.transform = `translate(${Math.cos(ang)*d}px, ${Math.sin(ang)*d}px) scale(0)`;
        sp.style.opacity = '0';
      });
      setTimeout(() => sp.remove(), 550);
    }
  }
  else {
    const ef = document.createElement('div');
    ef.className = 'elf-flash';
    ef.style.left = (cx - 40) + 'px';
    ef.style.top  = (cy - 40) + 'px';
    game.appendChild(ef);
    setTimeout(() => ef.remove(), 550);

    for (let i = 0; i < 8; i++) {
      const leaf = document.createElement('div');
      leaf.className = 'elf-leaf';
      const angle = Math.random() * Math.PI * 2;
      const d = 60 + Math.random() * 110;
      leaf.style.setProperty('--dx', Math.cos(angle) * d + 'px');
      leaf.style.setProperty('--dy', Math.sin(angle) * d + 'px');
      leaf.style.left = (cx - 7) + 'px';
      leaf.style.top  = (cy - 4) + 'px';
      leaf.style.animationDelay = (Math.random() * 0.1) + 's';
      game.appendChild(leaf);
      setTimeout(() => leaf.remove(), 850);
    }

    for (let i = 0; i < 12; i++) {
      const sp = document.createElement('div');
      sp.className = 'elf-spark';
      const angle = Math.random() * Math.PI * 2;
      const d = 40 + Math.random() * 90;
      sp.style.setProperty('--dx', Math.cos(angle) * d + 'px');
      sp.style.setProperty('--dy', Math.sin(angle) * d + 'px');
      sp.style.left = cx + 'px';
      sp.style.top  = cy + 'px';
      sp.style.animationDelay = (Math.random() * 0.1) + 's';
      game.appendChild(sp);
      setTimeout(() => sp.remove(), 800);
    }
  }

  score++;
  KILLED++;
  scoreEl.textContent = score;
  updateRemaining();

  if (score % 4 === 0) {
    const d = DIFF[difficulty];
    spawnInterval = Math.max(d.minSpawn, spawnInterval - d.spawnStep);
    zombieSpeed = Math.min(d.minSpeed, zombieSpeed + d.speedStep);
  }

  if (KILLED >= TOTAL_WORDS) {
    setTimeout(winGame, 800);
  }
}

function updateRemaining() {
  const left = TOTAL_WORDS - KILLED;
  waveEl.textContent = Math.max(0, left);
}

/* =========================================================
   АТАКА
   ========================================================= */
function hurtHero() {
  Sound.zombieAttack(theme);

  lives--;
  livesEl.textContent = lives;

  attackFlash.style.transition = 'opacity .05s';
  attackFlash.style.opacity = '1';
  setTimeout(() => {
    attackFlash.style.transition = 'opacity .5s';
    attackFlash.style.opacity = '0';
  }, 100);

  game.animate([
    { transform:'translate(0,0) rotate(0)' },
    { transform:'translate(-20px,15px) rotate(-3deg)' },
    { transform:'translate(18px,-12px) rotate(3deg)' },
    { transform:'translate(-14px,8px) rotate(-2deg)' },
    { transform:'translate(10px,-5px) rotate(1.5deg)' },
    { transform:'translate(-5px,3px) rotate(0)' },
    { transform:'translate(0,0) rotate(0)' }
  ], { duration:650, easing:'ease-out' });

  const hp = heroPos();

  if (theme === 'realistic') {
    for (let i = 0; i < 25; i++) {
      const b = document.createElement('div');
      b.className = 'blood-real';
      const angle = Math.random() * Math.PI * 2;
      const d = 50 + Math.random() * 120;
      b.style.setProperty('--dx', Math.cos(angle) * d + 'px');
      b.style.setProperty('--dy', Math.sin(angle) * d + 'px');
      b.style.left = hp.x + 'px';
      b.style.top  = hp.y + 'px';
      const size = 4 + Math.random() * 12;
      b.style.width  = size + 'px';
      b.style.height = size + 'px';
      game.appendChild(b);
      setTimeout(() => b.remove(), 1000);
    }
    bloodScreenEffect();
  }
  else if (theme === 'funny') {
    for (let i = 0; i < 15; i++) {
      const mp = document.createElement('div');
      mp.className = 'mini-pumpkin';
      const angle = Math.random() * Math.PI * 2;
      const d = 50 + Math.random() * 100;
      mp.style.setProperty('--dx', Math.cos(angle) * d + 'px');
      mp.style.setProperty('--dy', Math.sin(angle) * d + 'px');
      mp.style.left = (hp.x - 10) + 'px';
      mp.style.top  = (hp.y - 10) + 'px';
      game.appendChild(mp);
      setTimeout(() => mp.remove(), 800);
    }
  }
  else {
    for (let i = 0; i < 15; i++) {
      const leaf = document.createElement('div');
      leaf.className = 'elf-leaf';
      const angle = Math.random() * Math.PI * 2;
      const d = 50 + Math.random() * 120;
      leaf.style.setProperty('--dx', Math.cos(angle) * d + 'px');
      leaf.style.setProperty('--dy', Math.sin(angle) * d + 'px');
      leaf.style.left = (hp.x - 7) + 'px';
      leaf.style.top  = (hp.y - 4) + 'px';
      game.appendChild(leaf);
      setTimeout(() => leaf.remove(), 850);
    }
  }

  const hero = document.getElementById('hero');
  if (hero) {
    hero.classList.remove('hurt');
    void hero.offsetWidth;
    hero.classList.add('hurt');
    setTimeout(() => hero.classList.remove('hurt'), 700);
  }

  if (lives <= 0) {
    setTimeout(() => gameOver(), 900);
  }
}

/* =========================================================
   ИГРОВОЙ ЦИКЛ
   ========================================================= */
function fireAtClosest() {
  if (!running || zombies.length === 0) return;
  let target = null, minX = Infinity;
  for (const z of zombies) if (z.alive && z.x < minX) { minX = z.x; target = z; }
  if (target) shoot(target);
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (running) fireAtClosest();
  }
});

function loop(t) {
  if (!running) return;
  if (!lastTime) lastTime = t;
  const dt = Math.min(50, t - lastTime);
  lastTime = t;

  if (WORD_QUEUE.length > 0) {
    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnEnemy();
    }
  }

  for (const z of zombies) {
    if (!z.alive) continue;
    z.x -= z.speed * dt * 0.06 * 60 / 16;
    z.el.style.left = z.x + 'px';
    if (z.x < 130) {
      z.alive = false;
      z.el.classList.add('charging');
      const ze = z.el;
      setTimeout(() => ze.remove(), 800);
      hurtHero();
      WORD_QUEUE.push(z.word);
    }
  }
  zombies = zombies.filter(z => z.alive);
  rafId = requestAnimationFrame(loop);
}

/* =========================================================
   СТАРТ / ФИНАЛ
   ========================================================= */
function startGame() {
  const raw = wordInput.value
    .split('\n')
    .map(l => l.trim())
    .filter(l => l.length > 0);

  if (raw.length === 0) {
    alert('请至少输入一个汉字或词语！');
    return;
  }

  const unique = [...new Set(raw)];
  WORD_QUEUE = [...unique].sort(() => Math.random() - 0.5);
  TOTAL_WORDS = unique.length;
  KILLED = 0;

  document.querySelectorAll('.zombie').forEach(z => z.remove());
  zombies = [];

  renderHero();

  const d = DIFF[difficulty];
  zombieSpeed = d.startSpeed;
  spawnInterval = d.spawn;

  score = 0; lives = 3;
  spawnTimer = 0; lastTime = 0;
  scoreEl.textContent = '0';
  livesEl.textContent = '3';
  updateRemaining();

  setupScr.classList.add('hidden');
  loseScr.classList.add('hidden');
  winScr.classList.add('hidden');

  Sound.startBg(theme);

  const intro = document.createElement('div');
  intro.className = 'intro-banner';
  intro.textContent = theme === 'funny'  ? '奶奶出击！' :
                      theme === 'lotr'   ? '为了中土！' :
                                            '生 存';
  game.appendChild(intro);
  setTimeout(() => intro.remove(), 2500);

  running = true;
  setTimeout(() => {
    if (running) spawnEnemy();
  }, 600);

  if (theme === 'realistic') {
    scheduleLightning();
  }

  rafId = requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  Sound.stopBg();
  Sound.defeat();

  finalScr.textContent = score;
  loseScr.classList.remove('hidden');
  document.querySelectorAll('.zombie').forEach(z => z.remove());
  zombies = [];
}

function winGame() {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  Sound.stopBg();
  Sound.victory();

  const colors = ['#ff4466', '#ffaa33', '#44cc44', '#4488ff', '#cc44ff', '#ffd84a'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = (Math.random() * 100) + '%';
    c.style.top = '-20px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (2 + Math.random() * 3) + 's';
    c.style.animationDelay = (Math.random() * 1.5) + 's';
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    game.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }

  winTotal.textContent = TOTAL_WORDS;
  winLives.textContent = lives;
  winScr.classList.remove('hidden');
  document.querySelectorAll('.zombie').forEach(z => z.remove());
  zombies = [];
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', () => {
  loseScr.classList.add('hidden');
  setupScr.classList.remove('hidden');
  running = false;
  Sound.stopBg();
  if (rafId) cancelAnimationFrame(rafId);
});
winRestartBtn.addEventListener('click', () => {
  winScr.classList.add('hidden');
  setupScr.classList.remove('hidden');
  running = false;
  Sound.stopBg();
  if (rafId) cancelAnimationFrame(rafId);
});

muteBtn.addEventListener('click', () => {
  const m = !Sound.isMuted();
  Sound.setMuted(m);
  muteBtn.textContent = m ? '🔇 声音: 关' : '🔊 声音: 开';
  if (!m && running) Sound.startBg(theme);
});
</script>
