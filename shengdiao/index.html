<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chinese Tone Tetris</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');

  :root{
    --bg0:#07061a;
    --bg1:#0f0c29;
    --bg2:#1a1a3a;
    --accent:#10b981;
    --accent2:#3b82f6;
    --accent3:#f59e0b;
    --danger:#ef4444;
    --muted:#8b90b8;
    --glass:rgba(255,255,255,.06);
    --glass-brd:rgba(255,255,255,.12);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:'Nunito',-apple-system,"Segoe UI","PingFang SC",sans-serif;
    background:var(--bg0);
    color:#fff;overflow:hidden;user-select:none;
  }

  /* Анимированный фон */
  #bg-fx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  #bg-fx .blob{
    position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;
    animation:float 18s ease-in-out infinite;
  }
  #bg-fx .b1{width:420px;height:420px;background:#10b981;top:-120px;left:-100px;}
  #bg-fx .b2{width:380px;height:380px;background:#3b82f6;bottom:-120px;right:-100px;animation-delay:-6s;}
  #bg-fx .b3{width:300px;height:300px;background:#a855f7;top:40%;left:60%;animation-delay:-12s;opacity:.3;}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(30px,-30px) scale(1.1);}
  }

  #app{
    position:relative;z-index:1;
    display:flex;flex-direction:column;
    height:100vh;max-width:720px;margin:0 auto;
    background:rgba(10,10,30,.55);
    backdrop-filter:blur(20px);
    box-shadow:0 0 60px rgba(0,0,0,.6);
  }

  /* HUD */
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 18px;
    background:rgba(255,255,255,.03);
    border-bottom:1px solid var(--glass-brd);
    z-index:20;
  }
  header .stat{display:flex;flex-direction:column;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);}
  header .stat b{color:#fff;font-size:22px;font-weight:900;line-height:1;margin-top:3px;}
  header .stat b#combo{color:#ffd700;text-shadow:0 0 12px rgba(255,215,0,.6);}
  header .stat b#lives{color:#ff5a5a;text-shadow:0 0 12px rgba(255,90,90,.5);}

  /* Аудио контролы в хедере */
  .audio-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  .bgm-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--glass-brd);
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .bgm-btn:hover {
    background: rgba(255,255,255,0.2);
  }
  .volume-slider {
    -webkit-appearance: none;
    width: 60px;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #7ee0a0;
    box-shadow: 0 0 6px rgba(126,224,160,0.8);
    cursor: pointer;
  }

  #game-container{display:flex;flex:1;overflow:hidden;position:relative;}

  #playfield{position:relative;flex:1;overflow:hidden;border-right:1px solid var(--glass-brd);}

  /* История */
  #history-sidebar{
    width:118px;background:rgba(0,0,0,.25);
    display:flex;flex-direction:column;overflow:hidden;
  }
  #history-sidebar .title{
    text-align:center;font-size:11px;color:var(--muted);
    padding:10px 0;border-bottom:1px solid var(--glass-brd);
    text-transform:uppercase;letter-spacing:1.5px;
  }
  #history-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;}
  #history-list::-webkit-scrollbar{width:0;}

  .history-item{
    background:linear-gradient(135deg,rgba(16,185,129,.18),rgba(59,130,246,.12));
    border:1px solid rgba(16,185,129,.35);
    border-radius:10px;padding:6px;text-align:center;
    animation:slideIn .35s cubic-bezier(.175,.885,.32,1.275);
  }
  .history-item .hz{font-size:20px;font-weight:900;color:#fff;line-height:1.1;}
  .history-item .py{font-size:12px;color:#7ee0a0;font-weight:700;margin-top:2px;}
  @keyframes slideIn{from{transform:translateX(40px);opacity:0;}to{transform:translateX(0);opacity:1;}}

  /* Карточки */
  .tile{
    position:absolute;left:50%;transform:translateX(-50%);
    width:240px;padding:16px 20px 20px;
    background:linear-gradient(160deg,rgba(40,40,80,.9),rgba(20,20,50,.9));
    backdrop-filter:blur(12px);
    border:1px solid var(--glass-brd);border-radius:22px;
    text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);
    z-index:5;will-change:top,transform;
    transition:border-color .2s,box-shadow .2s,transform .4s,opacity .4s;
    display:flex;flex-direction:column;align-items:center;
  }
  .tile .slots{display:flex;justify-content:center;gap:10px;margin-bottom:8px;}
  .tile .slot{
    width:36px;height:36px;border-radius:11px;
    border:2px dashed rgba(255,255,255,.3);font-size:20px;
    display:flex;align-items:center;justify-content:center;
    color:#7ee0a0;font-weight:900;
    transition:all .2s;background:rgba(0,0,0,.2);
  }
  .tile .slot.filled{border-style:solid;border-color:#7ee0a0;background:rgba(126,224,160,.2);box-shadow:0 0 12px rgba(126,224,160,.6);}
  .tile .slot.filled.wrong{border-color:#ff4a4a;background:rgba(255,74,74,.2);box-shadow:0 0 12px rgba(255,74,74,.6);color:#ff8a8a;}

  .tile .pinyin-base{font-size:18px;color:#a0a5cc;margin-bottom:2px;letter-spacing:1px;font-weight:700;}
  .tile .hanzi{font-size:44px;font-weight:900;letter-spacing:3px;color:#fff;line-height:1.2;text-shadow:0 4px 14px rgba(0,0,0,.6);}

  .tile .timer-bar{
    position:absolute;bottom:0;left:0;height:6px;width:100%;
    background:rgba(0,0,0,.3);
    border-bottom-left-radius:22px;border-bottom-right-radius:22px;overflow:hidden;
  }
  .tile .timer-fill{height:100%;width:100%;background:#4caf50;transform-origin:left;transition:background .3s;}

  .tile.correct{border-color:#4caf50!important;box-shadow:0 0 34px rgba(76,175,80,.5),inset 0 0 22px rgba(76,175,80,.2);}
  .tile.wrong{border-color:#ff4a4a!important;box-shadow:0 0 34px rgba(255,74,74,.5),inset 0 0 22px rgba(255,74,74,.2);animation:shake .3s;}
  .tile.fly-down{transform:translateX(-50%) translateY(300px) scale(.8)!important;opacity:0;}
  .tile.fly-away{transform:translateX(300px) scale(.5) rotate(15deg)!important;opacity:0;}

  @keyframes shake{
    0%,100%{margin-left:0;}25%{margin-left:-8px;}75%{margin-left:8px;}
  }

  #feedback{
    position:absolute;left:50%;top:40%;transform:translateX(-50%) scale(.8);
    font-size:64px;font-weight:900;pointer-events:none;
    opacity:0;transition:all .2s cubic-bezier(.175,.885,.32,1.275);
    text-shadow:0 5px 20px rgba(0,0,0,.8);z-index:15;
  }
  #feedback.show{opacity:1;transform:translateX(-50%) scale(1);}

  /* Кнопки тонов */
  #controls{
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px;
    background:rgba(10,10,30,.7);
    backdrop-filter:blur(12px);
    border-top:1px solid var(--glass-brd);z-index:20;
  }
  #controls button{
    padding:18px 0;font-size:20px;font-weight:900;font-family:'Nunito',sans-serif;
    border:none;border-radius:16px;color:#fff;cursor:pointer;
    transition:all .1s;
    box-shadow:0 4px 15px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22);
    position:relative;overflow:hidden;
  }
  #controls button:active{transform:translateY(2px) scale(.96);box-shadow:0 2px 6px rgba(0,0,0,.35);}
  #controls button.t1{background:linear-gradient(135deg,#3b82f6,#2563eb);}
  #controls button.t2{background:linear-gradient(135deg,#10b981,#059669);}
  #controls button.t3{background:linear-gradient(135deg,#f59e0b,#d97706);}
  #controls button.t4{background:linear-gradient(135deg,#ef4444,#dc2626);}
  #controls button.t5{background:linear-gradient(135deg,#6b7280,#4b5563);font-size:15px;}

  /* Оверлеи */
  .overlay{
    position:absolute;inset:0;
    background:rgba(8,6,26,.92);
    backdrop-filter:blur(18px);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    gap:12px;z-index:30;text-align:center;padding:20px;overflow-y:auto;
  }
  .overlay::-webkit-scrollbar{width:4px;}
  .overlay::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px;}
  .overlay.hidden,.hidden{display:none!important;}

  .overlay h2{
    margin:6px 0;font-size:26px;font-weight:900;letter-spacing:1px;
    text-shadow:0 4px 24px rgba(0,0,0,.6);
    background:linear-gradient(90deg,#7ee0a0,#7aa8ff,#c084fc);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .overlay p{margin:0;color:var(--muted);line-height:1.45;font-size:14px;}

  .btn{
    padding:14px 40px;font-size:17px;font-weight:900;font-family:'Nunito',sans-serif;
    border:none;border-radius:16px;color:#fff;cursor:pointer;
    transition:all .2s;width:100%;max-width:340px;flex-shrink:0;
    box-shadow:0 6px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22);
    letter-spacing:.5px;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 2px 10px rgba(0,0,0,.35);}
  .btn.primary{background:linear-gradient(135deg,#10b981,#059669);}
  .btn.secondary{background:rgba(255,255,255,.08);border:1px solid var(--glass-brd);font-size:14px;padding:12px 20px;}
  .btn.danger{background:linear-gradient(135deg,#ef4444,#b91c1c);font-size:14px;padding:12px 20px;}
  .btn.ghost{background:transparent;border:1px solid var(--glass-brd);font-size:13px;padding:10px 18px;max-width:200px;color:var(--muted);}

  /* Списки наборов */
  .sets-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-bottom:6px;}
  .set-item{
    background:var(--glass);border:1px solid var(--glass-brd);
    border-radius:14px;padding:15px 16px;cursor:pointer;text-align:left;
    transition:all .2s;position:relative;
  }
  .set-item:hover{background:rgba(255,255,255,.1);border-color:rgba(126,224,160,.5);transform:translateY(-1px);}
  .set-item h4{margin:0 0 4px;font-size:16px;color:#fff;}
  .set-item p{margin:0;font-size:12px;color:var(--muted);}
  .set-item .delete-set-btn{
    position:absolute;right:10px;top:10px;
    background:rgba(239,68,68,.18);border:none;color:#ff8a8a;
    border-radius:8px;padding:4px 9px;cursor:pointer;font-weight:900;
  }

  /* Экран режимов */
  .modes-grid{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;}
  .mode-card{
    display:flex;align-items:center;gap:14px;
    background:var(--glass);border:1px solid var(--glass-brd);
    border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;
    transition:all .2s;
  }
  .mode-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.1);}
  .mode-card .icon{font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0;}
  .mode-card .info h4{margin:0 0 3px;font-size:16px;font-weight:800;}
  .mode-card .info p{margin:0;font-size:12px;color:var(--muted);}
  .mode-card.chill .icon{background:rgba(59,130,246,.2);}
  .mode-card.slow .icon{background:rgba(16,185,129,.2);}
  .mode-card.classic .icon{background:rgba(245,158,11,.2);}
  .mode-card.hardcore .icon{background:rgba(239,68,68,.2);}

  /* Редактор */
  #editor-overlay{align-items:stretch;justify-content:flex-start;text-align:left;}
  .editor-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .editor-header h3{margin:0;font-size:20px;}

  .add-form{
    display:flex;flex-direction:column;gap:10px;
    background:rgba(0,0,0,.25);padding:16px;border-radius:16px;
    border:1px solid var(--glass-brd);
  }
  .add-form textarea,.add-form input{
    padding:12px;border-radius:12px;border:1px solid var(--glass-brd);
    background:rgba(255,255,255,.05);color:#fff;font-size:15px;outline:none;
    font-family:'Nunito',sans-serif;
  }
  .add-form textarea{font-family:monospace;font-size:13px;resize:vertical;min-height:120px;}
  .add-form textarea:focus,.add-form input:focus{border-color:var(--accent);}
  .add-form .hint{font-size:12px;color:var(--muted);margin-bottom:-4px;}

  /* Ряд кнопок формы: кнопки делят ширину поровну */
  .form-row{
    display:flex;
    gap:10px;
    width:100%;
  }
  .form-row .btn{
    flex:1 1 0;
    width:auto;
    max-width:none;
    min-width:0;
    padding:12px 10px;
    font-size:14px;
  }

  @media (max-width:420px){
    .tile{width:210px;}
    .tile .hanzi{font-size:38px;}
    #history-sidebar{width:100px;}
  }
</style>
</head>
<body>
<div id="bg-fx">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div id="app">
  <header>
    <div class="stat">分数 <b id="score">0</b></div>
    <div class="stat">连击 <b id="combo">0</b></div>
    <div class="stat">生命 <b id="lives">3</b></div>
    
    <!-- Аудио контролы -->
    <div class="audio-controls">
      <button id="bgm-toggle" class="bgm-btn" title="Вкл/Выкл музыку">🔇</button>
      <input type="range" id="bgm-volume" min="0" max="1" step="0.05" value="0.5" class="volume-slider" title="Громкость">
    </div>
  </header>

  <div id="game-container">
    <div id="playfield">
      <div id="feedback"></div>

      <!-- ЭКРАН 1: Выбор набора -->
      <div id="set-select-screen" class="overlay">
        <h2>Chinese Tone Tetris</h2>
        <div style="font-size:14px;color:var(--muted);">Шаг 1 · Выберите набор слов</div>

        <!-- Блок создания набора — СВЕРХУ -->
        <button id="create-set-btn" class="btn secondary" style="margin:4px 0 8px;">+ Создать свой набор</button>

        <div id="create-set-form" class="add-form hidden" style="width:100%;max-width:340px;margin-top:8px;">
          <input type="text" id="new-set-title" placeholder="Название набора (например: Еда)">
          <textarea id="new-set-words" placeholder="我, wǒ&#10;你, nǐ&#10;我们, wǒmen"></textarea>
          <div class="form-row">
            <button id="save-set-btn" class="btn primary">Сохранить</button>
            <button id="cancel-set-btn" class="btn secondary">Отмена</button>
          </div>
        </div>

        <!-- Список существующих наборов — НИЖЕ -->
        <div class="sets-list" id="sets-list"></div>
      </div>

      <!-- ЭКРАН 2: Выбор режима -->
      <div id="mode-select-screen" class="overlay hidden">
        <h2>Выберите режим</h2>
        <div id="mode-set-label" style="font-size:14px;color:var(--muted);margin-bottom:6px;"></div>

        <div class="modes-grid">
          <div class="mode-card chill" data-mode="chill">
            <div class="icon">🌊</div>
            <div class="info"><h4>Chill</h4><p>Медленный · без ограничения жизней</p></div>
          </div>
          <div class="mode-card slow" data-mode="slow">
            <div class="icon">🌱</div>
            <div class="info"><h4>Slow</h4><p>Медленный · 3 жизни</p></div>
          </div>
          <div class="mode-card classic" data-mode="classic">
            <div class="icon">⚡</div>
            <div class="info"><h4>Classic</h4><p>Средняя скорость · 3 жизни</p></div>
          </div>
          <div class="mode-card hardcore" data-mode="hardcore">
            <div class="icon">🔥</div>
            <div class="info"><h4>Hardcore</h4><p>Быстрый · 3 жизни</p></div>
          </div>
        </div>

        <button id="back-to-sets-btn" class="btn ghost" style="margin-top:10px;">← Назад к наборам</button>
      </div>

      <!-- Game Over -->
      <div id="gameover-overlay" class="overlay hidden">
        <h2>游戏结束</h2>
        <p id="gameover-text">分数: 0</p>
        <div style="display:flex;flex-direction:column;gap:12px;width:100%;align-items:center;margin-top:20px;">
          <button id="restartBtn" class="btn primary">再来一次 / Ещё раз</button>
          <button id="change-mode-btn" class="btn secondary">Сменить режим</button>
          <button id="back-to-menu-btn" class="btn ghost">В меню</button>
        </div>
      </div>
    </div>

    <div id="history-sidebar">
      <div class="title">Собрано<br><span style="font-size:16px;font-weight:900;color:#7ee0a0;" id="history-count">0</span></div>
      <div id="history-list"></div>
    </div>
  </div>

  <div id="controls">
    <button class="t1" data-tone="1">1 ˉ</button>
    <button class="t2" data-tone="2">2 ˊ</button>
    <button class="t3" data-tone="3">3 ˇ</button>
    <button class="t4" data-tone="4">4 ˋ</button>
    <button class="t5" data-tone="5">5 轻</button>
  </div>
</div>

<!-- Аудио тег -->
<audio id="bgm-audio" loop></audio>

<script src="../cards/custom_study_plans/sets.js"></script>
<script>
window.BUILTIN_SETS = window.BUILTIN_SETS || [];

(function () {
  "use strict";

  // ===== ФОНОВАЯ МУЗЫКА (BGM) =====
  const bgmAudio = document.getElementById("bgm-audio");
  const bgmToggleBtn = document.getElementById("bgm-toggle");
  const bgmVolumeSlider = document.getElementById("bgm-volume");

  // Путь к аудио файлу (положите bgm.mp3 рядом с index.html)
  bgmAudio.src = "bg_music.mp3"; 

  let savedVolume = parseFloat(localStorage.getItem("bgm_volume"));
  if (isNaN(savedVolume)) savedVolume = 0.5;
  bgmAudio.volume = savedVolume;
  bgmVolumeSlider.value = savedVolume;

  let bgmEnabled = localStorage.getItem("bgm_enabled") !== "false";
  updateBgmButton();

  function updateBgmButton() {
    if (bgmEnabled) {
      bgmToggleBtn.textContent = "🔊";
      bgmToggleBtn.style.color = "#7ee0a0";
    } else {
      bgmToggleBtn.textContent = "🔇";
      bgmToggleBtn.style.color = "#a0a5cc";
    }
  }

  function tryPlayBgm() {
    if (bgmEnabled && bgmAudio.paused && bgmAudio.src) {
      bgmAudio.play().catch(e => { /* автоплей заблокирован */ });
    }
  }

  bgmToggleBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    bgmEnabled = !bgmEnabled;
    localStorage.setItem("bgm_enabled", bgmEnabled);
    updateBgmButton();
    if (bgmEnabled) {
      bgmAudio.play().catch(() => {});
    } else {
      bgmAudio.pause();
    }
  });

  bgmVolumeSlider.addEventListener("input", (e) => {
    const vol = parseFloat(e.target.value);
    bgmAudio.volume = vol;
    localStorage.setItem("bgm_volume", vol);
    if (vol > 0 && !bgmEnabled) {
      bgmEnabled = true;
      localStorage.setItem("bgm_enabled", true);
      updateBgmButton();
      bgmAudio.play().catch(() => {});
    }
  });

  // ===== АУДИО ЭФФЕКТЫ =====
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function initAudio(){ if(!audioCtx) audioCtx = new AudioCtx(); }
  function playSound(type){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if(type==='correct'){
      osc.type='sine';
      osc.frequency.setValueAtTime(880,audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200,audioCtx.currentTime+.1);
      gain.gain.setValueAtTime(.3,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.1);
      osc.start(); osc.stop(audioCtx.currentTime+.1);
    } else if(type==='wrong'){
      osc.type='sawtooth';
      osc.frequency.setValueAtTime(150,audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100,audioCtx.currentTime+.2);
      gain.gain.setValueAtTime(.3,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.2);
      osc.start(); osc.stop(audioCtx.currentTime+.2);
    }
  }
  
  document.body.addEventListener('click', () => {
    initAudio();
    tryPlayBgm();
  }, { once: true });
  document.body.addEventListener('touchstart', () => {
    initAudio();
    tryPlayBgm();
  }, { once: true });

  // ===== ПАРСЕР ПИНЬИНЯ =====
  function splitPinyinSyllables(str) {
    if (/\s/.test(str.trim())) {
      return str.trim().split(/\s+/);
    }
    const vowels = "aāáǎàeēéěèiīíǐìoōóǒòuūúǔùüǖǘǚǜv";
    const isVowel = c => vowels.includes(c);
    const syllables = [];
    let cur = "";
    for (let i = 0; i < str.length; i++) {
      const c = str[i];
      cur += c;
      if (isVowel(c)) {
        const next = str[i + 1];
        const next2 = str[i + 2];
        if (next && !isVowel(next) && next !== " " &&
            next2 && isVowel(next2)) {
          syllables.push(cur);
          cur = "";
        }
      }
    }
    if (cur) syllables.push(cur);
    return syllables.filter(Boolean);
  }

  function extractTones(pinyinWithTones) {
    const toneMarks = {
      'ā': ['a', 1], 'á': ['a', 2], 'ǎ': ['a', 3], 'à': ['a', 4],
      'ē': ['e', 1], 'é': ['e', 2], 'ě': ['e', 3], 'è': ['e', 4],
      'ī': ['i', 1], 'í': ['i', 2], 'ǐ': ['i', 3], 'ì': ['i', 4],
      'ō': ['o', 1], 'ó': ['o', 2], 'ǒ': ['o', 3], 'ò': ['o', 4],
      'ū': ['u', 1], 'ú': ['u', 2], 'ǔ': ['u', 3], 'ù': ['u', 4],
      'ǖ': ['ü', 1], 'ǘ': ['ü', 2], 'ǚ': ['ü', 3], 'ǜ': ['ü', 4]
    };

    const syllables = splitPinyinSyllables(pinyinWithTones);
    const tones = [];
    const bases = [];

    for (const syl of syllables) {
      let tone = 0;
      let base = "";
      for (const ch of syl) {
        if (toneMarks[ch]) {
          tone = toneMarks[ch][1];
          base += toneMarks[ch][0];
        } else {
          base += ch;
        }
      }
      tones.push(tone || 5);
      bases.push(base);
    }

    return { basePinyin: bases.join(" "), tones };
  }

  // ===== НАБОРЫ =====
  let customSets=[];
  try{ const s=localStorage.getItem("chinese_tone_sets"); if(s) customSets=JSON.parse(s);}catch(e){}
  function saveCustomSets(){ localStorage.setItem("chinese_tone_sets", JSON.stringify(customSets)); }

  // ===== РЕЖИМЫ =====
  const MODES = {
    chill:    { label:"Chill",    fallSpeed: 14, spawnInterval: 2400, lives: Infinity },
    slow:     { label:"Slow",     fallSpeed: 18, spawnInterval: 2000, lives: 3 },
    classic:  { label:"Classic",  fallSpeed: 26, spawnInterval: 1500, lives: 3 },
    hardcore: { label:"Hardcore", fallSpeed: 44, spawnInterval: 950,  lives: 3 }
  };

  // ===== СОСТОЯНИЕ =====
  const state = {
    running:false, score:0, combo:0, lives:3,
    tiles:[], lastSpawn:0, lastTs:0, rafId:null,
    fallSpeed:25, spawnInterval:1500, maxLives:3, historyCount:0
  };
  let currentWords=[];
  let wordQueue=[];
  let selectedSet=null;
  let selectedModeKey="classic";

  const $ = id => document.getElementById(id);
  const playfield=$("playfield"), scoreEl=$("score"), comboEl=$("combo"), livesEl=$("lives"), feedback=$("feedback");
  const setScreen=$("set-select-screen"), modeScreen=$("mode-select-screen"), gameoverOverlay=$("gameover-overlay"), gameoverText=$("gameover-text");
  const historyList=$("history-list"), historyCountEl=$("history-count");
  const setsListEl=$("sets-list"), createSetBtn=$("create-set-btn"), createSetForm=$("create-set-form");
  const saveSetBtn=$("save-set-btn"), cancelSetBtn=$("cancel-set-btn");
  const modeSetLabel=$("mode-set-label");

  // ===== РЕНДЕР НАБОРОВ =====
  function renderSets(){
    setsListEl.innerHTML="";
    const builtin = window.BUILTIN_SETS || [];
    
    // ВАЖНО: Кастомные наборы идут ПЕРВЫМИ, затем встроенные
    const all = [...customSets, ...builtin];
    
    if(all.length===0){
      setsListEl.innerHTML="<div style='color:#8b90b8;padding:10px;'>Нет наборов. Создайте свой!</div>";
      return;
    }
    all.forEach((set,index)=>{
      // Так как кастомные идут первыми, индекс кастомного набора — это просто index
      const isCustom = index < customSets.length;
      const realIndex = isCustom ? index : -1;

      const div = document.createElement("div");
      div.className="set-item";
      div.innerHTML = `
        <h4>${set.title} ${isCustom ? '<span style="font-size:10px; color:#7ee0a0; border:1px solid #7ee0a0; padding:1px 4px; border-radius:4px; vertical-align:middle; margin-left:6px;">Мой</span>' : ''}</h4>
        <p>Слов: ${set.words.length}</p>
        ${isCustom ? `<button class="delete-set-btn" data-idx="${realIndex}">✕</button>`:""}
      `;
      div.addEventListener("click", e=>{
        if(e.target.classList.contains("delete-set-btn")) return;
        selectedSet = set;
        showModeScreen();
      });
      if(isCustom){
        div.querySelector(".delete-set-btn").onclick = e=>{
          e.stopPropagation();
          if(confirm("Удалить этот набор?")){
            customSets.splice(realIndex,1); saveCustomSets(); renderSets();
          }
        };
      }
      setsListEl.appendChild(div);
    });
  }

  // ===== ПЕРЕХОДЫ МЕЖДУ ЭКРАНАМИ =====
  function showSetScreen(){
    setScreen.classList.remove("hidden");
    modeScreen.classList.add("hidden");
    gameoverOverlay.classList.add("hidden");
  }
  function showModeScreen(){
    setScreen.classList.add("hidden");
    modeScreen.classList.remove("hidden");
    gameoverOverlay.classList.add("hidden");
    modeSetLabel.textContent = selectedSet ? `Набор: ${selectedSet.title}` : "";
  }

  // ===== ФОРМА СОЗДАНИЯ НАБОРА =====
  createSetBtn.addEventListener("click", ()=>{
    createSetForm.classList.remove("hidden");
    createSetBtn.classList.add("hidden");
  });
  cancelSetBtn.addEventListener("click", ()=>{
    createSetForm.classList.add("hidden");
    createSetBtn.classList.remove("hidden");
  });
  saveSetBtn.addEventListener("click", ()=>{
    const title = $("new-set-title").value.trim() || "Мой набор";
    const text = $("new-set-words").value.trim();
    if(!text){ alert("Введите слова!"); return; }
    const words=[];
    text.split("\n").forEach(line=>{
      line=line.trim(); if(!line) return;
      const parts=line.split(/[,\t]+/).map(s=>s.trim()).filter(Boolean);
      if(parts.length>=2) words.push({word:parts[0], pinyin:parts[1]});
    });
    if(words.length===0){ alert("Не удалось распознать слова."); return; }
    customSets.push({title, words}); saveCustomSets(); renderSets();
    $("new-set-title").value=""; $("new-set-words").value="";
    createSetForm.classList.add("hidden"); createSetBtn.classList.remove("hidden");
  });

  // ===== ВЫБОР РЕЖИМА =====
  modeScreen.querySelectorAll(".mode-card").forEach(card=>{
    card.addEventListener("click", ()=>{
      selectedModeKey = card.dataset.mode;
      const mode = MODES[selectedModeKey];
      startGameWithSet(selectedSet.words, mode);
    });
  });
  $("back-to-sets-btn").addEventListener("click", showSetScreen);

  // ===== ИГРОВАЯ ЛОГИКА =====
  function canSpawn(){
    if(state.tiles.length===0) return true;
    let top=null;
    for(const t of state.tiles){ if(!top || t.y<top.y) top=t; }
    const h = top.el.offsetHeight || 130;
    return top.y > h + 20;
  }

  function spawnTile(){
    if(wordQueue.length===0) wordQueue = [...currentWords].sort(()=>Math.random()-.5);
    const raw = wordQueue.shift(); if(!raw) return;
    const parsed = extractTones(raw.pinyin);
    const wordObj = {
      hanzi: raw.word,
      pinyinBase: parsed.basePinyin,
      pinyinToned: raw.pinyin,
      tones: parsed.tones
    };
    const el = document.createElement("div");
    el.className="tile";
    const slotsHtml = wordObj.tones.map(()=>'<div class="slot"></div>').join("");
    el.innerHTML =
      '<div class="slots">'+slotsHtml+'</div>'+
      '<div class="pinyin-base">'+wordObj.pinyinBase+'</div>'+
      '<div class="hanzi">'+wordObj.hanzi+'</div>'+
      '<div class="timer-bar"><div class="timer-fill"></div></div>';
    el.style.top="-150px";
    playfield.appendChild(el);
    const tile = {
      el, word: wordObj, answered:0, y:-150, speed: state.fallSpeed,
      timerFill: el.querySelector(".timer-fill"), resolved:false
    };
    state.tiles.push(tile);
  }

  function toneArrow(t){ return {1:"ˉ",2:"ˊ",3:"ˇ",4:"ˋ",5:"·",0:"·"}[t]||"?"; }

  function onToneInput(tone){
    if(!state.running) return;
    let target=null;
    for(const t of state.tiles){ if(!t.resolved && (!target || t.y>target.y)) target=t; }
    if(!target) return;

    let expected = target.word.tones[target.answered];
    if(expected===0) expected=5;
    const slotEls = target.el.querySelectorAll(".slot");

    if(tone===expected){
      playSound("correct");
      if(slotEls[target.answered]){
        slotEls[target.answered].classList.add("filled");
        slotEls[target.answered].textContent = toneArrow(tone);
      }
      target.answered++;
      target.el.classList.add("correct");
      setTimeout(()=>target.el.classList.remove("correct"),150);

      if(target.answered === target.word.tones.length){
        target.resolved = true;
        state.combo++;
        state.score += 10 * Math.min(state.combo,5);
        updateHud();
        showFeedback("✓","#4caf50");
        addHistory(target.word);
        setTimeout(()=>{
          target.el.classList.add("fly-away");
          setTimeout(()=>removeTile(target),400);
        },800);
      }
    } else {
      playSound("wrong");
      if(slotEls[target.answered]){
        slotEls[target.answered].classList.add("filled","wrong");
        slotEls[target.answered].textContent = toneArrow(tone);
      }
      state.combo = 0;
      if(state.maxLives < 900) state.lives--;
      updateHud();
      target.el.classList.add("wrong");
      showFeedback("✗","#ff4a4a");
      target.resolved = true;
      wordQueue.push(target.word);
      setTimeout(()=>{
        target.el.classList.add("fly-down");
        setTimeout(()=>removeTile(target),400);
      },1000);
      if(state.maxLives < 900 && state.lives<=0) gameOver();
    }
  }

  function removeTile(tile){
    if(tile.el.parentNode) tile.el.parentNode.removeChild(tile.el);
    const i = state.tiles.indexOf(tile);
    if(i!==-1) state.tiles.splice(i,1);
  }

  let feedbackTimer=null;
  function showFeedback(text,color){
    feedback.textContent=text; feedback.style.color=color;
    feedback.classList.add("show");
    clearTimeout(feedbackTimer);
    feedbackTimer=setTimeout(()=>feedback.classList.remove("show"),350);
  }

  function addHistory(word){
    state.historyCount++;
    historyCountEl.textContent = state.historyCount;
    const div=document.createElement("div");
    div.className="history-item";
    div.innerHTML=`<div class="hz">${word.hanzi}</div><div class="py">${word.pinyinToned}</div>`;
    historyList.insertBefore(div, historyList.firstChild);
  }

  function updateHud(){
    scoreEl.textContent = state.score;
    comboEl.textContent = state.combo;
    livesEl.textContent = state.maxLives >= 900 ? "∞" : state.lives;
  }

  function loop(ts){
    if(!state.running) return;
    if(!state.lastTs) state.lastTs = ts;
    const dt = Math.min((ts-state.lastTs)/1000, .1);
    state.lastTs = ts;

    if(ts - state.lastSpawn > state.spawnInterval){
      if(canSpawn()){ state.lastSpawn = ts; spawnTile(); }
    }

    const fieldH = playfield.clientHeight;
    for(let i=state.tiles.length-1;i>=0;i--){
      const t = state.tiles[i];
      if(t.resolved) continue;
      t.y += t.speed*dt;
      t.el.style.top = t.y+"px";
      const progress = Math.max(0, 1-(t.y/(fieldH-100)));
      t.timerFill.style.transform = "scaleX("+progress+")";
      if(progress<.3) t.timerFill.style.background="#ff4a4a";
      else if(progress<.6) t.timerFill.style.background="#f59e0b";

      if(t.y + t.el.offsetHeight >= fieldH){
        playSound("wrong");
        state.combo = 0;
        if(state.maxLives < 900) state.lives--;
        updateHud();
        showFeedback("⌛","#f59e0b");
        wordQueue.push(t.word);
        t.el.classList.add("wrong");
        t.resolved = true;
        setTimeout(()=>removeTile(t),1000);
        if(state.maxLives < 900 && state.lives<=0) gameOver();
      }
    }
    state.rafId = requestAnimationFrame(loop);
  }

  function startGameWithSet(words, mode){
    if(!words || words.length===0) return;
    initAudio();
    currentWords = words;
    selectedModeKey = Object.keys(MODES).find(k=>MODES[k]===mode) || "classic";

    state.tiles.forEach(t=>{ if(t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    state.tiles = [];
    state.score = 0;
    state.combo = 0;
    state.maxLives = mode.lives;
    state.lives = mode.lives === Infinity ? 9999 : mode.lives;
    state.fallSpeed = mode.fallSpeed;
    state.spawnInterval = mode.spawnInterval;
    state.lastTs = 0;
    state.lastSpawn = 0;
    state.historyCount = 0;
    wordQueue = [];

    historyList.innerHTML = "";
    historyCountEl.textContent = "0";
    updateHud();

    setScreen.classList.add("hidden");
    modeScreen.classList.add("hidden");
    gameoverOverlay.classList.add("hidden");

    state.running = true;
    state.rafId = requestAnimationFrame(loop);
  }

  function gameOver(){
    state.running = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    gameoverOverlay.classList.remove("hidden");
    gameoverText.innerHTML = "分数: <b>"+state.score+"</b><br>Попробуй ещё раз!";
  }

  // ===== ВВОД =====
  document.addEventListener("keydown", e=>{
    if(state.running && e.key>="1" && e.key<="5" && !e.code.startsWith("Numpad")){
      onToneInput(parseInt(e.key,10));
    }
  });
  $("controls").addEventListener("click", e=>{
    const btn = e.target.closest("button[data-tone]");
    if(btn && state.running) onToneInput(parseInt(btn.dataset.tone,10));
  });

  // ===== КНОПКИ GAME OVER =====
  $("restartBtn").addEventListener("click", ()=>{
    if(selectedSet) startGameWithSet(selectedSet.words, MODES[selectedModeKey]);
  });
  $("change-mode-btn").addEventListener("click", ()=>{
    gameoverOverlay.classList.add("hidden");
    showModeScreen();
  });
  $("back-to-menu-btn").addEventListener("click", ()=>{
    state.running = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    gameoverOverlay.classList.add("hidden");
    selectedSet = null;
    showSetScreen();
  });

  // ===== СТАРТ =====
  renderSets();
})();
</script>
</body>
</html>
